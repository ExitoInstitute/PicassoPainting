te\" [enlace al formulario de estimado a confirmar]", "pasos": ["Sube v14 «VIDEO COMPLETE HOUSE 2026-11-16.mov» completo (14 s) a una historia.", "Escribe «Prepped right. Checked by the owner before we left.» en fuente Clásica, blanco, fondo #142f42, arriba.", "Agrega el sticker de enlace «Free estimate» con [enlace al formulario de estimado a confirmar]. Si aún no existe, escribe «Comment ESTIMATE on today's reel» en su lugar.", "Publica a las 4:00 p. m. hora del Pacífico."]}], "cuenta": "PP", "dia": "Viernes"}, {"fecha": "2027-01-09", "semana": 6, "formato": "Carrusel", "objetivo": "Venta", "tema": "Caso real: casa azul a gris", "tipo_gancho": "Antes y después", "gancho_texto": "Same house. Before we touched it.", "gancho_hablado": "Same house. Before we touched it.", "visual": "Slide 1: foto real «PHOTO 2026-11-06.JPG» de la casa azul antes, a página completa, con el texto en caja #142f42 arriba.", "desarrollo": ["Slide 1: \"Same house. Before we touched it.\" (foto \"PHOTO 2026-11-06.JPG\")", "Slide 2: \"Another angle of the before.\" (foto \"PHOTO 2026-11-06 5.JPG\")", "Slide 3: \"First, plastic goes over everything that isn't getting paint.\" (foto \"PHOTO 2026-11-06 1.JPG\")", "Slide 4: \"Windows and edges covered before the first coat.\" (foto \"PHOTO 2026-11-06 2.JPG\")", "Slide 5: \"After.\" (foto \"PHOTO COMPLETE HOUSE 2026-11-16.JPG\")", "Slide 6: \"Checked by the owner before the crew left.\" (foto \"PHOTO HOUSE EXT 2026-11-16.JPG\")", "Slide 7: \"Thinking about your outside for spring? Comment ESTIMATE. Planning now doesn't mean painting now.\" (fondo #142f42, foto \"PHOTO HOUSE EXT 2026-11-16 2.JPG\" pequeña arriba, logo abajo)"], "cta": "Comment ESTIMATE for the free estimate form.", "caption": "Blue before, gray after. Same house.\nSwipe through the middle slides: that's the part nobody posts, the covering and taping before the first coat.\nThinking about your outside for spring? Comment ESTIMATE and we'll send the free estimate form.", "calculadora": null, "produccion": null, "clip": null, "notas": "Prueba real con fotos propias. No mostrar número de casa, placas de autos ni nombre de calle: si aparecen, difumínalos. Si el cliente da permiso para una frase suya, agrégala en la slide 6 [caso real a confirmar]. Segundo aviso suave del estimado de exterior para primavera.", "instrucciones": ["En Canva crea un diseño de 1080×1350 con 7 páginas. Pon cada foto de la ficha a página completa en su slide.", "Revisa cada foto: si se ve el número de la casa, una placa de auto o el nombre de la calle, cúbrelo con la herramienta Difuminar de Canva al 80%.", "En las slides 1 a 6 pon el texto en una caja #142f42 al 85% arriba, con Georgia Bold 56 pt color #f8f7f2. En la slide 5 el texto «After.» va en Georgia Bold 90 pt.", "Slide 7: fondo #142f42, la foto «PHOTO HOUSE EXT 2026-11-16 2.JPG» en un recuadro de 900×500 px arriba, el texto en Montserrat Bold 44 pt color #f8f7f2 con ESTIMATE en dorado #ae9168, y el logo horizontal abajo a 500 px de ancho.", "Exporta en PNG y publica el sábado 9 de enero a la 1:00 p. m. hora del Pacífico con el caption de esta ficha.", "A quien comente ESTIMATE respóndele «Sent! Check your DMs.» y manda por DM el formulario [enlace al formulario de estimado a confirmar] y los teléfonos (650) 207-1772 y (415) 238-0797.", "Si alguien pregunta cuánto costó o cuánto tardó, responde «Every house is different, so Nain gives you the number after seeing yours. The estimate is free.» No des cifras."], "historias": [{"proposito": "Prueba: el antes y el después en una sola pantalla", "formato": "Imagen dividida antes/después con deslizador", "contenido": "Arriba la casa azul antes con la etiqueta \"Before\", abajo la casa gris terminada con la etiqueta \"After\".", "interaccion": "Deslizador con emoji 😍 y el texto \"How much do you like the after?\"", "pasos": ["En Canva crea una imagen de 1080×1920 dividida en dos mitades: arriba «PHOTO 2026-11-06.JPG», abajo «PHOTO COMPLETE HOUSE 2026-11-16.JPG».", "Pon la etiqueta «Before» en la esquina superior izquierda de la foto de arriba y «After» en la de abajo, Montserrat Bold 40 pt blanco con fondo #142f42.", "Súbela a una historia y agrega el deslizador con emoji 😍 y el texto «How much do you like the after?» justo en la línea que divide las fotos.", "Publica a las 9:00 a. m. hora del Pacífico."]}, {"proposito": "Prueba en movimiento: la casa terminada", "formato": "Clip del stock con texto", "contenido": "Clip v14 con el texto: \"Finished. And the flowers made it.\"", "interaccion": "Encuesta: \"Would you go gray too?\" / \"Yes\" / \"I'd keep the blue\"", "pasos": ["Sube v14 «VIDEO COMPLETE HOUSE 2026-11-16.mov» completo (14 s) a una historia.", "Escribe «Finished. And the flowers made it.» en fuente Clásica, blanco, fondo #142f42, arriba.", "Agrega el sticker de encuesta con la pregunta «Would you go gray too?» y las opciones «Yes» y «I'd keep the blue».", "Publica a las 4:00 p. m. hora del Pacífico."]}], "cuenta": "PP", "dia": "Sábado"}, {"fecha": "2027-01-10", "semana": 6, "formato": "Imagen", "objetivo": "Autoridad", "tema": "El dueño hace el estimado", "tipo_gancho": "Frase real del dueño", "gancho_texto": "The owner comes to your house for the estimate", "gancho_hablado": "\"I still do the estimates myself.\"", "visual": "Foto real de Nain con las furgonetas (img/nain.jpg) a página completa. Abajo, franja #142f42 con la cita «I still do the estimates myself.» en Georgia Italic crema y «Nain Carvallo, owner» debajo.", "desarrollo": ["Image text: \"I still do the estimates myself.\"", "Line under it: \"Nain Carvallo, owner, Picasso Painting & Scaffolding\"", "Bottom: \"Free estimates. Link in bio.\" and the logo"], "cta": "Comment ESTIMATE or call (650) 207-1772 for a free estimate.", "caption": "When you ask us for an estimate, Nain comes out. He's been painting for about twenty years and still walks every house himself.\nInside work this winter, or the outside for spring, the estimate is free.\nComment ESTIMATE, or call (650) 207-1772 or (415) 238-0797.", "calculadora": null, "produccion": null, "clip": null, "notas": "Cita real de Nain de la reunión, traducida. Usar «link in bio» porque la web nueva no está publicada [enlace a confirmar].", "instrucciones": ["En Canva crea un diseño de 1080×1350 con la foto img/nain.jpg a página completa.", "Agrega abajo un rectángulo de 1080×420 px color #142f42 al 90%.", "Dentro escribe «I still do the estimates myself.» en Georgia Italic 60 pt color #f8f7f2, centrado, con comillas.", "Debajo «Nain Carvallo, owner, Picasso Painting & Scaffolding» en Montserrat Medium 28 pt color #ae9168.", "Abajo del todo «Free estimates. Link in bio.» en Montserrat Bold 26 pt color #f8f7f2 y a la derecha el logo horizontal a 300 px de ancho.", "Exporta en PNG y publica el domingo 10 de enero a las 12:00 p. m. hora del Pacífico con el caption de esta ficha.", "A quien comente ESTIMATE respóndele «Sent! Check your DMs.» y manda por DM el formulario [enlace al formulario de estimado a confirmar] y los teléfonos (650) 207-1772 y (415) 238-0797."], "historias": [{"proposito": "Invitar a pedir el estimado con los datos de contacto a mano", "formato": "Imagen creada con teléfonos y sticker de enlace", "contenido": "Texto: \"Free estimate, done by the owner. Call (650) 207-1772 or (415) 238-0797.\"", "interaccion": "Sticker de enlace \"Get a free estimate\" [enlace al formulario de estimado a confirmar]", "pasos": ["En Canva crea una imagen de 1080×1920 con fondo #f8f7f2, el logo horizontal arriba a 700 px y el texto «Free estimate, done by the owner.» en Georgia Bold 64 pt color #142f42.", "Debajo escribe «Call (650) 207-1772 or (415) 238-0797.» en Montserrat Bold 40 pt color #1b628d.", "Súbela a una historia y agrega el sticker de enlace «Get a free estimate» con [enlace al formulario de estimado a confirmar]. Si aún no existe, escribe «Link in bio» debajo de los teléfonos.", "Publica a las 9:00 a. m. hora del Pacífico."]}, {"proposito": "Abrir la conversación del exterior para primavera, sin presión", "formato": "Foto del stock con encuesta", "contenido": "Foto de la casa blanca con escalera y el texto: \"This year, what comes first at your place?\"", "interaccion": "Encuesta: \"Inside\" / \"Outside\"", "pasos": ["Sube la foto «PHOTO 2026-11-16 1.JPG» a una historia.", "Escribe «This year, what comes first at your place?» en fuente Clásica, blanco, fondo #142f42, arriba.", "Agrega el sticker de encuesta con «Inside» y «Outside».", "Publica a las 4:00 p. m. hora del Pacífico.", "Al día siguiente, a quien votó «Outside» escríbele por DM: «Thanks for voting! If you'd like, we can do the estimate this winter so the plan is ready for the dry months. Just reply ESTIMATE.»"]}], "cuenta": "PP", "dia": "Domingo"}, {"fecha": "2027-01-11", "semana": 7, "formato": "Reel", "objetivo": "Seguidores", "tema": "Qué revisar antes de contratar pintor", "tipo_gancho": "Advertencia antes de una decisión", "gancho_texto": "Before a painter steps inside your house, check this", "gancho_hablado": "Before a painter steps inside your house, check this", "visual": "Segundos 0–2: v13, casa blanca de dos pisos con escalera y la furgoneta al frente. Texto arriba en caja #142f42: «Before a painter steps inside your house, check this».", "desarrollo": ["0–3 s: \"Before a painter steps inside your house, check this\" (debajo: v13 \"VIDEO 2026-11-16 1.mov\", segundos 0–3)", "3–10 s: \"One: the license. In California you can look up any contractor's license number on the state board's website.\" (debajo: v13 \"VIDEO 2026-11-16 1.mov\", segundos 4–11)", "10–16 s: \"Ours is CSLB #1130045, for painting and for scaffolding.\" (debajo: foto img/nain.jpg, 6 s con zoom lento)", "16–23 s: \"Two: insurance. Ask before anyone climbs a ladder at your house.\" (debajo: v3 \"VIDEO 2026-11-06 2.MP4\", segundos 0–7)", "23–30 s: \"Three: the guarantee, in writing. What it covers and what it doesn't.\" (debajo: v2 \"VIDEO 2026-11-06 1.MP4\", segundos 10–17)", "30–37 s: \"Ours covers our work for 4 years if paint peels or bubbles because of how we did it.\" (debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 0–7)", "37–44 s: \"This week we're going through what a clear painting estimate should say, line by line.\" (debajo: v4 \"VIDEO 2026-11-06 3.MP4\", segundos 0–7)", "44–49 s: \"Follow along so you have it when the quotes start coming in.\" (debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 7–12, con el logo horizontal abajo)"], "cta": "Follow along: this week we go through what a painting estimate should say, line by line.", "caption": "Three things to check before you hire anyone to paint your house: license, insurance and a written guarantee.\nOurs: CSLB #1130045, insured, and 4 years on our work.\nAll week we're breaking down what a clear estimate should say. Follow along if quotes are on your list this year.", "calculadora": 14, "produccion": "Video de obra + texto", "clip": null, "notas": "Semana 7. La razón para seguir es concreta: la serie de la semana sobre cómo leer un estimado. La garantía se describe tal como está confirmada; lo que no cubre va en el estimado.", "instrucciones": ["Abre un proyecto nuevo en CapCut en 9:16 y pon en este orden: v13 «VIDEO 2026-11-16 1.mov» segundos 0–3 y 4–11, foto img/nain.jpg 6 s con zoom lento de 100% a 110%, v3 «VIDEO 2026-11-06 2.MP4» segundos 0–7, v2 «VIDEO 2026-11-06 1.MP4» segundos 10–17, v14 «VIDEO COMPLETE HOUSE 2026-11-16.mov» segundos 0–7, v4 «VIDEO 2026-11-06 3.MP4» segundos 0–7, v14 segundos 7–12.", "Quita el sonido original de todos los clips.", "Textos en pantalla: copia cada texto del desarrollo en su segundo. Montserrat Bold 56 pt, blanco, caja #142f42 al 85%, tercio superior. Las palabras «One», «Two» y «Three» van en dorado #ae9168.", "Logo horizontal (img/logo-horizontal.png) abajo al centro en los segundos 44–49.", "Música: instrumental acústica tranquila, sin letra, de la biblioteca de Instagram, al 30%. Sin voz.", "Portada: cuadro del segundo 1 de v13 con el texto «Before a painter steps inside your house, check this» en Georgia Bold blanco sobre caja #142f42.", "Publica el lunes 11 de enero a las 6:00 p. m. hora del Pacífico con el caption de esta ficha.", "Comentarios: si preguntan dónde se busca la licencia, responde «On the Contractors State License Board website (cslb.ca.gov). Type in the license number and it shows if it's active.» Si escriben ESTIMATE, manda por DM el formulario [enlace al formulario de estimado a confirmar] y los teléfonos."], "historias": [{"proposito": "Cercanía: un vistazo al trabajo del día", "formato": "Clip del stock con texto", "contenido": "Clip v4 con el texto: \"Monday. Tall ladder, steady hands.\"", "interaccion": "Sticker de reacción con emoji 🪜", "pasos": ["Sube v4 «VIDEO 2026-11-06 3.MP4» completo (7 s) a una historia.", "Escribe «Monday. Tall ladder, steady hands.» en fuente Clásica, blanco, fondo #142f42, arriba.", "Agrega el sticker de deslizador con emoji 🪜.", "Publica a las 9:00 a. m. hora del Pacífico."]}, {"proposito": "Cercanía con un dato útil: dónde mirar nuestra licencia", "formato": "Imagen creada con encuesta", "contenido": "Texto: \"Our license: CSLB #1130045. Look it up anytime.\" Pregunta: \"Have you ever checked a contractor's license before hiring?\"", "interaccion": "Encuesta: \"Yes\" / \"Not yet\"", "pasos": ["En Canva crea una imagen de 1080×1920 con fondo #eaf0ec y el texto «Our license: CSLB #1130045. Look it up anytime.» en Georgia Bold 60 pt color #142f42, arriba. Logo horizontal abajo a 600 px.", "Súbela a una historia y agrega la encuesta «Have you ever checked a contractor's license before hiring?» con «Yes» y «Not yet».", "Publica a las 4:00 p. m. hora del Pacífico.", "A quien vote «Not yet» escríbele por DM: «It takes a minute: go to cslb.ca.gov and type in the license number. Happy to help if you have questions.»"]}], "cuenta": "PP", "dia": "Lunes"}, {"fecha": "2027-01-12", "semana": 7, "formato": "Carrusel", "objetivo": "Guardado", "tema": "Cómo leer un estimado de pintura", "tipo_gancho": "Comparación que preocupa", "gancho_texto": "Two painting quotes can look alike and cover different work", "gancho_hablado": "Two quotes can look alike and cover different work", "visual": "Slide 1: fondo crema #f8f7f2 con dos hojas dibujadas lado a lado (rectángulos blancos con líneas grises) y el título en Georgia Bold #142f42 arriba.", "desarrollo": ["Slide 1: \"Two quotes can look alike and cover different work\" (diseño: dos hojas dibujadas lado a lado sobre fondo crema)", "Slide 2: \"Is the license number on it? Look it up on the state board's website.\" (foto \"PHOTO 2026-11-16 1.JPG\")", "Slide 3: \"Does it say what prep is included? Washing, repairs, covering floors and plants.\" (foto \"PHOTO 2026-11-06 1.JPG\")", "Slide 4: \"Does it say how many coats? Ours: one sealing coat and two coats of paint.\" (foto \"PHOTO HOUSE PROGRESS EXT 2026-11-17 2.jpg\")", "Slide 5: \"Is the guarantee in writing, and does it say what isn't covered?\" (fondo #142f42, texto crema)", "Slide 6: \"If you need scaffolding, is it its own line? Then you know what you're paying for.\" (foto \"PHOTO-2026-09-23-14-29-39.jpg\")", "Slide 7: \"Who cleans up, and when? We clean every day.\" (foto \"PHOTO COMPLETE HOUSE 2026-11-16.JPG\")", "Slide 8: \"Save this and keep it next to the quotes you get.\" (fondo #142f42, logo abajo)"], "cta": "Save this and keep it next to the quotes you get.", "caption": "The cheapest-looking quote might be missing half the prep. Or the guarantee. Or the scaffolding.\nHere's what to look for, line by line, before you sign anything.\nSave it for when the quotes come in.", "calculadora": null, "produccion": null, "clip": null, "notas": "Semana 7, leer un estimado. No se compara con ninguna empresa con nombre. No se dan precios.", "instrucciones": ["En Canva crea un diseño de 1080×1350 con 8 páginas.", "Slide 1: fondo #f8f7f2. Dibuja dos rectángulos blancos de 380×500 px lado a lado, con borde #dbe2de de 3 px y seis líneas grises horizontales dentro de cada uno. Título arriba en Georgia Bold 64 pt color #142f42.", "Slides 2, 3, 4, 6 y 7: foto de la ficha a página completa y el texto en una caja #142f42 al 85% abajo, Montserrat Bold 44 pt color #f8f7f2. La pregunta de cada slide va en blanco y la respuesta («Ours: …», «We clean every day.») en dorado #ae9168.", "Slide 5: fondo #142f42, texto en Georgia Bold 60 pt color #f8f7f2, centrado.", "Slide 8: fondo #142f42, texto en Georgia Bold 64 pt color #f8f7f2 y logo horizontal abajo a 500 px.", "Revisa que en ninguna foto se vea el número de casa ni placas; si se ven, difumínalos al 80%.", "Exporta en PNG y publica el martes 12 de enero a la 1:00 p. m. hora del Pacífico con el caption de esta ficha.", "Comentarios: si alguien pide revisar un estimado de otra empresa, responde «We can't review other companies' quotes, but we're happy to give you ours to compare. Comment ESTIMATE.»"], "historias": [{"proposito": "Problema común: estimados que no dicen qué incluyen", "formato": "Imagen creada con encuesta", "contenido": "Texto: \"Ever gotten a quote that didn't say what was included?\"", "interaccion": "Encuesta: \"Yes, more than once\" / \"No\"", "pasos": ["En Canva crea una imagen de 1080×1920 con fondo #f8f7f2 y el texto «Ever gotten a quote that didn't say what was included?» en Georgia Bold 64 pt color #142f42, arriba.", "Súbela a una historia y agrega la encuesta con «Yes, more than once» y «No».", "Publica a las 9:00 a. m. hora del Pacífico.", "A quien vote «Yes, more than once» escríbele por DM: «That's frustrating. Today's post has what to look for in a quote.»"]}, {"proposito": "Llevar a guardar el carrusel del día", "formato": "Repost del carrusel del día", "contenido": "Repost del carrusel con el texto: \"Keep this next to your quotes.\"", "interaccion": "Toque en el post compartido para abrirlo", "pasos": ["Abre el carrusel publicado, toca el avión de papel y elige «Agregar a tu historia».", "Escribe arriba «Keep this next to your quotes.» en fuente Moderna, blanco, con fondo #1b628d.", "Agranda el post hasta que ocupe el 70% de la pantalla.", "Publica a las 4:00 p. m. hora del Pacífico."]}], "cuenta": "PP", "dia": "Martes"}, {"fecha": "2027-01-13", "semana": 7, "formato": "Reel", "objetivo": "Viral", "tema": "Duda: mi casa es muy alta o complicada", "tipo_gancho": "Creencia equivocada en forma de pregunta", "gancho_texto": "Think your house is too tall to paint?", "gancho_hablado": "Think your house is too tall to paint?", "visual": "Segundos 0–2: foto «PHOTO-2026-09-23-14-29-39.jpg» de la casa de 3 pisos con escaleras y andamio, con movimiento de abajo hacia arriba. Texto arriba en caja #142f42: «Think your house is too tall to paint?».", "desarrollo": ["0–3 s: \"Think your house is too tall to paint?\" (debajo: foto \"PHOTO-2026-09-23-14-29-39.jpg\", 3 s, movimiento de abajo hacia arriba)", "3–9 s: \"Three stories up, a ladder only gets you so far.\" (debajo: v4 \"VIDEO 2026-11-06 3.MP4\", segundos 0–6)", "9–16 s: \"So we bring our own scaffolding. We're licensed to put it up, too.\" (debajo: foto \"PHOTO-2026-09-23-14-29-50(1).jpg\", 7 s con zoom lento)", "16–23 s: \"Narrow side yard? It fits there.\" (debajo: v12 \"VIDEO-2026-09-23-14-29-30.mp4\", segundos 0–7)", "23–30 s: \"It's quoted apart from the paint, so you see both numbers.\" (debajo: foto \"PHOTO-2026-09-23-14-29-29.jpg\", 7 s con zoom lento)", "30–37 s: \"That price covers delivery, setup, takedown and up to 30 days of use.\" (debajo: foto \"PHOTO-2026-09-23-14-29-30(1).jpg\", 7 s con zoom lento)", "37–43 s: \"Tall house, tight side yard. A normal week for us.\" (debajo: v2 \"VIDEO 2026-11-06 1.MP4\", segundos 0–6)", "43–48 s: \"Tag the friend with the tallest house on the street.\" (debajo: v3 \"VIDEO 2026-11-06 2.MP4\", segundos 5–10, con el logo horizontal abajo)"], "cta": "Tag the friend with the tallest house on the street.", "caption": "Three stories and a tight side yard. People assume that's a job nobody wants.\nWe own our scaffolding, we're licensed to set it up, and it's quoted apart from the paint so nothing is hidden.\nTag the friend with the tallest house on your street.", "calculadora": 16, "produccion": "Video de obra + texto", "clip": null, "notas": "Duda de la semana 7. Las condiciones del andamio (transporte, montaje, desmontaje y hasta 30 días al mismo precio) están confirmadas. No mencionar alquiler de andamio salvo que pregunten: se hace solo a pedido.", "instrucciones": ["Abre un proyecto nuevo en CapCut en 9:16 y pon en este orden: foto «PHOTO-2026-09-23-14-29-39.jpg» 3 s con animación de movimiento de abajo hacia arriba, v4 «VIDEO 2026-11-06 3.MP4» segundos 0–6, foto «PHOTO-2026-09-23-14-29-50(1).jpg» 7 s, v12 «VIDEO-2026-09-23-14-29-30.mp4» segundos 0–7, foto «PHOTO-2026-09-23-14-29-29.jpg» 7 s, foto «PHOTO-2026-09-23-14-29-30(1).jpg» 7 s, v2 «VIDEO 2026-11-06 1.MP4» segundos 0–6, v3 «VIDEO 2026-11-06 2.MP4» segundos 5–10.", "A las fotos ponles zoom lento de 100% a 110%. Quita el sonido original de los videos.", "Textos en pantalla: copia cada texto del desarrollo en su segundo. Montserrat Bold 56 pt, blanco, caja #142f42 al 85%, tercio superior.", "Logo horizontal (img/logo-horizontal.png) abajo al centro en los segundos 43–48.", "Música: instrumental con percusión ligera y ritmo medio, sin letra, de la biblioteca de Instagram, al 30%. Sin voz.", "Portada: la foto «PHOTO-2026-09-23-14-29-39.jpg» con el texto «Think your house is too tall to paint?» en Georgia Bold blanco sobre caja #142f42.", "Publica el miércoles 13 de enero a las 6:00 p. m. hora del Pacífico con el caption de esta ficha.", "Comentarios: si preguntan cuánto cuesta el andamio, responde «It depends on the house, so it's quoted after Nain sees it. The estimate is free: comment ESTIMATE.» Si preguntan si alquilan andamio, responde «Only on request. Send us a DM with what you need.»"], "historias": [{"proposito": "Romper la duda de la casa alta con un quiz", "formato": "Foto del stock con quiz", "contenido": "Foto del andamio en el pasillo con la pregunta: \"On our jobs, who sets up the scaffolding?\"", "interaccion": "Quiz: \"A rental company\" / \"Our own crew\" (correcta)", "pasos": ["Sube la foto «PHOTO-2026-09-23-14-29-29.jpg» a una historia.", "Escribe «On our jobs, who sets up the scaffolding?» en fuente Clásica, blanco, fondo #142f42, arriba.", "Agrega el sticker de quiz con «A rental company» y «Our own crew». Marca «Our own crew» como correcta.", "Publica a las 9:00 a. m. hora del Pacífico."]}, {"proposito": "Recoger dudas de casas difíciles", "formato": "Clip del stock con caja de preguntas", "contenido": "Clip v12 con el texto: \"What makes your house tricky to paint?\"", "interaccion": "Caja de preguntas: \"Tell us about your house\"", "pasos": ["Sube v12 «VIDEO-2026-09-23-14-29-30.mp4» completo (9 s) a una historia.", "Escribe «What makes your house tricky to paint?» en fuente Clásica, blanco, fondo #142f42, arriba.", "Agrega la caja de preguntas con el texto «Tell us about your house».", "Publica a las 4:00 p. m. hora del Pacífico.", "Guarda las respuestas para la historia 2 del jueves 14."]}], "cuenta": "PP", "dia": "Miércoles"}, {"fecha": "2027-01-14", "semana": 7, "formato": "Imagen", "objetivo": "Autoridad", "tema": "Garantía por escrito", "tipo_gancho": "Pregunta que el cliente debería hacer", "gancho_texto": "Ask any painter: what happens if it peels?", "gancho_hablado": "4 years on our work. In writing.", "visual": "Foto real «PHOTO HOUSE EXT 2026-11-16 2.JPG» (casa gris terminada) a página completa. Arriba, caja #142f42 con «Ask any painter: what happens if it peels?». Abajo, franja #142f42 con «4 years on our work. In writing.» en Georgia Bold crema.", "desarrollo": ["Top text: \"Ask any painter: what happens if it peels?\"", "Main text: \"4 years on our work. In writing.\"", "Small line: \"If paint peels or bubbles because of our work, we come back.\"", "Bottom: logo"], "cta": "Comment ESTIMATE and we'll send the free estimate form.", "caption": "If paint peels or bubbles because of how we did the job, we come back and fix it. That's our 4-year workmanship guarantee.\nWhat it doesn't cover is written in your estimate, so there are no surprises later.\nComment ESTIMATE and we'll send you the free estimate form.", "calculadora": null, "produccion": null, "clip": null, "notas": "Semana 7, leer un estimado. «We come back and fix it» describe la garantía confirmada (pintura que se levanta o hace burbujas por su trabajo). [VALIDAR: confirmar que la garantía se entrega por escrito en cada estimado o contrato].", "instrucciones": ["En Canva crea un diseño de 1080×1350 con la foto «PHOTO HOUSE EXT 2026-11-16 2.JPG» a página completa. Si se ve el número de la casa, difumínalo al 80%.", "Arriba pon una caja #142f42 al 85% de 1080×200 px con «Ask any painter: what happens if it peels?» en Montserrat Bold 40 pt color #f8f7f2.", "Abajo pon una franja #142f42 al 90% de 1080×400 px con «4 years on our work. In writing.» en Georgia Bold 64 pt color #f8f7f2.", "Debajo, «If paint peels or bubbles because of our work, we come back.» en Montserrat Medium 28 pt color #ae9168.", "Logo horizontal al fondo de la franja, 400 px de ancho, centrado.", "Exporta en PNG y publica el jueves 14 de enero a las 12:00 p. m. hora del Pacífico con el caption de esta ficha.", "Comentarios: si preguntan qué no cubre la garantía, responde «It depends on the job, and Nain writes it down in your estimate so you know before we start.» Si escriben ESTIMATE, manda por DM el formulario [enlace al formulario de estimado a confirmar] y los teléfonos (650) 207-1772 y (415) 238-0797."], "historias": [{"proposito": "Recoger preguntas sobre estimados y garantías", "formato": "Caja de preguntas sobre imagen creada", "contenido": "Texto: \"Questions about estimates, guarantees or what's included? Ask here.\"", "interaccion": "Caja de preguntas: \"Ask about estimates\"", "pasos": ["En Canva crea una imagen de 1080×1920 con fondo #1b628d y el texto «Questions about estimates, guarantees or what's included? Ask here.» en Georgia Bold 60 pt blanco, arriba.", "Súbela a una historia y agrega la caja de preguntas con «Ask about estimates» en el centro.", "Publica a las 9:00 a. m. hora del Pacífico.", "A las 3:30 p. m. elige la pregunta más repetida de esta caja o de la caja del miércoles 13 para la historia 2."]}, {"proposito": "Responder una duda real sobre el estimado", "formato": "Respuesta a la caja de preguntas con imagen creada", "contenido": "Respuesta a la pregunta elegida. Plan B si no llega ninguna: pregunta \"Is the scaffolding included in the paint price?\" y respuesta \"It's quoted separately so you can see it. It covers delivery, setup, takedown and up to 30 days of use.\"", "interaccion": "Sticker de reacción con emoji 👍", "pasos": ["Toca la respuesta elegida en el visor de respuestas y elige «Compartir respuesta».", "Pon el fondo #f8f7f2 y escribe la respuesta en fuente Moderna, 32 pt, color #142f42.", "Si no llegó ninguna pregunta, crea en Canva una imagen 1080×1920 fondo #f8f7f2 con la pregunta «Is the scaffolding included in the paint price?» arriba en Georgia Bold y la respuesta «It's quoted separately so you can see it. It covers delivery, setup, takedown and up to 30 days of use.» en Montserrat 36 pt.", "Agrega el sticker de deslizador con emoji 👍.", "Publica a las 4:00 p. m. hora del Pacífico. Si la respuesta necesita un dato que no está en esta ficha, márcalo [VALIDAR] y espera la revisión antes de publicar."]}], "cuenta": "PP", "dia": "Jueves"}, {"fecha": "2027-01-15", "semana": 7, "formato": "Reel", "objetivo": "Venta", "tema": "Qué trae nuestro estimado", "tipo_gancho": "Promesa de claridad", "gancho_texto": "Know what you're paying for before anyone starts", "gancho_hablado": "Know what you're paying for before anyone starts", "visual": "Segundos 0–2: v9, la casa amarilla antes, de frente. Texto arriba en caja #142f42: «Know what you're paying for before anyone starts».", "desarrollo": ["0–3 s: \"Know what you're paying for before anyone starts\" (debajo: v9 \"VIDEO HOUSE EXT 2026-11-16 .MP4\", segundos 0–3)", "3–9 s: \"Nain, the owner, comes out and does the estimate himself.\" (debajo: foto img/nain.jpg, 6 s con zoom lento)", "9–16 s: \"He walks the house with you. Wood that needs repair gets written down.\" (debajo: v8 \"VIDEO 2026-11-06 7.MP4\", segundos 5–12)", "16–22 s: \"The estimate says what prep is included and how many coats go on.\" (debajo: v6 \"VIDEO 2026-11-06 5.MP4\", segundos 8–14)", "22–29 s: \"Need scaffolding? It's its own line, so nothing hides inside the paint price.\" (debajo: v12 \"VIDEO-2026-09-23-14-29-30.mp4\", segundos 1–8)", "29–35 s: \"What the 4-year guarantee doesn't cover is written right there too.\" (debajo: v13 \"VIDEO 2026-11-16 1.mov\", segundos 5–11)", "35–42 s: \"Thinking about the outside this spring? A winter estimate just means the plan is ready early.\" (debajo: v9 \"VIDEO HOUSE EXT 2026-11-16 .MP4\", segundos 10–17)", "42–47 s: \"The estimate is free. Comment ESTIMATE and we'll send the form.\" (debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 0–5, con el logo horizontal abajo)"], "cta": "Comment ESTIMATE and we'll send the free estimate form.", "caption": "Our estimates spell it out: the prep, the coats, the scaffolding as its own line, and what the guarantee doesn't cover.\nNain still does every one himself.\nIf the outside is on your list for spring, getting the estimate in winter just gives you time. Comment ESTIMATE for the form.", "calculadora": 15, "produccion": "Video de obra + texto", "clip": null, "notas": "Semana 7, cierre de la serie sobre estimados. Aviso suave del estimado de exterior para primavera, sin fecha límite. [VALIDAR: confirmar que el estimado escrito indica la preparación incluida y el número de manos].", "instrucciones": ["Abre un proyecto nuevo en CapCut en 9:16 y pon en este orden: v9 «VIDEO HOUSE EXT 2026-11-16 .MP4» segundos 0–3 (ojo: el nombre d mate, in person, with the owner. Call (650) 207-1772 or (415) 238-0797.", "interaccion": "Text on screen: \"Or DM us ESTIMATE\"", "pasos": ["Canva 1080×1920, fondo #142f42.", "Texto del contenido en Playfair Display crema tamaño 60, centrado.", "Debajo, \"Or DM us ESTIMATE\" en Montserrat #ae9168 tamaño 44.", "Foto img/nain.jpg en un círculo de 500 px arriba del texto.", "Publica a las 10:00 a. m. hora del Pacífico."]}, {"proposito": "Saber cuándo quiere pintar la gente para preparar la semana de One-Room Refresh", "formato": "Clip corto de obra con encuesta", "contenido": "When are you thinking of painting?", "interaccion": "Poll: \"This winter\" / \"Spring\" / \"Just looking\"", "pasos": ["Usa v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 0–10.", "Texto del contenido arriba en Montserrat negrita blanca con caja #142f42.", "Encuesta de Instagram con las 3 opciones exactas de la interacción.", "Publica a las 6:00 p. m. hora del Pacífico.", "A quien vote \"This winter\", mándale por DM: \"Nice! Want us to send the free estimate form?\""]}], "cuenta": "PP", "dia": "Domingo"}, {"fecha": "2027-01-25", "semana": 9, "formato": "Reel", "objetivo": "Seguidores", "tema": "Serie \"Before the first coat\": proteger la casa", "tipo_gancho": "Detrás de escena", "gancho_texto": "Before the first coat: what we cover up", "gancho_hablado": "Before the first coat, we cover what matters.", "visual": "Primeros 2 s: v6 \"VIDEO 2026-11-06 5.MP4\" (casa azul de un piso con plásticos protegiendo), con el texto del gancho arriba.", "desarrollo": ["0–3 s: \"Before the first coat: what we cover up\" | Debajo: v6 \"VIDEO 2026-11-06 5.MP4\", segundos 0–3.", "3–8 s: \"Your plants were there before us. They should look the same after.\" | Debajo: v8 \"VIDEO 2026-11-06 7.MP4\", segundos 5–10 (plantas y calabazas).", "8–13 s: \"So the plastic goes down first.\" | Debajo: \"PHOTO 2026-11-06 2.JPG\", acercamiento lento.", "13–19 s: \"Windows get masked so paint stays on the wall.\" | Debajo: v5 \"VIDEO 2026-11-06 4.MP4\", segundos 1–7.", "19–25 s: \"Tight side yards too.\" | Debajo: v12 \"VIDEO-2026-09-23-14-29-30.mp4\", segundos 0–6.", "25–31 s: \"Then the painting starts.\" | Debajo: v6, segundos 8–14.", "31–36 s: \"And we clean up every day.\" | Debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 0–5.", "36–42 s: \"Follow for more of 'Before the first coat', the part most painters don't show\" | Debajo: logo horizontal sobre fondo #f8f7f2."], "cta": "Follow for the next \"Before the first coat\" and see the prep most painters don't show.", "caption": "Before the first coat goes on, the plastic goes down. Plants, windows, the narrow side yard nobody thinks about.\nAnd we clean up every day until we're done.\nThis is part of our \"Before the first coat\" series. Follow to catch the next one.\n#BayAreaPainter #BeforeTheFirstCoat", "calculadora": 15, "produccion": "Video de obra + texto", "clip": null, "notas": "Semana 9: arranca One-Room Refresh, pero este reel es cercanía y no menciona la oferta. Plan B si v12 no se ve bien: \"PHOTO-2026-09-23-14-29-30(1).jpg\" 6 s con acercamiento lento.", "instrucciones": ["Abre CapCut, proyecto nuevo 9:16 (1080×1920). Importa los archivos exactos que se nombran en el desarrollo desde la carpeta Picasso Painting/Fotos/11-2026/.", "Corta cada clip o foto en los segundos que indica el desarrollo y ponlos en ese orden. Fotos: efecto de acercamiento lento (zoom del 100% al 110%).", "Textos en pantalla: fuente Montserrat negrita, blanca, con caja #142f42 al 80% de opacidad, centrados en el tercio de arriba. Cada texto aparece en el segundo indicado y se va al empezar el siguiente.", "Música: instrumental acústica tranquila, sin letra, de la biblioteca de Instagram, volumen al 30%. Sin voz.", "Último segundo: logo horizontal (img/logo-horizontal.png) sobre fondo #f8f7f2 durante 2 s.", "Portada del reel: el primer cuadro con el texto del gancho. Publica a las 6:00 p. m. hora del Pacífico y pega el caption tal cual.", "Comentarios: si alguien pregunta si cubren las plantas o el jardín, responde: \"Always. Plants, floors and furniture get covered before we start.\""], "historias": [{"proposito": "Cercanía: mostrar los andamios propios en espacios estrechos", "formato": "Clip corto de obra con texto", "contenido": "Our own scaffolding, even in a narrow side yard.", "interaccion": "Emoji slider: \"How tight is your side yard?\" with 😬", "pasos": ["Usa v12 \"VIDEO-2026-09-23-14-29-30.mp4\" completo (9 s).", "Texto del contenido arriba en Montserrat negrita blanca con caja #142f42.", "Deslizador de emoji con la pregunta exacta de la interacción, abajo.", "Sin teléfonos en esta historia.", "Publica a las 10:00 a. m. hora del Pacífico."]}, {"proposito": "Cercanía: presentar a Nain con su frase real", "formato": "Foto con texto", "contenido": "\"I started painting about twenty years ago, as an apprentice.\" Nain, owner of Picasso Painting.", "interaccion": "Question box: \"Ask Nain something\"", "pasos": ["Usa img/nain.jpg a pantalla completa (1080×1920).", "Frase entre comillas en Playfair Display crema sobre caja #142f42 al 85%, en el tercio de abajo.", "\"Nain, owner of Picasso Painting\" debajo en Montserrat #ae9168.", "Caja de preguntas con el texto exacto de la interacción, arriba.", "Publica a las 6:30 p. m. hora del Pacífico. Pasa las preguntas que lleguen a Nain para responderlas el jueves 28."]}], "cuenta": "PP", "dia": "Lunes"}, {"fecha": "2027-01-26", "semana": 9, "formato": "Carrusel", "objetivo": "Venta", "tema": "One-Room Refresh", "tipo_gancho": "Problema cotidiano", "gancho_texto": "That patched wall you stopped seeing? Guests still see it.", "gancho_hablado": "One room. One repaired wall you won't keep noticing.", "visual": "Slide 1: imagen creada en Canva de una pared de sala crema con un resane cuadrado más claro y una lámpara de pie al lado; título arriba. [VALIDAR: pedir foto real de interior]", "desarrollo": ["Slide 1: \"That patched wall you stopped seeing? Guests still see it.\" | Imagen Canva: pared de sala crema con resane cuadrado más claro, lámpara de pie a la derecha. [VALIDAR: pedir foto real de interior]", "Slide 2: \"One-Room Refresh: pick one room. We repair the wall so the fix doesn't show, then paint the room.\" | Diseño: fondo #eaf0ec, solo texto.", "Slide 3: \"The repair: we fill and smooth the damaged spot until it's level with the wall.\" | Imagen Canva: primer plano de una espátula alisando un resane blanco en pared crema. [VALIDAR: pedir foto real de interior]", "Slide 4: \"The paint: a base coat so the repair doesn't show through, then two coats of paint.\" | Imagen Canva: rodillo con pintura crema sobre la pared, mitad pintada. [VALIDAR: pedir foto real de interior]", "Slide 5: \"Floors and furniture covered. Cleanup every day. Labeled touch-up paint left for you.\" | Foto: \"PHOTO 2026-11-06 1.JPG\" (plásticos de protección).", "Slide 6: \"[VALIDAR: oferta One-Room Refresh, crédito fijo en un proyecto interior de alcance mínimo con resane, del 25 ene al 5 feb; monto y condiciones por definir]\" | Diseño: fondo #142f42, texto crema.", "Slide 7: \"Got a room in mind? Comment ESTIMATE and we'll DM you the form.\" | Diseño: fondo #f8f7f2, logo abajo."], "cta": "Comment ESTIMATE and we'll DM you the free estimate form.", "caption": "You know the wall. The one with the patch that never quite matched.\nOne-Room Refresh is for that: one room, a repair that blends in, fresh paint. [VALIDAR: texto de la oferta, crédito fijo y fechas 25 ene–5 feb]\nComment ESTIMATE and we'll DM you the free estimate form.\n#BayAreaPainter #InteriorPainting", "calculadora": null, "produccion": null, "clip": null, "notas": "Semana 9: One-Room Refresh activa. La oferta va solo como propuesta y nunca como rebaja de precio. [VALIDAR: oferta, monto del crédito y condiciones]. [VALIDAR: pedir foto real de interior]. Si la oferta no se aprueba, quitar el slide 6 y dejar el carrusel en 6 slides.", "instrucciones": ["Abre Canva, diseño de 1080×1350. Estilo: Canva 1080×1350, fondo #f8f7f2, títulos en Playfair Display color #142f42 tamaño 64, texto en Montserrat color #142f42 tamaño 34, línea fina dorada #ae9168 bajo el título, logo horizontal (img/logo-horizontal.png) centrado abajo a 60 px del borde.", "Slides 1, 3 y 4: crea cada imagen con la herramienta de imágenes de Canva usando la descripción exacta del desarrollo. Imagen en los dos tercios de arriba, texto abajo en caja #f8f7f2.", "Slide 2: fondo #eaf0ec, \"One-Room Refresh\" en Playfair Display #1b628d tamaño 72 y el resto del texto en Montserrat #142f42 tamaño 38.", "Slide 5: \"PHOTO 2026-11-06 1.JPG\" a sangre con el texto en caja #142f42 abajo.", "Slide 6: escribe el texto de la oferta solo cuando esté aprobado; mientras tanto deja el marcador tal cual y no publiques.", "Slide 7: fondo #f8f7f2, texto en Playfair Display #142f42 tamaño 56, logo abajo.", "Publica el martes 26 a las 6:00 p. m. hora del Pacífico con el caption, ya con el texto de la oferta aprobado.", "A cada comentario con ESTIMATE responde \"Sent you a DM!\" y manda por DM: \"Hi! Thanks for writing. Here's our free estimate form: [enlace al formulario de estimado]. You can also call (650) 207-1772 or (415) 238-0797. Nain does every estimate in person.\""], "historias": [{"proposito": "Problema común: saber qué habitación le molesta más a la gente", "formato": "Imagen creada en Canva con encuesta", "contenido": "If you could repaint one room tomorrow, which one?", "interaccion": "Poll: \"Living room\" / \"Bedroom\" / \"Kitchen\" / \"Hallway\"", "pasos": ["Canva 1080×1920, fondo #eaf0ec.", "Texto del contenido en Playfair Display #142f42 tamaño 60, arriba.", "Encuesta de Instagram con las 4 opciones exactas de la interacción.", "Logo pequeño abajo.", "Publica a las 10:00 a. m. hora del Pacífico. A quien vote, mándale por DM: \"Good pick. Want a free estimate for it? Reply ESTIMATE.\""]}, {"proposito": "Llevar tráfico al carrusel de One-Room Refresh", "formato": "Repost del c \"", "formato": "Imagen creada en Canva con quiz", "contenido": "Two quotes. One is lower. What should you check first?", "interaccion": "Quiz: A) The total only B) What's included C) The logo. Correct answer: B", "pasos": ["Canva 1080×1920, fondo #f8f7f2.", "Texto del contenido en Playfair Display #142f42 tamaño 60, arriba.", "Sticker de quiz con las 3 opciones exactas y la B marcada como correcta.", "Logo pequeño abajo.", "Publica a las 10:00 a. m. hora del Pacífico."]}, {"proposito": "Llevar tráfico al reel del día", "formato": "Repost del reel", "contenido": "Before you pick the lowest quote, watch this.", "interaccion": "Sticker: \"New post\"", "pasos": ["Comparte el reel en historias desde el botón de enviar.", "Texto del contenido arriba en Montserrat negrita blanca con caja #142f42.", "Sticker \"New post\" debajo.", "Sin música extra.", "Publica a las 6:30 p. m. hora del Pacífico."]}], "cuenta": "PP", "dia": "Miércoles"}, {"fecha": "2027-01-28", "semana": 9, "formato": "Imagen", "objetivo": "Autoridad", "tema": "Planear el exterior de primavera", "tipo_gancho": "Calendario práctico", "gancho_texto": "Painting the outside this year? Plan it in winter.", "gancho_hablado": "Painting the outside this year? Plan it in winter.", "visual": "Foto \"PHOTO COMPLETE HOUSE 2026-11-16.JPG\" (casa gris terminada) a sangre con caja #f8f7f2 arriba y el titular en #142f42.", "desarrollo": ["Titular: \"Painting the outside this year? Plan it in winter.\"", "Texto: \"In the Bay Area, the dry season for outside painting runs May to October. Getting your estimate now gives you time to pick colors and plan without rushing.\"", "Línea final: \"Free estimate in person · (650) 207-1772 · (415) 238-0797\""], "cta": "DM us ESTIMATE to plan your spring exterior.", "caption": "Outside painting here works best in the dry months, May to October.\nWinter is a good time to get the estimate, look at colors and think it through without a deadline.\nDM us ESTIMATE when you're ready and we'll s a #142f42.", "Abajo, \"DM us: ESTIMATE\" en Playfair Display #ae9168 sobre caja #f8f7f2.", "Publica a las 10:00 a. m. hora del Pacífico.", "A quien mande ESTIMATE, respóndele con el mensaje de DM del reel de hoy."]}, {"proposito": "Recordar One-Room Refresh con la palabra ESTIMATE", "formato": "Imagen creada en Canva con texto", "contenido": "One-Room Refresh: one room, a wall repair that blends in, fresh paint. [VALIDAR: texto de la oferta y fechas 25 ene–5 feb] DM us ESTIMATE.", "interaccion": "Text on screen: \"DM us: ESTIMATE\"", "pasos": ["Canva 1080×1920, fondo #eaf0ec.", "Imagen creada en Canva en la mitad de arriba: dormitorio con paredes crema, cama con colcha blanca, luz de mañana. [VALIDAR: pedir foto real de interior]", "\"One-Room Refresh\" en Playfair Display #1b628d tamaño 64 y el resto en Montserrat #142f42.", "No publiques esta historia hasta que la oferta esté aprobada.", "Publica a las 6:30 p. m. hora del Pacífico."]}], "cuenta": "PP", "dia": "Viernes"}, {"fecha": "2027-01-30", "semana": 9, "formato": "Carrusel", "objetivo": "Guardado", "tema": "Caso real: la casa amarilla, entre el antes y el color nuevo", "tipo_gancho": "Proceso real", "gancho_texto": "A yellow house on its way to a new color", "gancho_hablado": "A yellow house on its way to a new color", "visual": "Slide 1: \"PHOTO HOUSE EXT 2026-11-16 5.JPG\" (casa amarilla ANTES) arriba y \"PHOTO HOUSE PROGRESS EXT 2026-11-17 2.jpg\" (azul grisáceo EN OBRA) abajo, separadas por una línea #ae9168.", "desarrollo": ["Slide 1: \"A yellow house on its way to a new color\" | Fotos: \"PHOTO HOUSE EXT 2026-11-16 5.JPG\" arriba y \"PHOTO HOUSE PROGRESS EXT 2026-11-17 2.jpg\" abajo.", "Slide 2: \"Before: the starting point.\" | Foto: \"PHOTO HOUSE EXT 2026-11-16 5.JPG\" a sangre.", "Slide 3: \"Step 1: a full wash so the new paint holds.\" | Cuadro del video v1 \"POWER WASHING HOUSE EXT 2026-11-16.MP4\" (segundo 5) exportado como foto.", "Slide 4: \"Step 2: the sides and the garage door get the same was  <div class="card"><h3>Para qué sirve cada formato</h3><table><tr><th>Formato</th><th>Para qué lo usamos</th><th>Cómo saber si funcionó</th></tr>${DATA.formatos.map(f=>`<tr><td><span class="tag f-${f.f}">${f.f}</span></td><td>${esc(f.para)}</td><td>${esc(f.mide)}</td></tr>`).join('')}</table></div>
 <div class="card"><h3>El objetivo de cada reel</h3><p>Cada reel tiene una etiqueta. Así sabes qué pedirle a la gente al final:</p><table>${DATA.objetivos.map(o=>`<tr><td><span class="tag">${o.o}</span></td><td>${esc(o.p)}</td></tr>`).join('')}</table></div>
 <div class="card"><h3>Campañas de estos meses</h3><table><tr><th>Fechas</th><th>Campaña</th><th>Qué hacemos en redes</th></tr>${A.campanas.map(c=>`<tr><td>${esc(c.f)}</td><td><b>${esc(c.n)}</b></td><td>${esc(c.p)}</td></tr>`).join('')}</table></div>
 </section>

 <section id="semanas"><h2>4. El tema de cada semana</h2><div class="tablewrap"><table><tr><th>Semana</th><th>Fechas</th><th>Tema</th><th>Qué tiene que sentir la gente</th></tr>${A.semanas.map(s=>`<tr><td><b>${s.n}</b></td><td>${esc(s.f)}</td><td>${esc(s.t)}</td><td>${esc(s.s)}</td></tr>`).join('')}</table></div></section>

 <section id="historias"><h2>5. Historias: qué toca cada día</h2>
 <div class="card"><p>Se suben <b>2 historias todos los días</b>. Cada día de la semana tiene un propósito. La historia 1 engancha (pregunta, encuesta o algo curioso). La historia 2 desarrolla o invita a hacer algo.</p>
 <div class="tablewrap"><table><tr><th>Día</th><th>Propósito</th><th>Qué se busca</th></tr>${DATA.semanaHistorias.map(d=>`<tr><td><b>${d.d}</b></td><td>${esc(d.p)}</td><td>${esc(d.q)}</td></tr>`).join('')}</table></div>
 <h3>Reglas para historias</h3>${ol(DATA.reglasHistorias)}
 <h3>Las dudas que rompemos los miércoles</h3><table><tr><th>Semana</th><th>Duda de la gente</th><th>Cómo la contestamos</th></tr>${A.objeciones.map(o=>`<tr><td>${o.n}</td><td>“${esc(o.d)}”</td><td>${esc(o.c)}</td></tr>`).join('')}</table></div></section>

 <section id="palabras"><h2>6. Palabras clave y qué contestar por DM</h2>
 <div class="card"><p>Cuando un video dice “comenta ${esc((A.palabras[0]||{}).k||'PALABRA')}”, la gente escribe esa palabra. Hay que contestar <b>el mismo día</b>, mejor en menos de 2 horas.</p>
 ${A.palabras.map(p=>`<div class="card" style="background:var(--fondo)"><h3><span class="tag">${esc(p.k)}</span> ${esc(p.que)}</h3><p class="muted">${esc(p.estado)}</p><b>Paso a paso:</b>${ol(p.pasos)}<b>Mensaje para copiar y pegar:</b><div class="say"><p>${esc(p.dm)}</p></div></div>`).join('')}</div></section>

 <section id="marca"><h2>7. Colores, letra y logo</h2>
 <div class="grid"><div class="card"><h3>Colores</h3>${A.marca.colores.map(c=>`<div class="swatch"><i style="background:${c.h}"></i><span><b>${c.h}</b> · ${esc(c.u)}</span></div>`).join('')}</div>
 <div class="card"><h3>Letra y estilo</h3>${ol(A.marca.estilo)}<img src="${LOGOS[cuenta]}" alt="${esc(A.nombre)}" style="max-width:100%;margin-top:10px"></div></div></section>

 <section id="recetas"><h2>8. Cómo se hacen los videos y diseños (nadie graba)</h2>
 <div class="card"><p>Cada ficha dice cómo se hace el video: <span class="tag">Clip de clase</span> <span class="tag">Voz clonada</span> o <span class="tag">Clip + voz clonada</span>. Aquí está la receta de cada una.</p></div>
 ${DATA.recetas.map(r=>`<div class="card"><h3>${esc(r.t)}</h3>${ol(r.pasos)}</div>`).join('')}</section>

 <section id="mapa"><h2>9. Calendario</h2><p class="muted">Toca un día para ir directo a su ficha. Los días que marques como hechos se ven más claros.</p>
 ${CFG.meses.map(m=>calendar(m,posts)).join('')}</section>

 <section id="dias"><h2>10. Día por día</h2>
 <div class="filters">
 <select id="fMes" aria-label="Mes"><option value="">${CFG.meses.length==2?'Los dos meses':'Todos los meses'}</option>${CFG.meses.map(m=>`<option value="${m}">${MES[m.slice(5)-1][0].toUpperCase()+MES[m.slice(5)-1].slice(1)}</option>`).join('')}</select>
 <select id="fSem" aria-label="Semana"><option value="">Todas las semanas</option>${CFG.semanas.map(([n,f])=>`<option value="${n}">Semana ${n} (${f})</option>`).join('')}</select>
 <select id="fFor" aria-label="Formato"><option value="">Todos los formatos</option><option>Reel</option><option>Carrusel</option><option>Imagen</option></select>
 </div><div id="lista"></div></section>

 <section id="glosario"><h2>11. Palabras que usamos en esta guía</h2><div class="card"><table>${DATA.glosario.map(g=>`<tr><td><b>${esc(g.t)}</b></td><td>${esc(g.d)}</td></tr>`).join('')}</table></div></section>`;
 ['fMes','fSem','fFor'].forEach(id=>{const el=$('#'+id);el.value={fMes,fSem,fFor}[id];el.onchange=()=>{({fMes:v=>fMes=v,fSem:v=>fSem=v,fFor:v=>fFor=v})[id](el.value);lista()}});
 lista();
}
function calendar(m,posts){
 const ps=posts.filter(p=>p.fecha.startsWith(m)); const [y,mo]=m.split('-').map(Number);
 const pad=(new Date(y,mo-1,1).getDay()+6)%7;
 return `<div class="card"><h3>${MES[mo-1][0].toUpperCase()+MES[mo-1].slice(1)} ${y}</h3><div class="cal">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="h">${d}</div>`).join('')}${'<a class="e"></a>'.repeat(pad)}${ps.map(p=>`<a href="#d-${p.fecha}" class="${store.get('hecho-'+cuenta+p.fecha)?'done':''}"><b>${+p.fecha.slice(8)}</b><span class="tag f-${p.formato}">${p.formato}</span></a>`).join('')}</div><p class="legend"><span class="tag f-Reel" style="font-size:0;width:12px;height:12px;padding:0"></span> Reel · <span class="tag f-Carrusel" style="font-size:0;width:12px;height:12px;padding:0"></span> Carrusel · <span class="tag f-Imagen" style="font-size:0;width:12px;height:12px;padding:0"></span> Imagen</p></div>`;
}
function lista(){
 const posts=DATA.posts.filter(p=>p.cuenta===cuenta&&(!fMes||p.fecha.startsWith(fMes))&&(!fSem||p.semana==fSem)&&(!fFor||p.formato===fFor));
 $('#lista').innerHTML=posts.map(day).join('')||'<p>No hay días con ese filtro.</p>';
 document.querySelectorAll('button.copy').forEach(b=>b.onclick=()=>{const t=b.previousElementSibling.innerText.replace(/^Slide \d+: /gm,'');const o=b.textContent;navigator.clipboard.writeText(t).then(()=>{b.textContent='¡Copiado!';setTimeout(()=>b.textContent=o,1500)})});
 document.querySelectorAll('label.done input').forEach(i=>i.onchange=()=>{store.set(i.dataset.k,i.checked?'1':'');const a=document.querySelector(`.cal a[href="#d-${i.dataset.f}"]`);if(a)a.classList.toggle('done',i.checked)});
}
function clipBox(c){
 return `<div class="good"><b>Clip de clase</b><br><b>Video:</b> ${esc(c.video)}<br><b>Empieza en:</b> “${esc(c.empieza)}”<br><b>Termina en:</b> “${esc(c.termina)}”<br><b>Dónde está:</b> ${esc(c.ubicacion||'busca la frase en la transcripción')}${c.duracion?`<br><b>Dura:</b> ${esc(c.duracion)}`:''}</div>`;
}
function day(p){
 const k='hecho-'+cuenta+p.fecha, isReel=p.formato==='Reel', isCar=p.formato==='Carrusel';
 const label=isReel?`Lo que dice ${esc(CFG.voz)}, frase por frase`:isCar?'Qué va en cada slide':'Qué dice la imagen';
 return `<article class="day" id="d-${p.fecha}"><header><div><span class="tag">Semana ${p.semana}</span><span class="tag f-${p.formato}">${p.formato}</span><span class="tag">Objetivo: ${esc(p.objetivo)}</span>${p.produccion?`<span class="tag f-Imagen">${esc(p.produccion)}</span>`:''}<h3>${esc(p.dia)} ${fdate(p.fecha)} · ${esc(p.tema)}</h3></div>
 <label class="done"><input type="checkbox" data-k="${k}" data-f="${p.fecha}" ${store.get(k)?'checked':''}> Publicado</label></header>
 <div class="body">
 ${pend(p).length?`<p class="pending"><b>Antes de publicar resuelve lo marcado en amarillo:</b> ${pend(p).join(', ')}.</p>`:''}
 <p class="hook">${esc(p.gancho_texto)}</p>
 <div class="sum"><p><b>Hoy se publica:</b> ${p.formato}${p.produccion?` hecho con <b>${esc(p.produccion.toLowerCase())}</b>`:''}.</p><p><b>Al final se pide:</b> ${esc(p.cta)}</p>${p.clip&&p.clip.video?`<p><b>Pide al editor:</b> la clase «${esc(p.clip.video)}».</p>`:''}<p class="muted">Abre las 4 partes de abajo en orden.</p></div>
 <details><summary>1. ${label}</summary>
 <p><b>${isReel?'Primera frase':isCar?'Título de la portada':'Titular'}:</b> ${esc(p.gancho_hablado)}</p>
 <p><b>Lo que se ve al inicio:</b> ${esc(p.visual)}</p>
 ${p.clip&&p.clip.video?clipBox(p.clip):''}
 <div class="say" data-copy>${list(p.desarrollo).map((x,i)=>`<p>${isCar?`<b>Slide ${i+1}:</b> `:''}${esc(x)}</p>`).join('')}</div>${isReel?'<button class="copy">Copiar guion</button>':''}</details>
 <details><summary>2. Cómo hacerlo, paso a paso</summary>${ol(p.instrucciones)}${p.notas?`<p class="note"><b>Ojo:</b> ${esc(p.notas)}</p>`:''}</details>
 <details><summary>3. Texto del post</summary><div class="say" data-copy><p>${esc(p.caption).replace(/\n/g,'<br>')}</p></div><button class="copy">Copiar texto</button></details>
 <details><summary>4. Las 2 historias del día</summary><div class="cols">${list(p.historias).map((h,i)=>`<div class="story"><span class="tag">Historia ${i+1}</span><span class="tag">${esc(h.formato)}</span><p><b>Para qué:</b> ${esc(h.proposito)}</p><p><b>Qué se muestra o se dice:</b> ${esc(h.contenido)}</p><p><b>Sticker o interacción:</b> ${esc(h.interaccion)}</p>${h.pasos?`<b>Cómo hacerla:</b><ol class="plain">${list(h.pasos).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}</div>`).join('')}</div></details>
 </div></article>`;
}
$('#hoy').onclick=()=>{const t=new Date().toISOString().slice(0,10),f=t<CFG.inicio?CFG.inicio:t>CFG.fin?CFG.fin:t;fMes=fSem=fFor='';lista();const fs=[...document.querySelectorAll('.day')].map(e=>e.id.slice(2));if(!fs.length)return;const el=document.getElementById('d-'+(fs.filter(x=>x<=f).pop()||fs[0]));el.querySelector('details').open=true;el.scrollIntoView()};
$('.tabs').insertAdjacentHTML('afterbegin',CFG.cuentas.map(a=>`<button data-set="${a.id}" aria-pressed="false">${esc(a.nombre)}</button>`).join(''));
document.querySelectorAll('.tabs button[data-set]').forEach(b=>b.onclick=()=>{cuenta=b.dataset.set;store.set('cuenta',cuenta);fSem='';render();scrollTo(0,0)});
render();
</script>
</body>
</html>
