<!doctype html>

<title>Parrilla diciembre y enero</title>
<style>
:root{--warn:#992f23}
body[data-c="PP"]{--acento:#1b628d;--acento2:#ae9168;--fondo:#f8f7f2;--papel:#fff;--tinta:#142f42;--texto:#566b75;--linea:#dbe2de;--fuerte:#11496b;--oscuro:#0b2535;--suave:#eaf0ec;--titulos:"Iowan Old Style","Palatino Linotype",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.55 Arial,Helvetica,sans-serif}
h1,h2,h3{font-family:var(--titulos);line-height:1.2;margin:0 0 .5em}
a{color:var(--fuerte)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header.top{background:var(--papel);border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;flex-wrap:wrap}
.top img{height:38px;width:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.chip{font:600 14px Arial,sans-serif;border:1px solid var(--linea);background:var(--papel);color:var(--tinta);padding:9px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--acento);border-color:var(--acento);color:#fff}
nav.toc{background:var(--suave);border-bottom:1px solid var(--linea)}
nav.toc .wrap{display:flex;gap:16px;overflow-x:auto;padding:10px 16px;font-size:14px;white-space:nowrap}
section{padding:36px 0 8px}
.hero{padding:40px 0 10px}
.hero h1{font-size:clamp(30px,4.4vw,48px)}
.hero p{max-width:760px;color:var(--texto);font-size:18px}
.card{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:20px;margin:0 0 14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.muted{color:var(--texto)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps>li{counter-increment:s;position:relative;padding:0 0 10px 38px}
.steps>li:before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--acento);color:#fff;font:700 13px/26px Arial;text-align:center}
.bad,.good{padding:12px 14px;border-radius:10px;margin:6px 0}
.bad{background:#f6e9e6;border-left:4px solid var(--warn)}
.good{background:var(--suave);border-left:4px solid var(--acento)}
.tag{display:inline-block;font:700 12px Arial;letter-spacing:.03em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--suave);color:var(--fuerte);margin:0 4px 4px 0}
.f-Reel{background:var(--acento);color:#fff}.f-Carrusel{background:var(--acento2);color:var(--oscuro)}.f-Imagen{background:var(--oscuro);color:#fff}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--linea);vertical-align:top}
th{font-size:13px;color:var(--texto);text-transform:uppercase;letter-spacing:.03em}
.tablewrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.legend{display:none;font-size:13px;margin:8px 0 0}
.cal .h{font:700 12px Arial;color:var(--texto);text-align:center;text-transform:uppercase}
.cal a{display:block;min-height:64px;background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:6px;text-decoration:none;color:var(--tinta);font-size:12px}
.cal a b{display:block;font-size:15px}
.cal a.done{opacity:.45}
.cal .e{visibility:hidden}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.filters select{font:15px Arial;padding:9px;border-radius:10px;border:1px solid var(--linea);background:var(--papel)}
.day{background:var(--papel);border:1px solid var(--linea);border-radius:16px;margin:0 0 18px;overflow:hidden;scroll-margin-top:120px}
.day>header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 20px;background:var(--suave);flex-wrap:wrap}
.day>header h3{margin:0;font-size:22px}
.day .body{padding:6px 20px 18px}
.day h4{font:700 13px Arial;text-transform:uppercase;letter-spacing:.04em;color:var(--fuerte);margin:18px 0 6px}
.say{background:var(--fondo);border-radius:10px;padding:12px 14px;margin:4px 0}
.say p{margin:.2em 0}
.hook{font-family:var(--titulos);font-size:24px;line-height:1.25;margin:2px 0 6px}
.cols{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.story{border:1px dashed var(--linea);border-radius:12px;padding:12px 14px}
.note{background:#fbf3e3;border-left:4px solid #c79a3a;padding:10px 14px;border-radius:8px;font-size:15px}
label.done{display:flex;gap:8px;align-items:center;font:700 14px Arial;cursor:pointer}
label.done input{width:20px;height:20px;accent-color:var(--acento)}
ol.plain{margin:4px 0;padding-left:22px}
details{border:1px solid var(--linea);border-radius:10px;margin:8px 0;background:var(--papel)}
details summary{cursor:pointer;font:700 17px Arial;color:var(--fuerte);padding:14px 16px;min-height:48px}
details[open] summary{border-bottom:1px solid var(--linea)}
details>*:not(summary){margin-left:16px;margin-right:16px}
.sum{background:var(--suave);border-radius:10px;padding:10px 14px;margin:6px 0 10px}.sum p{margin:.2em 0}
button.copy{font:700 14px Arial;background:var(--acento);color:#fff;border:0;border-radius:999px;padding:10px 16px;margin:4px 16px 14px;cursor:pointer}
#hoy,.lang{font:700 14px Arial;text-decoration:none;background:var(--oscuro);color:#fff;border:0;border-radius:999px;padding:9px 14px;cursor:pointer}
.swatch{display:flex;gap:10px;align-items:center;margin:6px 0}
.swatch i{width:44px;height:30px;border-radius:8px;border:1px solid var(--linea);flex:none}
mark{background:#ffe58a;color:#000;padding:0 3px;border-radius:4px;font-weight:700}
.pending{background:#fff6d6;border:1px solid #e9cf72;border-radius:10px;padding:10px 14px;margin:12px 0 0}
footer{padding:40px 0;color:var(--texto);font-size:14px}
[hidden]{display:none!important}
@media (max-width:760px){.cols{grid-template-columns:1fr}.cal{gap:4px}.cal a{min-height:48px;padding:4px}.cal .tag{font-size:0;width:12px;height:12px;padding:0;margin:4px 0 0}.legend{display:block}.hook{font-size:20px}.day>header,.day .body{padding-left:14px;padding-right:14px}}
@media print{header.top,nav.toc,.filters,label.done{display:none}.day{break-inside:avoid}body{background:#fff}}
</style>
</head>

<script>
const DATA={"comoUsar": ["Esta parrilla es de una sola cuenta: Picasso Painting & Scaffolding. Todo lo que ve el público (textos en pantalla, slides, posts e historias) va en inglés. Las instrucciones para ti están en español.", "Lee una vez las partes 2 a 8. Ahí está cómo pensamos el contenido y cómo se hacen los videos. Si te saltas la regla de oro, el contenido sale mal aunque esté bien editado.", "Cada lunes abre la parte 10, filtra por la semana y revisa los 7 días. Haz primero los reels (llevan más tiempo de edición) y después los carruseles, las imágenes y las historias.", "Nadie del equipo graba y no hay voz. Cada video se arma con los videos y fotos reales de las obras de Picasso, con texto en pantalla y música. En cada ficha dice qué video o qué foto usar y en qué segundos, y en la parte 8 está la receta paso a paso.", "Cuando publiques, marca la casilla “Publicado” en la ficha. Así el calendario muestra lo que falta.", "Los corchetes nunca se publican. Antes de subir algo, busca que no quede ninguno en el texto en pantalla, el post o las historias."], "horario": "Publica entre las 12:00 y las 19:00, hora del Pacífico (California). Para afinar: en Instagram entra a Panel profesional, luego Seguidores, y mira a qué hora se conectan más. Publica 1 o 2 horas antes de ese pico. Las historias se reparten: la 1 por la mañana y la 2 por la tarde.", "regla": [{"t": "Hablamos de lo que le pasa a la gente, no del servicio", "p": "A la gente no le importa la pintura: le importa que su casa se vea vieja frente a las visitas, que la lluvia la siga dañando, que un parche en la pared se note o que pague dos veces por un trabajo mal hecho. Palabras como primer, caulk, sheen o scope of work no van al inicio."}, {"t": "Primero lo que se puede perder o ganar", "p": "Una casa mal pintada se vuelve a pelar en poco tiempo y hay que pagar otra vez. Una buena preparación hace que el trabajo dure. Abre con eso: lo que la persona arriesga o gana. Luego 1 a 3 cosas concretas, una enseñanza corta y una sola petición."}, {"t": "Una sola idea por pieza", "p": "Un reel que habla de la pintura pelada, de los colores del año y de la garantía a la vez no se entiende. Una idea, bien contada, y se acabó."}, {"t": "Que lo entienda un niño de 5 años y le importe a una persona de 50", "p": "Si tienes que explicar una palabra, cámbiala. Si a una persona con casa propia no le importaría, busca otro inicio."}], "checklist": ["¿Los primeros 2 segundos dicen qué se puede perder o ganar?", "¿El texto en pantalla y lo que se ve al inicio dicen lo mismo?", "¿Hay alguna palabra técnica al principio? Si la hay, cámbiala.", "¿El reel dura entre 30 segundos y 1 minuto?", "¿Al final se pide una sola cosa?", "¿Los textos en inglés están bien escritos y no tapan lo importante de la obra?", "¿Hay algún dato marcado VALIDAR sin confirmar? Si sí, no se publica.", "¿Se ve alguna dirección, placa de auto o cara de un cliente? Si sí, tápala antes de publicar."], "formatos": [{"f": "Reel", "para": "Llegar a gente nueva que todavía no nos conoce. Es el formato que más alcance da. Se arma con videos y fotos reales de las obras (lavado a presión, escaleras, andamios, casas antes y después), con texto en pantalla y música.", "mide": "Vistas, veces compartido y comentarios con la palabra ESTIMATE. Un reel va bien si sus vistas son por lo menos un tercio de los seguidores."}, {"f": "Carrusel", "para": "Que la gente lo guarde o se lo mande a alguien. Listas para revisar su casa, antes y después contados paso a paso, cómo se prepara una obra.", "mide": "Guardados y compartidos. Son más importantes que los likes."}, {"f": "Imagen", "para": "Recordar quiénes somos: una casa terminada, un dato útil, una frase de Nain o un saludo de temporada con algo útil.", "mide": "No esperamos alcance. Sirve para que el perfil se vea vivo y serio."}, {"f": "Historias", "para": "Que la gente que ya nos sigue confíe y nos escriba. Es donde se piden los estimados.", "mide": "Respuestas, votos en encuestas y DMs. Lo sano es que cada historia la vea entre el 5% y el 15% de los seguidores."}], "objetivos": [{"o": "Viral", "p": "Que lo vea la mayor cantidad de gente posible. Sin venta al final. Se pide que lo compartan con alguien."}, {"o": "Seguidores", "p": "Que quien lo vea quiera seguir la cuenta. Al final se da una razón concreta para seguir (por ejemplo: “next week we show this house finished”). Nunca “follow for more”."}, {"o": "Venta", "p": "Que la persona comente ESTIMATE o escriba por DM. Ahí empieza la conversación para el estimado gratis."}, {"o": "Guardado", "p": "Solo carruseles: que lo guarden para usarlo después."}, {"o": "Autoridad", "p": "Solo imágenes: que la cuenta se vea seria y útil."}], "semanaHistorias": [{"d": "Lunes", "p": "Cercanía", "q": "Que vean el trabajo de todos los días: la obra, el equipo, las furgonetas, Nain revisando. Con fotos y videos del stock. La gente contrata a quien conoce."}, {"d": "Martes", "p": "Un problema común", "q": "Que la persona se dé cuenta de que le puede pasar en su casa. Siempre con encuesta o pregunta."}, {"d": "Miércoles", "p": "Romper una duda", "q": "Contestar lo que la gente piensa y no dice: “es caro”, “después lo hago”, “es solo una pared”. Cada semana toca una duda distinta (ver tabla abajo)."}, {"d": "Jueves", "p": "Preguntas de la gente", "q": "Abrir caja de preguntas en la historia 1 y contestar una en la historia 2 con texto sobre una foto de obra."}, {"d": "Viernes", "p": "Estimado gratis por palabra", "q": "Invitar a escribir ESTIMATE para recibir el enlace del estimado gratis. Así conseguimos contactos."}, {"d": "Sábado", "p": "Prueba", "q": "Mostrar un antes y después real (sin direcciones ni placas) o un mensaje de un cliente con permiso."}, {"d": "Domingo", "p": "Invitación al estimado", "q": "Un caso corto y luego la invitación directa: “Comment ESTIMATE and Nain will come take a look”."}], "reglasHistorias": ["Nunca dos historias seguidas del mismo tipo. Si la 1 es un video de obra, la 2 es foto con texto, encuesta o imagen creada.", "La primera historia del día decide si ven la segunda. Empieza con una pregunta o con algo que dé curiosidad.", "Solo se pide el estimado 2 o 3 veces por semana (viernes y domingo). Los demás días se acompaña y se educa.", "Hechas con el celular, sin mucha edición. Lo natural funciona mejor que lo producido.", "Casas y mensajes de clientes: siempre tapar direcciones, números de casa, placas de autos y caras, y pedir permiso antes.", "El 24, 25 y 31 de diciembre y el 1 de enero las historias son de cercanía y buenos deseos, con un dato útil corto. Nada de vender. El 18 de enero (Martin Luther King Jr. Day), una historia sobria de reconocimiento, sin venta."], "glosario": [{"t": "Gancho", "d": "Lo primero que se ve. Dura 2 o 3 segundos y decide si la persona se queda o pasa al siguiente video."}, {"t": "Texto en pantalla", "d": "La frase escrita que aparece en el video. Máximo 2 líneas. No tapa lo importante de la obra."}, {"t": "CTA", "d": "Lo que le pedimos a la persona al final: comentar ESTIMATE, guardar, compartir, escribir por DM."}, {"t": "Palabra clave", "d": "ESTIMATE, en mayúsculas. La persona la comenta y le mandamos por DM el enlace del estimado gratis. Con eso sabemos quién está interesado."}, {"t": "Video de obra", "d": "Los 14 videos cortos de las obras de Picasso (lavado a presión, pintores en escalera, andamio, casas antes y después). Están en la carpeta Fotos/11-2026."}, {"t": "Portada", "d": "La imagen fija que se ve en el perfil antes de darle play al reel. Lleva el gancho escrito en grande."}, {"t": "Slide", "d": "Cada una de las imágenes de un carrusel."}, {"t": "Sticker", "d": "Los elementos de Instagram en historias: encuesta, pregunta, quiz, enlace, cuenta regresiva."}, {"t": "Antes y después", "d": "Dos fotos de la misma casa desde el mismo ángulo: cómo estaba y cómo quedó. Solo con fotos reales de Picasso."}, {"t": "Etiqueta de IA", "d": "La opción de Instagram “Información de IA” que se activa al publicar si se usó una imagen creada con IA."}, {"t": "Quien valida", "d": "La persona que revisa y aprueba lo marcado en amarillo antes de publicar. Por ahora es Nain; más adelante Roxsi, Fer o Fran."}], "recetas": [{"t": "Receta A · Video de obra + texto", "pasos": ["En la ficha del día está qué video usar (nombre exacto del archivo) y qué segundos cortar. Los videos están en la carpeta Picasso Painting/Fotos/11-2026.", "Abre CapCut, formato vertical 9:16. Importa el video y corta exactamente los segundos que dice la ficha. Si la ficha usa varios videos, ponlos en el orden que dice.", "Quita el sonido original del video (el ruido de la obra) salvo que la ficha diga que se deja el sonido del lavado a presión.", "Pon cada texto en pantalla en el segundo que dice la ficha, copiado tal cual en inglés. Letra blanca con borde azul marino #142f42, máximo 2 líneas, en el centro o arriba, sin tapar la casa ni a la persona trabajando.", "Música: la que diga la ficha, de la biblioteca de Instagram o CapCut, bajita.", "Si se ve una dirección, el número de la casa, una placa de auto o una cara de cliente, tápala con un rectángulo desenfocado.", "Portada: el primer cuadro con el gancho escrito en grande. Exporta en 1080×1920."]}, {"t": "Receta B · Fotos de obra + texto", "pasos": ["En la ficha está la lista de fotos (nombre exacto del archivo) y cuántos segundos dura cada una. Están en la carpeta Picasso Painting/Fotos/11-2026.", "En CapCut, formato 9:16. Pon las fotos en el orden de la ficha con un acercamiento lento (zoom suave del 100% al 110%).", "Pon los textos en pantalla en el segundo que dice la ficha, en inglés, tal cual. Letra blanca con borde azul marino #142f42.", "Para un antes y después, usa la transición que dice la ficha (corte directo o deslizar).", "Música la que diga la ficha. Tapa direcciones, números de casa y placas. Exporta en 1080×1920."]}, {"t": "Receta C · Carrusel o imagen en Canva", "pasos": ["Tamaño 1080×1350 (vertical). Usa los colores y la letra de la parte 7.", "Fotos: primero las fotos reales de obra que dice la ficha. Si la ficha pide una imagen creada (por ejemplo, un interior), créala en Canva con la descripción exacta de la ficha.", "Copia el texto de cada slide tal cual viene en la ficha (en inglés). Máximo 25 palabras por slide.", "Última slide: la petición final (Comment ESTIMATE) y el logo horizontal pequeño abajo.", "Descarga en PNG y sube en el orden de la ficha."]}], "cuentas": {"PP": {"nombre": "Picasso Painting & Scaffolding", "titulo": "Parrilla de Picasso Painting: pintura y andamios en la Bay Area", "intro": "Picasso Painting pinta casas y negocios en la San Francisco Bay Area, por dentro y por fuera, y monta andamios para obras altas. No hablamos de pintura al inicio: hablamos de la casa que se pela con la lluvia, del parche que se nota y de que el trabajo lo revisa el dueño antes de irse.", "promesa": "Your home, prepped right, protected while we work, and checked by the owner before we leave.", "ejemplos": [{"mal": "Professional exterior painting with premium primer and caulk.", "bien": "This paint peeled in two winters. Here's what was missing underneath."}, {"mal": "We offer interior painting services.", "bien": "Guests coming in two weeks and that wall still shows the patch?"}], "metas": [{"t": "Diciembre: interiores antes de las fiestas", "p": "Que la gente piense en una habitación lista antes de las visitas, y que vea cómo Picasso protege la casa mientras pinta."}, {"t": "Enero: proyectos pequeños y planear el exterior", "p": "Que vean que una pared o una habitación sí vale la llamada, y que empiecen a pedir estimado para el exterior de primavera."}], "campanas": [{"f": "7–17 dic", "n": "Winter Interior Refresh", "p": "Interiores antes de las fiestas. Oferta propuesta: consulta breve de color incluida con un proyecto interior elegible [VALIDAR]. Sin descuentos."}, {"f": "25 dic y 1 ene", "n": "Fiestas", "p": "Saludos con algo útil. Sin vender."}, {"f": "25 ene–5 feb", "n": "One-Room Refresh", "p": "Una habitación con su pared reparada. Oferta propuesta: crédito fijo en un proyecto interior pequeño con resane [VALIDAR]. Sin descuentos."}], "semanas": [{"n": 1, "f": "1–6 dic", "t": "Lo que la lluvia le hace a una casa", "s": "“Esa pintura pelada no es solo fea: deja entrar el agua.”"}, {"n": 2, "f": "7–13 dic", "t": "Una habitación lista antes de las visitas", "s": "“Todavía estoy a tiempo de arreglar ese cuarto.”"}, {"n": 3, "f": "14–20 dic", "t": "El color con la luz de invierno y la casa protegida", "s": "“No sabía que el mismo color se ve tan distinto.”"}, {"n": 4, "f": "21–27 dic", "t": "Fiestas: la casa, el equipo, gracias", "s": "“Detrás de cada casa hay gente que la cuidó.”"}, {"n": 5, "f": "28 dic–3 ene", "t": "El año en obras y qué arreglar primero en 2027", "s": "“Este año sí arreglo eso.”"}, {"n": 6, "f": "4–10 ene", "t": "La pared con parche que se nota", "s": "“¿Por qué se sigue notando ese parche?”"}, {"n": 7, "f": "11–17 ene", "t": "Cómo elegir pintor y leer un estimado", "s": "“Ya sé qué preguntar antes de contratar.”"}, {"n": 8, "f": "18–24 ene", "t": "Proyectos pequeños que sí valen la pena", "s": "“Sí vale la pena llamar por una sola pared.”"}, {"n": 9, "f": "25–31 ene", "t": "One-Room Refresh y planear el exterior de primavera", "s": "“Empiezo por un cuarto y dejo listo el exterior.”"}], "objeciones": [{"n": "Semana 1", "d": "Pintar cuesta demasiado", "c": "Comparar lo que cuesta pintar bien una vez con lo que cuesta repintar cuando la pintura se pela antes de tiempo."}, {"n": "Semana 2", "d": "Lo hago después de las fiestas o de las lluvias", "c": "Los interiores se pueden hacer en invierno; esperar solo deja el problema igual cuando llegan las visitas."}, {"n": "Semana 3", "d": "Es solo una pared, no vale la pena llamar", "c": "Mostrar que un proyecto pequeño también se cotiza gratis y se cuida igual."}, {"n": "Semana 4", "d": "Los pintores dejan todo sucio o no vuelven", "c": "Mostrar la protección de pisos y plantas, la chivos: VIDEO 2026-11-06 5.MP4, VIDEO 2026-11-06 7.MP4, VIDEO 2026-11-06 4.MP4, VIDEO 2026-11-16 1.mov, VIDEO COMPLETE HOUSE 2026-11-16.mov, PHOTO 2026-11-06 1.JPG y PHOTO 2026-11-06 2.JPG. Descarga también img/logo-horizontal.png de la web.", "Abre CapCut, crea un proyecto vertical 9:16 (1080×1920) y coloca los clips y fotos en el orden y con los segundos exactos del campo desarrollo. A las dos fotos ponles zoom lento de 100 % a 110 %.", "Agrega cada texto del desarrollo en su segundo: Montserrat Bold, color #f8f7f2, caja de fondo #142f42 al 85 % de opacidad, centrado en el tercio superior, máximo 2 líneas. Corte seco entre clips, sin transiciones.", "Música: instrumental acústica tranquila, sin letra, de la biblioteca de Instagram, volumen 40 %. Quita el audio original de todos los clips.", "En los últimos 6 segundos coloca el logo horizontal centrado abajo, ancho 40 % de la pantalla.", "Portada: cuadro del segundo 1 con el gancho en Playfair Display Bold #f8f7f2 sobre franja #142f42. Exporta en 1080p.", "Publica el lunes 14 de diciembre a las 11:30 a. m. hora del Pacífico con el caption exacto. Responde cada comentario en menos de 4 horas; si alguien pregunta por precio o fechas, contesta: “Every house is different, so Nain gives a free estimate in person. Want the form? Comment ESTIMATE.”"], "historias": [{"proposito": "Cercanía: mostrar cómo se protege una casa antes de pintar", "formato": "Clip corto del stock (≤15 s) con texto", "contenido": "Text: “Monday on the job: wrapping everything before the paint comes out.”", "interaccion": "Emoji slider sticker 😌 with the question: “How satisfying is this part?”", "pasos": ["Recorta VIDEO 2026-11-06 5.MP4 (v6) del segundo 0 al 12 y súbelo como historia a las 8:30 a. m. hora del Pacífico.", "Escribe el texto exacto con la fuente “Classic” de Instagram, color blanco, fondo de texto #142f42, arriba.", "Agrega el sticker de deslizador con el emoji 😌 y la pregunta exacta, centrado en la mitad inferior.", "Al final del día anota cuántas personas usaron el deslizador en la hoja de métricas de la semana."]}, {"proposito": "Cercanía: llevar tráfico al reel del día", "formato": "Repost del reel del día", "contenido": "Text: “The slow part nobody shows you. Watch till the plastic comes off.”", "interaccion": "Tap on the reel to watch it.", "pasos": ["A las 12:30 p. m. hora del Pacífico abre el reel publicado, toca el avión de papel y elige “Agregar a tu historia”.", "Agranda el reel hasta ocupar el 70 % de la pantalla y pon fondo color #eaf0ec.", "Escribe el texto exacto arriba con la fuente “Modern”, color #142f42.", "Publica y revisa a las 6:00 p. m. si alguien respondió la historia; contesta cada respuesta por DM."]}], "cuenta": "PP", "dia": "Lunes"}, {"fecha": "2026-12-15", "semana": 3, "formato": "Carrusel", "objetivo": "Guardado", "tema": "El color con la luz de invierno", "tipo_gancho": "Problema que se ve en casa", "gancho_texto": "The color looked great in July. Now it's gray.", "gancho_hablado": "Why your walls look different in December", "visual": "Slide 1 creada en Canva 1080×1350: foto de la biblioteca de Canva de una sala con pared color beige claro, sofá gris y ventana con luz de tarde nublada, sin personas. Franja inferior color #f8f7f2 con el título en Playfair Display Bold #142f42 y logo horizontal abajo. [VALIDAR: pedir foto real de interior]", "desarrollo": ["Slide 1: “The color looked great in July. Now it's gray.” · Imagen: sala de Canva descrita en visual [VALIDAR: pedir foto real de interior]", "Slide 2: “Winter light comes in lower and softer. Paint colors change with it.” · Imagen: la misma sala de Canva recortada a la ventana, filtro frío al 20 %", "Slide 3: “Tip 1: Put your sample on the darkest wall in the room. That's where it'll look worst.” · Diseño: fondo #eaf0ec, texto #142f42, ícono de brocha en #ae9168", "Slide 4: “Tip 2: Check it in the morning, late afternoon and at night with your lamps on.” · Diseño: fondo #f8f7f2, tres íconos de reloj en #1b628d", "Slide 5: “Tip 3: Go bigger than the chip. A sample the size of a poster tells you a lot more.” · Diseño: fondo #eaf0ec, rectángulo de 60 % del ancho en color #ae9168 como ejemplo de muestra", "Slide 6: “The 2027 colors of the year are both greens: Webster Green (Benjamin Moore) and Celery (Sherwin-Williams). Test them the same way.” · Diseño: dos rectángulos verdes con su nombre debajo en Montserrat [VALIDAR: tono exacto de cada color en las webs oficiales]", "Slide 7: “Painting a room this month or in January? Ask us about a short color consult with your interior project.” · Diseño: fondo #142f42, texto #f8f7f2 [VALIDAR: oferta propuesta Winter Interior Refresh, consulta de color incluida en proyecto interior elegible, aún no aprobada]", "Slide 8: “Save this for your next paint sample. Questions? Send us a DM.” · Diseño: fondo #f8f7f2, logo horizontal centrado, teléfonos (650) 207-1772 y (415) 238-0797"], "cta": "Save this before you buy your next paint sample.", "caption": "If a color you loved in summer now looks flat or gray, the paint didn't change. The light did.\nThree quick ways to test a sample before you commit are in the slides.\nSave it for the next time you're standing in the paint aisle.", "calculadora": null, "produccion": null, "clip": null, "notas": "Semana 3: el color con la luz de invierno. Campaña Winter Interior Refresh (7-17 dic): la slide 7 menciona la oferta propuesta solo si se aprueba; si no se aprueba, cambia la slide 7 por: “Painting a room this winter? We're happy to talk colors at your free estimate.” [VALIDAR: oferta Winter Interior Refresh]. No hay fotos de interiores: todas las imágenes de sala son de Canva hasta tener una real. [VALIDAR: pedir foto real de interior]", "instrucciones": ["En Canva crea un diseño de 1080×1350 con 8 páginas. Usa fondo #f8f7f2 o #eaf0ec según el desarrollo, títulos en Playfair Display Bold #142f42 y texto en Montserrat Regular #142f42.", "Slides 1 y 2: busca en la biblioteca de fotos de Canva “living room cloudy window beige wall” y elige una sala sin personas ni marcas visibles. Usa la misma foto en ambas slides.", "Copia el texto exacto de cada slide del desarrollo, sin cambiar palabras. Tamaño mínimo del texto: 44 pt en títulos, 32 pt en el resto.", "En la slide 6 dibuja dos rectángulos de 400×400 px. Antes de colorearlos, pide a la persona que valida los códigos de color oficiales de Webster Green y Celery; no inventes el tono.", "Coloca el logo horizontal (img/logo-horizontal.png) abajo al centro en las slides 1 y 8, ancho 300 px.", "Exporta en PNG y publica el martes 15 de diciembre a las 9:00 a. m. hora del Pacífico con el caption exacto.", "Si alguien pregunta qué color le recomiendas, responde: “Hard to say without seeing the room in person. Nain can look at it during a free estimate. Comment ESTIMATE if you'd like the form.”"], "historias": [{"proposito": "Problema común: detectar si su pintura se ve distinta en invierno", "formato": "Encuesta sobre diseño creado", "contenido": "Text: “Does any room in your house look grayer in winter?”", "interaccion": "Poll sticker: “Yes, one room” / “Not that I've noticed”", "pasos": ["En Canva crea una imagen de 1080×1920 con fondo #eaf0ec y la pregunta exacta en Playfair Display Bold #142f42, centrada en la mitad superior.", "Súbela como historia a las 8:30 a. m. hora del Pacífico.", "Agrega el sticker de encuesta con las dos opciones exactas debajo del texto.", "A las 7:00 p. m. envía un DM a quienes votaron “Yes, one room”: “Thanks for voting! Tip: check your paint sample on the darkest wall of that room first.”"]}, {"proposito": "Problema común: llevar al carrusel con los consejos", "formato": "Repost del carrusel del día", "contenido": "Text: “3 ways to test a paint color in winter light”", "interaccion": "Tap on the post to see the tips.", "pasos": ["A las 12:00 p. m. hora del Pacífico comparte el carrusel publicado a tu historia con el avión de papel.", "Pon fondo color #142f42 y el texto exacto arriba en la fuente “Classic”, color #f8f7f2.", "Ubica el carrusel en el centro, ocupando el 65 % de la pantalla.", "Publica y responde por DM cualquier pregunta de color con la respuesta del paso 7 de las instrucciones."]}], "cuenta": "PP", "dia": "Martes"}, {"fecha": "2026-12-16", "semana": 3, "formato": "Reel", "objetivo": "Venta", "tema": "Duda de la semana: “es solo una pared”", "tipo_gancho": "La frase que dice el cliente", "gancho_texto": "“It's just one wall.” That's how it starts.", "gancho_hablado": "One side of the house always takes the worst of the weather.", "visual": "Segundos 0-2: clip v10 “VIDEO POWER WASH EXT 2026-11-16.MP4” (segundos 0-2), lavado a presión de un costado de la casa. Gancho en Montserrat Bold #f8f7f2 sobre caja #142f42 en el tercio superior.", "desarrollo": ["0-3 s: ““It's just one wall.” That's how it starts.” · Clip: VIDEO POWER WASH EXT 2026-11-16.MP4 (v10), segundos 0-3", "3-9 s: “It's usually the side that gets the most sun or rain.” · Clip: VIDEO POWER WASH EXT 2026-11-16.MP4 (v10), segundos 4-10", "9-15 s: “That's where paint starts to peel first.” · Foto: PHOTO HOUSE EXT 2026-11-16 5.JPG (6 s, zoom lento)", "15-21 s: “One wall still gets the full prep. It gets washed first.” · Clip: POWER WASHING HOUSE EXT 2026-11-16.MP4 (v1), segundos 2-8", "21-27 s: “Small spots of damaged wood get repaired as part of the prep.” · Foto: PHOTO HOUSE PROGRESS EXT 2026-11-17 2.jpg (6 s)", "27-33 s: “Then a base coat and two coats of paint. Same as a whole house.” · Clip: VIDEO 2026-11-06 4.MP4 (v5), segundos 0-6", "33-39 s: “The estimate is free for one wall too. Nain still does them himself.” · Foto: img/nain.jpg (6 s)", "39-45 s: “Comment ESTIMATE and we'll send you the form.” · Foto: PHOTO HOUSE PROGRESS EXT 2026-11-17 10.jpg (6 s) con logo horizontal abajo"], "cta": "Comment ESTIMATE and we'll DM you the free estimate form and our phone numbers.", "caption": "A lot of people put it off because it's “only one wall.” Fair enough.\nBut that wall is usually the one taking the sun or the rain, and it's where paint gives up first.\nWe give one wall the same prep we'd give a whole house, and the estimate is free either way.\nComment ESTIMATE and we'll send you the form.", "calculadora": 15, "produccion": "Video de obra + texto", "clip": null, "notas": "Duda del miércoles de la semana 3: “it's just one wall, not worth a call”. Si alguien pregunta si aceptan trabajos de una sola pared, la respuesta la da la persona que valida. [VALIDAR: confirmar que aceptan trabajos de una sola pared exterior]", "instrucciones": ["Descarga de “Picasso Painting/Fotos/11-2026/”: VIDEO POWER WASH EXT 2026-11-16.MP4, POWER WASHING HOUSE EXT 2026-11-16.MP4, VIDEO 2026-11-06 4.MP4, PHOTO HOUSE EXT 2026-11-16 5.JPG, PHOTO HOUSE PROGRESS EXT 2026-11-17 2.jpg y PHOTO HOUSE PROGRESS EXT 2026-11-17 10.jpg. De la web descarga img/nain.jpg e img/logo-horizontal.png.", "En CapCut crea un proyecto 9:16 (1080×1920) y arma la secuencia con los segundos exactos del desarrollo. A cada foto ponle zoom lento de 100 % a 110 %.", "Agrega los textos en su segundo: Montserrat Bold #f8f7f2 sobre caja #142f42 al 85 %, tercio superior, máximo 2 líneas. En el texto del segundo 39 escribe ESTIMATE en color #ae9168.", "Música: instrumental de guitarra acústica con ritmo medio, sin letra, de la biblioteca de Instagram, volumen 40 %. Sin audio original.", "Portada: cuadro del segundo 1 con el gancho en Playfair Display Bold. Exporta en 1080p.", "Publica el miércoles 16 de diciembre a las 11:30 a. m. hora del Pacífico con el caption exacto.", "A cada persona que comente ESTIMATE, respóndele en el comentario “Sent you a DM!” y envíale por DM: “Hi! Here's the free estimate form: [enlace del formulario a confirmar]. You can also call (650) 207-1772 or (415) 238-0797. Nain does every estimate in person.”"], "historias": [{"proposito": "Romper la duda: “no vale la pena llamar por una sola pared”", "formato": "Quiz sobre diseño creado", "contenido": "Text: “Is one peeling wall worth a free estimate?”", "interaccion": "Quiz sticker: “Nah, too small” / “Yes, it's free either way” (correct answer: “Yes, it's free either way”)", "pasos": ["En Canva crea una imagen 1080×1920, fondo #f8f7f2, pregunta exacta en Playfair Display Bold #142f42 arriba.", "Súbela a las 8:30 a. m. hora del Pacífico y agrega el sticker de quiz con las dos opciones exactas; marca como correcta “Yes, it's free either way”.", "Debajo del sticker escribe en fuente “Modern” #1b628d: “Small jobs get the same prep as big ones.”", "A las 7:00 p. m. envía DM a quienes respondieron “Nah, too small”: “Totally get it. If you ever want someone to take a look, the estimate is free. Reply ESTIMATE and I'll send the form.”"]}, {"proposito": "Romper la duda: mostrar que una pared recibe la preparación completa", "formato": "Foto del stock con texto", "contenido": "Text: “One wall. Same prep. Washed, repaired, then painted.”", "interaccion": "Question sticker: “Got one wall that's bugging you?”", "pasos": ["Sube PHOTO HOUSE PROGRESS EXT 2026-11-17 2.jpg como historia a las 5:30 p. m. hora del Pacífico.", "Escribe el texto exacto arriba en la fuente “Classic”, color blanco, fondo de texto #142f42.", "Agrega el sticker de preguntas con el texto exacto en la mitad inferior.", "Contesta cada respuesta por DM al día siguiente antes de las 10:00 a. m. con la invitación a comentar ESTIMATE."]}], "cuenta": "PP", "dia": "Miércoles"}, {"fecha": "2026-12-17", "semana": 3, "formato": "Imagen", "objetivo": "Autoridad", "tema": "Pintar adentro sin vivir en una obra", "tipo_gancho": "Pregunta que se hace la persona", "gancho_texto": "Getting a room painted while you still live there?", "gancho_hablado": "Here's what we cover when we paint inside your home.", "visual": "Imagen creada en Canva 1080×1350: foto de la biblioteca de Canva de una habitación con sofá cubierto por plástico transparente, piso cubierto con lona color crema y un rodillo sobre una bandeja, sin personas. Franja superior #142f42 oat: la preparación", "tipo_gancho": "Error que cuesta dinero", "gancho_texto": "Why some paint jobs start peeling so fast", "gancho_hablado": "Before the first coat: the steps that decide how long paint holds.", "visual": "Segundos 0-2: clip v1 “POWER WASHING HOUSE EXT 2026-11-16.MP4” (segundos 0-2), lavado a presión en la parte trasera de la casa amarilla, con el gancho en el tercio superior y la etiqueta “Before the first coat” en #ae9168 arriba a la izquierda.", "desarrollo": ["0-3 s: “Why some paint jobs start peeling so fast” · Clip: POWER WASHING HOUSE EXT 2026-11-16.MP4 (v1), segundos 0-3", "3-8 s: “Paint can't stick to dirt. So the house gets washed first.” · Clip: POWER WASHING HOUSE EXT 2026-11-16.MP4 (v1), segundos 5-10", "8-13 s: “Garage doors too.” · Clip: VIDEO POWER WASHING 2026-11-16.MP4 (v11), segundos 0-5", "13-19 s: “Soft or damaged wood gets fixed. Bigger damage, we'll tell you to call a carpenter.” · Foto: PHOTO HOUSE PROGRESS EXT 2026-11-17 2.jpg (6 s)", "19-25 s: “Windows get masked so the only thing painted is what should be.” · Clip: VIDEO 2026-11-06 4.MP4 (v5), segundos 2-8", "25-31 s: “Then one base coat that helps paint grip. Then two coats of paint.” · Clip: VIDEO 2026-11-06 2.MP4 (v3), segundos 0-6", "31-37 s: “Nain walks the job himself before the crew leaves.” · Foto: img/nain.jpg (6 s)", "37-44 s: “Want to know what your house needs? Comment ESTIMATE.” · Clip: VIDEO COMPLETE HOUSE 2026-11-16.mov (v14), segundos 0-7, logo horizontal abajo"], "cta": "Comment ESTIMATE and we'll DM you the free estimate form.", "caption": "When paint peels early, the paint usually isn't the problem. The prep is.\nWe wash, fix the soft wood, tape off the windows, then put down a base coat and two coats of paint. Nain checks it all before we pack up.\nComment ESTIMATE and we'll send you the free estimate form.", "calculadora": 15, "produccion": "Video de obra + texto", "clip": null, "notas": "Serie recurrente “Before the first coat”. Semana 3: proteger la “Step 2” en #1b628d.", "Slide 6: fondo #142f42, texto exacto en Montserrat Bold 36 pt #f8f7f2 con un check #ae9168 por cada dato. Slide 7: fondo #f8f7f2, texto exacto en Playfair Display Bold 50 pt #142f42, teléfonos en Montserrat Regular 30 pt #1b628d y logo horizontal abajo.", "Publica el domingo 3 de enero a las 9:00 a. m. hora del Pacífico con el caption exacto.", "A cada ESTIMATE responde “Sent you a DM!” y por DM: “Hi! Here's the free estimate form: [enlace del formulario a confirmar]. You can also call (650) 207-1772 or (415) 238-0797. Nain does every estimate in person.” Si preguntan precio de andamio, contesta que se cotiza en el estimado."], "historias": [{"proposito": "Invitación a pedir estimado para el exterior", "formato": "Imagen creada con texto", "contenido": "Text: “Outside paint on your 2027 list? The estimate is free. Nain comes out in person.”", "interaccion": "Link sticker: “Free estimate” [enlace del formulario a confirmar]", "pasos": ["En Canva crea un diseño 1080×1920, fondo #142f42, texto exacto en Playfair Display Bold #f8f7f2 al centro, “free” en #ae9168.", "Debajo escribe (650) 207-1772 y (415) 238-0797 en Montserrat Regular #f8f7f2.", "Súbelo a las 9:30 a. m. hora del Pacífico con el sticker de enlace con el texto exacto.", "Si el enlace no está listo, usa el texto “Reply ESTIMATE” y contesta por DM."]}, {"proposito": "Invitación: llevar al carrusel con el plan", "formato": "Repost del carrusel del día", "contenido": "Text: “3 steps to plan your outside paint job”", "interaccion": "Poll sticker: “Planning it this year?” “Yes” / “Maybe”", "pasos": ["A las 2:00 p. m. hora del Pacífico comparte el carrusel a tu historia.", "Fondo #eaf0ec, carrusel centrado al 65 %, texto exacto arriba en fuente “Classic” #142f42.", "Agrega la encuesta con las opciones exactas debajo del carrusel.", "El lunes 4 envía DM a quienes votaron “Yes”: “Thanks! Reply ESTIMATE whenever you'd like the free estimate form.”"]}], "cuenta": "PP", "dia": "Domingo"}, {"fecha": "2027-01-04", "semana": 6, "formato": "Reel", "objetivo": "Viral", "tema": "Por qué se nota el parche en la pared", "tipo_gancho": "Pregunta de diagnóstico (serie What's wrong with this wall?)", "gancho_texto": "You fixed the hole. Why can everyone still see it?", "gancho_hablado": "What's wrong with this wall?", "visual": "Segundos 0–2: imagen creada en Canva de una pared blanca de sala con luz de ventana de lado y un cuadrado más brillante a la altura del interruptor de luz. Arriba, en caja azul marino #142f42, el texto «You fixed the hole. Why can everyone still see it?». [VALIDAR: pedir foto real de interior]", "desarrollo": ["0–4 s: \"What's wrong with this wall?\" (debajo: imagen de Canva 1 del paso 1, zoom lento de 100% a 110%)", "4–9 s: \"Someone patched the hole. You still see a square every time the sun comes in.\" (debajo: imagen de Canva 1, zoom hacia el cuadrado)", "9–15 s: \"The filler soaks up paint in a different way than the old wall. So that spot dries shinier or duller.\" (debajo: imagen de Canva 2 del paso 2)", "15–21 s: \"Paint only the patch and it gets worse. Now it's a box you can see from the couch.\" (debajo: imagen de Canva 2)", "21–28 s: \"Here's how we handle it. Sand the patch flat with the wall. Seal it so it takes paint like the rest.\" (debajo: v6 \"VIDEO 2026-11-06 5.MP4\", segundos 2–9)", "28–35 s: \"Then we paint the whole wall, corner to corner. One sealing coat, two coats of paint.\" (debajo: v2 \"VIDEO 2026-11-06 1.MP4\", segundos 5–12)", "35–41 s: \"Before the crew leaves, the owner checks the work himself.\" (debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 0–6)", "41–47 s: \"Know someone who patched a wall last weekend? Send them this.\" (debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 6–12, con el logo horizontal abajo)"], "cta": "Send this to someone who patched a wall last weekend.", "caption": "That square on the wall you notice every afternoon? It's not your imagination.\nFresh filler takes paint differently than the old wall, so painting just the patch leaves a box you can see.\nWe sand it flat, seal it, and paint the whole wall corner to corner.\nSend this to whoever did the patching at your place.", "calculadora": 16, "produccion": "Fotos de obra + texto", "clip": null, "notas": "Semana 6, pared reparada. Las dos imágenes de interior son de Canva porque no hay fotos reales de interiores. [VALIDAR: pedir foto real de interior]. Si llega una foto real de un parche que se nota en casa de un cliente, cambia las imágenes de Canva por esa foto (sin mostrar nada que identifique la casa).", "instrucciones": ["Imagen de Canva 1 (1080×1920): en Canva, Elementos > Fotos, busca «white living room wall window light» y elige una pared blanca lisa con luz entrando de lado. Encima pon un rectángulo de 260×260 px, color #ffffff con transparencia al 85%, a la altura de un interruptor de luz, para que se vea como un parche más brillante. Descarga en PNG. [VALIDAR: pedir foto real de interior]", "Imagen de Canva 2 (1080×1920): duplica la imagen 1 y acerca el zoom al 160% sobre el rectángulo, para que se vea el borde del parche de cerca. Descarga en PNG.", "Abre un proyecto nuevo en CapCut en 9:16 (1080×1920) y pon en este orden: imagen 1 (0–9 s), imagen 2 (9–21 s), v6 «VIDEO 2026-11-06 5.MP4» segundos 2–9, v2 «VIDEO 2026-11-06 1.MP4» segundos 5–12, v14 «VIDEO COMPLETE HOUSE 2026-11-16.mov» segundos 0–12. A las imágenes ponles animación de zoom lento de 100% a 110%.", "Textos en pantalla: copia cada texto del desarrollo en el segundo exacto que indica. Fuente Montserrat Bold, 56 pt, color blanco #ffffff, dentro de una caja azul marino #142f42 al 85% de opacidad, centrada en el tercio superior. Corte seco entre textos, sin animación de entrada.", "En los segundos 41–47 pon el logo horizontal (archivo de la web img/logo-horizontal.png) abajo al centro, 600 px de ancho.", "Música: instrumental acústica tranquila, sin letra, de la biblioteca de Instagram, al 30% de volumen. Sin voz.", "Portada: el primer cuadro (imagen 1) con el texto «You fixed the hole. Why can everyone still see it?» en Georgia Bold, blanco, caja #142f42.", "Publica el lunes 4 de enero a las 6:00 p. m. hora del Pacífico con el caption de esta ficha.", "Comentarios: si alguien cuenta que tiene un parche así, responde «That happens a lot. If you want, send us a photo by DM and we'll tell you what it needs.» Si escriben ESTIMATE, manda por DM el formulario [enlace al formulario de estimado a confirmar] y los teléfonos (650) 207-1772 y (415) 238-0797."], "historias": [{"proposito": "Cercanía: mostrar cómo empieza un día de obra", "formato": "Clip del stock con texto", "contenido": "Clip v6 con el texto: \"Monday on the job. Plastic goes down before any paint can opens.\"", "interaccion": "Sticker de reacción con emoji 👍 y la pregunta \"Did you know we cover everything first?\"", "pasos": ["Abre Instagram > Historia y sube v6 «VIDEO 2026-11-06 5.MP4», recortado de los segundos 0 a 12.", "Escribe el texto «Monday on the job. Plastic goes down before any paint can opens.» en fuente Clásica, blanco, con fondo azul marino #142f42, arriba al centro.", "Agrega el sticker de deslizador con emoji 👍 y escribe en él «Did you know we cover everything first?».", "Publica a las 9:00 a. m. hora del Pacífico."]}, {"proposito": "Cercanía: que conozcan a Nain, el dueño", "formato": "Foto del stock con frase real", "contenido": "Foto de Nain con las furgonetas y su frase: \"I still do the estimates myself.\" Debajo, en pequeño: \"Nain, owner of Picasso Painting & Scaffolding\".", "interaccion": "Sticker de pregunta: \"Ask Nain anything about your walls\"", "pasos": ["Sube la foto de la web img/nain.jpg a una historia nueva.", "Escribe la frase «I still do the estimates myself.» en fuente Clásica, 40 pt, blanco, con fondo #142f42, en el tercio inferior.", "Debajo, en fuente Moderna y 24 pt, escribe «Nain, owner of Picasso Painting & Scaffolding».", "Agrega el sticker de preguntas con el texto «Ask Nain anything about your walls» arriba a la derecha.", "Publica a las 4:00 p. m. hora del Pacífico y guarda las preguntas que lleguen para la historia del jueves 7."]}], "cuenta": "PP", "dia": "Lunes"}, {"fecha": "2027-01-05", "semana": 6, "formato": "Carrusel", "objetivo": "Guardado", "tema": "Tres razones por las que un parche se nota", "tipo_gancho": "Problema que ves todos los días", "gancho_texto": "Why that repaired spot on your wall still shows", "gancho_hablado": "Why that repaired spot on your wall still shows", "visual": "Slide 1: imagen de Canva de una pared blanca de pasillo con un rectángulo más brillante cerca del zócalo y el título en Georgia Bold azul marino #142f42 sobre franja crema #f8f7f2. [VALIDAR: pedir foto real de interior]", "desarrollo": ["Slide 1: \"Why that repaired spot on your wall still shows\" (imagen de Canva: pared blanca de pasillo con parche más brillante)", "Slide 2: \"Reason 1: the patch is smoother or rougher than the wall around it. Light from a window catches the edge.\" (misma imagen de Canva con zoom al 160% sobre el borde del parche)", "Slide 3: \"Reason 2: the filler drinks paint differently. Same color on top, different shine.\" (fondo crema #f8f7f2 con un círculo dibujado en dorado #ae9168 alrededor del parche de la imagen recortada)", "Slide 4: \"Reason 3: only the patch got painted. Old paint fades a little, so fresh paint next to it won't match.\" (fondo verde claro #eaf0ec, texto solo)", "Slide 5: \"The fix: sand it level, seal the patch, then paint the full wall from corner to corner.\" (foto \"PHOTO 2026-11-06 1.JPG\" de preparación con plásticos, texto en caja #142f42)", "Slide 6: \"How we do it on every job: one sealing coat and two coats of paint. Your labeled touch-up paint stays with you.\" (foto \"PHOTO 2026-11-06 2.JPG\")", "Slide 7: \"Save this for the next time someone moves the TV.\" (fondo azul marino #142f42, texto crema, logo horizontal abajo)"], "cta": "Save this for the next time you patch a wall.", "caption": "Patching the hole is the easy part. Making it disappear is where most fixes fall short.\nThree reasons the spot still shows, and how we deal with it, are in the slides.\nSave it for the next time a shelf or a TV comes off the wall.", "calculadora": null, "produccion": null, "clip": null, "notas": "Semana 6, pared reparada. Slides 1 a 3 usan imagen creada en Canva porque no hay fotos de interiores. [VALIDAR: pedir foto real de interior]. Slides 5 y 6 son fotos reales de exterior; el texto habla del método, que es el mismo.", "instrucciones": ["En Canva crea un diseño de 1080×1350 con 7 páginas. Fondo crema #f8f7f2 salvo donde la ficha diga otro color.", "Imagen de las slides 1 y 2: en Canva, Elementos > Fotos, busca «white hallway wall» y elige una pared blanca lisa con luz de lado. Encima pon un rectángulo de 220×160 px, color #ffffff con transparencia al 85%, cerca del zócalo, para simular el parche brillante. [VALIDAR: pedir foto real de interior]", "Títulos en Georgia Bold 64 pt color #142f42; textos de las slides 2 a 6 en Montserrat Medium 40 pt color #142f42, alineados a la izquierda, con margen de 80 px.", "Slide 3: recorta la imagen al parche y dibuja un círculo de línea dorada #ae9168 de 8 px alrededor. Slide 4: fondo #eaf0ec, solo texto.", "Slides 5 y 6: pon las fotos «PHOTO 2026-11-06 1.JPG» y «PHOTO 2026-11-06 2.JPG» a página completa y el texto en una caja #142f42 al 85% con letra crema #f8f7f2 en la parte de abajo.", "Slide 7: fondo #142f42, texto crema #f8f7f2 en Georgia Bold 64 pt centrado y el logo horizontal (img/logo-horizontal.png) abajo, 500 px de ancho.", "Exporta en PNG y publica el martes 5 de enero a la 1:00 p. m. hora del Pacífico con el caption de esta ficha.", "Comentarios: si alguien pregunta si pueden arreglar su pared, responde «We can take a look. Send us a photo by DM or comment ESTIMATE and we'll send you the free estimate form.»"], "historias": [{"proposito": "Problema común: que la gente reconozca el parche en su propia casa", "formato": "Imagen creada con encuesta", "contenido": "Texto: \"Is there a spot on your wall you notice every single day?\"", "interaccion": "Encuesta con dos opciones: \"Yes, every day\" / \"Not that I know of\"", "pasos": ["En Canva crea una imagen de 1080×1920 con fondo crema #f8f7f2 y el texto «Is there a spot on your wall you notice every single day?» en Georgia Bold 64 pt, color #142f42, en el tercio superior.", "Súbela a una historia de Instagram.", "Agrega el sticker de encuesta en el centro con las opciones «Yes, every day» y «Not that I know of».", "Publica a las 9:00 a. m. hora del Pacífico.", "A quien vote «Yes, every day» mándale por DM: «Thanks for voting! Today's post explains why that spot still shows.»"]}, {"proposito": "Llevar a la gente al carrusel del día", "formato": "Repost del carrusel del día", "contenido": "Repost del carrusel con el texto: \"Slide 5 is the fix.\"", "interaccion": "Sticker de enlace al post (toque en el post compartido)", "pasos": ["Abre el carrusel publicado, toca el avión de papel y elige «Agregar a tu historia».", "Escribe arriba «Slide 5 is the fix.» en fuente Moderna, blanco, con fondo #1b628d.", "Agranda el post hasta que ocupe el 70% de la pantalla.", "Publica a las 4:00 p. m. hora del Pacífico."]}], "cuenta": "PP", "dia": "Martes"}, {"fecha": "2027-01-06", "semana": 6, "formato": "Reel", "objetivo": "Venta", "tema": "Duda: el invierno no sirve para pintar", "tipo_gancho": "Creencia equivocada en forma de pregunta", "gancho_texto": "Think you have to wait for summer to paint?", "gancho_hablado": "Think you have to wait for summer to paint?", "visual": "Segundos 0–2: v8, la casa azul antes de pintar, con plantas y calabazas al frente. Texto arriba en caja #142f42: «Think you have to wait for summer to paint?».", "desarrollo": ["0–3 s: \"Think you have to wait for summer to paint?\" (debajo: v8 \"VIDEO 2026-11-06 7.MP4\", segundos 0–3)", "3–9 s: \"The rooms inside your house don't care about the rain. Winter works for them.\" (debajo: imagen de Canva del paso 1)", "9–16 s: \"Outside is different. In the Bay Area, the dry season runs from May to October.\" (debajo: v1 \"POWER WASHING HOUSE EXT 2026-11-16.MP4\", segundos 2–9)", "16–23 s: \"So winter is a good time to plan the outside. The owner walks your house and writes the estimate.\" (debajo: v8 \"VIDEO 2026-11-06 7.MP4\", segundos 10–17)", "23–30 s: \"You pick colors without rushing. Wood that needs repair gets spotted and written down.\" (debajo: v8 \"VIDEO 2026-11-06 7.MP4\", segundos 20–27)", "30–37 s: \"When the dry months come, the plan is already done.\" (debajo: v2 \"VIDEO 2026-11-06 1.MP4\", segundos 0–7)", "37–43 s: \"Inside now and outside later. Or just the estimate for now. Your call.\" (debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 0–6)", "43–48 s: \"Comment ESTIMATE and we'll send you the free estimate form.\" (debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 6–11, con el logo horizontal abajo)"], "cta": "Comment ESTIMATE and we'll send you the free estimate form.", "caption": "A lot of people put painting off until summer. For the rooms inside, there's no reason to wait.\nFor the outside, winter is when you get the estimate and pick colors, so it's ready for the dry months.\nComment ESTIMATE and we'll send you the free estimate form.", "calculadora": 15, "produccion": "Video de obra + texto", "clip": null, "notas": "Duda de la semana 6. Primer aviso suave de pedir el estimado de exterior para primavera, sin fechas límite ni urgencia. [VALIDAR: confirmar que pintan interiores en cualquier mes del invierno sin condiciones especiales]. [VALIDAR: pedir foto real de interior] para el segundo 3–9.", "instrucciones": ["Imagen de Canva (1080×1920): en Elementos > Fotos busca «cozy living room winter window rain» y elige una sala con la ventana mojada por la lluvia y paredes claras. Sin texto encima, el texto se pone en CapCut. Descarga en PNG. [VALIDAR: pedir foto real de interior]", "Abre un proyecto nuevo en CapCut en 9:16 y pon en este orden: v8 «VIDEO 2026-11-06 7.MP4» segundos 0–3, imagen de Canva (6 s, zoom lento de 100% a 110%), v1 «POWER WASHING HOUSE EXT 2026-11-16.MP4» segundos 2–9, v8 segundos 10–17, v8 segundos 20–27, v2 «VIDEO 2026-11-06 1.MP4» segundos 0–7, v14 «VIDEO COMPLETE HOUSE 2026-11-16.mov» segundos 0–11.", "Textos en pantalla: copia cada texto del desarrollo en su segundo. Montserrat Bold 56 pt, blanco, caja #142f42 al 85%, tercio superior. La palabra ESTIMATE del último texto en dorado #ae9168.", "Logo horizontal (img/logo-horizontal.png) abajo al centro en los segundos 43–48.", "Música: instrumental acústica tranquila, sin letra, de la biblioteca de Instagram, al 30%. Sin voz.", "Portada: cuadro del segundo 1 de v8 con el texto «Think you have to wait for summer to paint?» en Georgia Bold blanco sobre caja #142f42.", "Publica el miércoles 6 de enero a las 6:00 p. m. hora del Pacífico con el caption de esta ficha.", "A cada persona que comente ESTIMATE respóndele en el comentario «Sent! Check your DMs.» y por DM: «Thanks for reaching out! Here's our free estimate form: [enlace al formulario de estimado a confirmar]. You can also call (650) 207-1772 or (415) 238-0797. Nain, the owner, does the estimates himself.»"], "historias": [{"proposito": "Romper la duda del invierno con un dato real", "formato": "Imagen creada con quiz", "contenido": "Texto: \"Quick one: when is the dry season for outside painting in the Bay Area?\"", "interaccion": "Quiz con tres opciones: \"December to February\" / \"May to October\" (correcta) / \"Only in March\"", "pasos": ["En Canva crea una imagen de 1080×1920, fondo verde claro #eaf0ec, con el texto «Quick one: when is the dry season for outside painting in the Bay Area?» en Georgia Bold 60 pt color #142f42, arriba.", "Súbela a una historia y agrega el sticker de quiz con «December to February», «May to October» y «Only in March». Marca «May to October» como correcta.", "Publica a las 9:00 a. m. hora del Pacífico.", "A las 2:00 p. m. revisa quién respondió y a quien falló escríbele por DM: «No worries! That's why winter is a good time to plan the outside.»"]}, {"proposito": "Llevar a pedir el estimado sin presión", "formato": "Foto del stock con texto y sticker de enlace", "contenido": "Foto de la casa gris terminada con el texto: \"Winter: paint the inside, plan the outside.\"", "interaccion": "Sticker de enlace \"Free estimate\" [enlace al formulario de estimado a confirmar]", "pasos": ["Sube la foto «PHOTO COMPLETE HOUSE 2026-11-16.JPG» a una historia nueva.", "Escribe «Winter: paint the inside, plan the outside.» en fuente Clásica, 40 pt, blanco, con fondo #142f42, en el tercio superior.", "Agrega el sticker de enlace con el texto «Free estimate» y el enlace [enlace al formulario de estimado a confirmar]. Si el enlace aún no existe, usa el sticker de mención a @ de la cuenta con el texto «Link in bio».", "Publica a las 4:00 p. m. hora del Pacífico."]}], "cuenta": "PP", "dia": "Miércoles"}, {"fecha": "2027-01-07", "semana": 6, "formato": "Imagen", "objetivo": "Autoridad", "tema": "Reparar antes de pintar", "tipo_gancho": "Afirmación del método", "gancho_texto": "New paint over bad wood still looks bad", "gancho_hablado": "We fix it before we paint it.", "visual": "Foto real «PHOTO-2026-09-23-14-30-05.jpg» (casa roja con escalera en obra) a página completa. Abajo, franja azul marino #142f42 con la frase «We fix it before we paint it.» en Georgia Bold color crema #f8f7f2 y el logo horizontal debajo.", "desarrollo": ["Image text: \"We fix it before we paint it.\"", "Small line under it: \"Licensed painters. Small wood repairs are part of the prep.\"", "Bottom: Picasso Painting & Scaffolding logo"], "cta": "Comment ESTIMATE if you have a spot like this at home.", "caption": "Paint can hide a soft board for a while. It doesn't fix it.\nWhen we prep a house, small wood damage gets repaired or replaced before any paint goes on. If the damage is bigger, we'll tell you and recommend a carpenter.\nGot a spot you've been painting over for years? Comment ESTIMATE.", "calculadora": null, "produccion": null, "clip": null, "notas": "Semana 6, reparar antes de pintar. Pieza de exterior con foto real.", "instrucciones": ["En Canva crea un diseño de 1080×1350 y pon la foto «PHOTO-2026-09-23-14-30-05.jpg» a página completa.", "Agrega abajo un rectángulo de 1080×380 px color #142f42 al 90% de opacidad.", "Dentro escribe «We fix it before we paint it.» en Georgia Bold 64 pt color #f8f7f2, centrado.", "Debajo escribe «Licensed painters. Small wood repairs are part of the prep.» en Montserrat Medium 30 pt color #ae9168.", "Pon el logo horizontal (img/logo-horizontal.png) al fondo de la franja, 420 px de ancho, centrado.", "Exporta en PNG y publica el jueves 7 de enero a las 12:00 p. m. hora del Pacífico con el caption de esta ficha.", "A quien comente ESTIMATE respóndele «Sent! Check your DMs.» y manda por DM el formulario [enlace al formulario de estimado a confirmar] y los teléfonos (650) 207-1772 y (415) 238-0797."], "historias": [{"proposito": "Recoger dudas reales sobre paredes y reparaciones", "formato": "Caja de preguntas sobre imagen creada", "contenido": "Texto: \"Crack, hole, stain or soft wood? Ask us what it needs.\"", "interaccion": "Caja de preguntas: \"Ask about your walls\"", "pasos": ["En Canva crea una imagen de 1080×1920 con fondo #1b628d y el texto «Crack, hole, stain or soft wood? Ask us what it needs.» en Georgia Bold 60 pt, blanco, arriba.", "Súbela a una historia y agrega el sticker de preguntas con el texto «Ask about your walls» en el centro.", "Publica a las 9:00 a. m. hora del Pacífico.", "A las 3:30 p. m. elige la pregunta más repetida (o una de las que llegaron el lunes 4) para la historia 2."]}, {"proposito": "Responder una pregunta y mostrar que saben de lo que hablan", "formato": "Respuesta a la caja de preguntas con imagen creada", "contenido": "Respuesta a la pregunta elegida. Plan B si no llega ninguna: pregunta \"Will the patch show after you paint?\" y respuesta \"Not if the patch is sanded, sealed and the whole wall gets painted after. That's how we do it.\"", "interaccion": "Sticker de reacción con emoji 🙌", "pasos": ["Toca la respuesta elegida en el visor de respuestas de la caja de preguntas y elige «Compartir respuesta».", "Pon el fondo de color #f8f7f2 y escribe la respuesta en fuente Moderna, 32 pt, color #142f42, debajo de la pregunta.", "Si no llegó ninguna pregunta, crea en Canva una imagen 1080×1920 fondo #f8f7f2 con la pregunta «Will the patch show after you paint?» arriba en Georgia Bold y la respuesta «Not if the patch is sanded, sealed and the whole wall gets painted after. That's how we do it.» en Montserrat 36 pt.", "Agrega el sticker de deslizador con emoji 🙌.", "Publica a las 4:00 p. m. hora del Pacífico. Si la respuesta necesita un dato técnico que no está en esta ficha, ponlo como [VALIDAR] y no lo publiques hasta que se revise."]}], "cuenta": "PP", "dia": "Jueves"}, {"fecha": "2027-01-08", "semana": 6, "formato": "Reel", "objetivo": "Venta", "tema": "La preparación antes de la primera mano", "tipo_gancho": "Lo que no se ve (serie Before the first coat)", "gancho_texto": "What happens before any paint touches your house", "gancho_hablado": "Before the first coat", "visual": "Segundos 0–2: v11, un trabajador lavando a presión la puerta del garaje. Texto arriba en caja #142f42: «What happens before any paint touches your house».", "desarrollo": ["0–3 s: \"What happens before any paint touches your house\" (debajo: v11 \"VIDEO POWER WASHING 2026-11-16.MP4\", segundos 0–3)", "3–9 s: \"Before the first coat, the walls get washed so the paint goes on a clean surface.\" (debajo: v10 \"VIDEO POWER WASH EXT 2026-11-16.MP4\", segundos 3–9)", "9–16 s: \"Plastic goes over plants, floors and anything that isn't getting paint.\" (debajo: v6 \"VIDEO 2026-11-06 5.MP4\", segundos 0–7)", "16–22 s: \"Windows get taped and covered.\" (debajo: v5 \"VIDEO 2026-11-06 4.MP4\", segundos 0–6)", "22–29 s: \"Small wood damage gets repaired or replaced. If it's bigger, we tell you to call a carpenter.\" (debajo: foto \"PHOTO-2026-09-23-14-30-05.jpg\", 7 s con zoom lento)", "29–35 s: \"Then one sealing coat and two coats of paint.\" (debajo: v7 \"VIDEO 2026-11-06 6.MP4\", segundos 4–10)", "35–41 s: \"We clean up every day. Labeled touch-up paint stays with you.\" (debajo: v12 \"VIDEO-2026-09-23-14-29-30.mp4\", segundos 0–6)", "41–46 s: \"And the owner checks it all before we leave.\" (debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 0–5)", "46–51 s: \"Comment ESTIMATE for the free estimate form.\" (debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 5–10, con el logo horizontal abajo)"], "cta": "Comment ESTIMATE for the free estimate form.", "caption": "Most of a good paint job happens before the paint can opens.\nWashing, covering, taping, fixing small wood damage. Then one sealing coat and two of paint, and Nain checks it before the crew leaves.\nComment ESTIMATE and we'll send you the free estimate form.", "calculadora": 15, "produccion": "Video de obra + texto", "clip": null, "notas": "Semana 6. Serie Before the first coat. Todo lo que dice el reel está en los datos confirmados del cliente.", "instrucciones": ["Abre un proyecto nuevo en CapCut en 9:16 y pon en este orden: v11 «VIDEO POWER WASHING 2026-11-16.MP4» segundos 0–3, v10 «VIDEO POWER WASH EXT 2026-11-16.MP4» segundos 3–9, v6 «VIDEO 2026-11-06 5.MP4» segundos 0–7, v5 «VIDEO 2026-11-06 4.MP4» segundos 0–6, foto «PHOTO-2026-09-23-14-30-05.jpg» 7 s con zoom lento de 100% a 110%, v7 «VIDEO 2026-11-06 6.MP4» segundos 4–10, v12 «VIDEO-2026-09-23-14-29-30.mp4» segundos 0–6, v14 «VIDEO COMPLETE HOUSE 2026-11-16.mov» segundos 0–10.", "Quita el sonido original de todos los clips.", "Textos en pantalla: copia cada texto del desarrollo en su segundo. Montserrat Bold 56 pt, blanco, caja #142f42 al 85%, tercio superior. En el segundo 3 agrega
