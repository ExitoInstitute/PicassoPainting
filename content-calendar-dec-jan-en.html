<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content calendar December and January</title>
<style>
:root{--warn:#992f23}
body[data-c="PP"]{--acento:#1b628d;--acento2:#ae9168;--fondo:#f8f7f2;--papel:#fff;--tinta:#142f42;--texto:#566b75;--linea:#dbe2de;--fuerte:#11496b;--oscuro:#0b2535;--suave:#eaf0ec;--titulos:"Iowan Old Style","Palatino Linotype",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.55 Arial,Helvetica,sans-serif}
h1,h2,h3{font-family:var(--titulos);line-height:1.2;margin:0 0 .5em}
a{color:var(--fuerte)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header.top{background:var(--papel);border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;flex-wrap:wrap}
.top img{height:38px;width:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.chip{font:600 14px Arial,sans-serif;border:1px solid var(--linea);background:var(--papel);color:var(--tinta);padding:9px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--acento);border-color:var(--acento);color:#fff}
nav.toc{background:var(--suave);border-bottom:1px solid var(--linea)}
nav.toc .wrap{display:flex;gap:16px;overflow-x:auto;padding:10px 16px;font-size:14px;white-space:nowrap}
section{padding:36px 0 8px}
.hero{padding:40px 0 10px}
.hero h1{font-size:clamp(30px,4.4vw,48px)}
.hero p{max-width:760px;color:var(--texto);font-size:18px}
.card{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:20px;margin:0 0 14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.muted{color:var(--texto)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps>li{counter-increment:s;position:relative;padding:0 0 10px 38px}
.steps>li:before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--acento);color:#fff;font:700 13px/26px Arial;text-align:center}
.bad,.good{padding:12px 14px;border-radius:10px;margin:6px 0}
.bad{background:#f6e9e6;border-left:4px solid var(--warn)}
.good{background:var(--suave);border-left:4px solid var(--acento)}
.tag{display:inline-block;font:700 12px Arial;letter-spacing:.03em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--suave);color:var(--fuerte);margin:0 4px 4px 0}
.f-Reel{background:var(--acento);color:#fff}.f-Carrusel{background:var(--acento2);color:var(--oscuro)}.f-Imagen{background:var(--oscuro);color:#fff}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--linea);vertical-align:top}
th{font-size:13px;color:var(--texto);text-transform:uppercase;letter-spacing:.03em}
.tablewrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.legend{display:none;font-size:13px;margin:8px 0 0}
.cal .h{font:700 12px Arial;color:var(--texto);text-align:center;text-transform:uppercase}
.cal a{display:block;min-height:64px;background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:6px;text-decoration:none;color:var(--tinta);font-size:12px}
.cal a b{display:block;font-size:15px}
.cal a.done{opacity:.45}
.cal .e{visibility:hidden}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.filters select{font:15px Arial;padding:9px;border-radius:10px;border:1px solid var(--linea);background:var(--papel)}
.day{background:var(--papel);border:1px solid var(--linea);border-radius:16px;margin:0 0 18px;overflow:hidden;scroll-margin-top:120px}
.day>header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 20px;background:var(--suave);flex-wrap:wrap}
.day>header h3{margin:0;font-size:22px}
.day .body{padding:6px 20px 18px}
.day h4{font:700 13px Arial;text-transform:uppercase;letter-spacing:.04em;color:var(--fuerte);margin:18px 0 6px}
.say{background:var(--fondo);border-radius:10px;padding:12px 14px;margin:4px 0}
.say p{margin:.2em 0}
.hook{font-family:var(--titulos);font-size:24px;line-height:1.25;margin:2px 0 6px}
.cols{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.story{border:1px dashed var(--linea);border-radius:12px;padding:12px 14px}
.note{background:#fbf3e3;border-left:4px solid #c79a3a;padding:10px 14px;border-radius:8px;font-size:15px}
label.done{display:flex;gap:8px;align-items:center;font:700 14px Arial;cursor:pointer}
label.done input{width:20px;height:20px;accent-color:var(--acento)}
ol.plain{margin:4px 0;padding-left:22px}
details{border:1px solid var(--linea);border-radius:10px;margin:8px 0;background:var(--papel)}
details summary{cursor:pointer;font:700 17px Arial;color:var(--fuerte);padding:14px 16px;min-height:48px}
details[open] summary{border-bottom:1px solid var(--linea)}
details>*:not(summary){margin-left:16px;margin-right:16px}
.sum{background:var(--suave);border-radius:10px;padding:10px 14px;margin:6px 0 10px}.sum p{margin:.2em 0}
button.copy{font:700 14px Arial;background:var(--acento);color:#fff;border:0;border-radius:999px;padding:10px 16px;margin:4px 16px 14px;cursor:pointer}
#hoy,.lang{font:700 14px Arial;text-decoration:none;background:var(--oscuro);color:#fff;border:0;border-radius:999px;padding:9px 14px;cursor:pointer}
.swatch{display:flex;gap:10px;align-items:center;margin:6px 0}
.swatch i{width:44px;height:30px;border-radius:8px;border:1px solid var(--linea);flex:none}
mark{background:#ffe58a;color:#000;padding:0 3px;border-radius:4px;font-weight:700}
.pending{background:#fff6d6;border:1px solid #e9cf72;border-radius:10px;padding:10px 14px;margin:12px 0 0}
footer{padding:40px 0;color:var(--texto);font-size:14px}
[hidden]{display:none!important}
@media (max-width:760px){.cols{grid-template-columns:1fr}.cal{gap:4px}.cal a{min-height:48px;padding:4px}.cal .tag{font-size:0;width:12px;height:12px;padding:0;margin:4px 0 0}.legend{display:block}.hook{font-size:20px}.day>header,.day .body{padding-left:14px;padding-right:14px}}
@media print{header.top,nav.toc,.filters,label.done{display:none}.day{break-inside:avoid}body{background:#fff}}
</style>
</head>

<script>
const DATA={"comoUsar": ["This content calendar is for a single account: Picasso Painting & Scaffolding. Everything is in English: what the public sees (on-screen text, slides, posts and stories) and the instructions for you.", "Read parts 2 to 8 once. They explain how we think about content and how the videos are made. If you skip the golden rule, the content comes out wrong even if it is well edited.", "Every Monday open part 10, filter by the week and review the 7 days. Make the reels first (they take the most editing time), then the carousels, the images and the stories.", "Nobody on the team films and there is no voiceover. Every video is built from real videos and photos of Picasso's jobs, with on-screen text and music. Each card says which video or photo to use and at which seconds, and part 8 has the step-by-step recipe.", "When you publish, check the “Published” box on the card. That way the calendar shows what is left.", "Brackets are never published. Before posting anything, check that none are left in the on-screen text, the post or the stories."], "horario": "Post between 12:00 and 7:00 PM Pacific time (California). To fine-tune: in Instagram go to Professional dashboard, then Followers, and see when most of them are online. Post 1 or 2 hours before that peak. Stories are spread out: story 1 in the morning and story 2 in the afternoon.", "regla": [{"t": "We talk about what happens to people, not about the service", "p": "People don't care about paint: they care that their house looks old in front of guests, that the rain keeps damaging it, that a patch on the wall shows or that they pay twice for a bad job. Words like primer, caulk, sheen or scope of work don't go at the start."}, {"t": "First what can be lost or gained", "p": "A badly painted house peels again soon and you have to pay again. Good prep makes the job last. Open with that: what the person risks or gains. Then 1 to 3 concrete things, one short lesson and a single ask."}, {"t": "One idea per piece", "p": "A reel that talks about peeling paint, the colors of the year and the warranty all at once is not understood. One idea, well told, and that's it."}, {"t": "A 5-year-old should understand it and a 50-year-old should care about it", "p": "If you have to explain a word, change it. If a homeowner wouldn't care, find another opening."}], "checklist": ["Do the first 2 seconds say what can be lost or gained?", "Do the on-screen text and what you see at the start say the same thing?", "Is there any technical word at the start? If so, change it.", "Is the reel between 30 seconds and 1 minute long?", "Is only one thing asked at the end?", "Are the English texts well written and do they avoid covering the important part of the job?", "Is there any fact marked TO VALIDATE that is not confirmed? If so, it is not published.", "Is any address, license plate or client's face visible? If so, cover it before publishing."], "formatos": [{"f": "Reel", "para": "Reaching new people who don't know us yet. It is the format that gives the most reach. It is built from real videos and photos of the jobs (pressure washing, ladders, scaffolding, houses before and after), with on-screen text and music.", "mide": "Views, shares and comments with the word ESTIMATE. A reel is doing well if its views are at least a third of the followers."}, {"f": "Carrusel", "para": "For people to save it or send it to someone. Checklists to review their home, before and afters told step by step, how a job is prepared.", "mide": "Saves and shares. They matter more than likes."}, {"f": "Imagen", "para": "Reminding people who we are: a finished house, a useful tip, a quote from Nain or a seasonal greeting with something useful.", "mide": "We don't expect reach. It serves to make the profile look alive and serious."}, {"f": "Stories", "para": "For the people who already follow us to trust us and message us. It is where estimates are requested.", "mide": "Replies, poll votes and DMs. A healthy sign is that each story is seen by between 5% and 15% of followers."}], "objetivos": [{"o": "Viral", "p": "For as many people as possible to see it. No sales ask at the end. We ask them to share it with someone."}, {"o": "Followers", "p": "For whoever sees it to want to follow the account. At the end we give a concrete reason to follow (for example: “next week we show this house finished”). Never “follow for more”."}, {"o": "Sales", "p": "For the person to comment ESTIMATE or send a DM. That is where the conversation for the free estimate starts."}, {"o": "Saves", "p": "Carousels only: for people to save it to use later."}, {"o": "Authority", "p": "Images only: for the account to look serious and useful."}], "semanaHistorias": [{"d": "Monday", "p": "Closeness", "q": "Show the everyday work: the job site, the team, the vans, Nain checking. With photos and videos from stock. People hire whoever they know."}, {"d": "Tuesday", "p": "A common problem", "q": "For the person to realize it could happen in their own house. Always with a poll or a question."}, {"d": "Wednesday", "p": "Break a doubt", "q": "Answer what people think and don't say: “it's expensive”, “I'll do it later”, “it's just one wall”. Each week covers a different doubt (see table below)."}, {"d": "Thursday", "p": "Questions from people", "q": "Open a question box in story 1 and answer one in story 2 with text over a job-site photo."}, {"d": "Friday", "p": "Free estimate by keyword", "q": "Invite people to write ESTIMATE to get the link for the free estimate. That is how we get leads."}, {"d": "Saturday", "p": "Proof", "q": "Show a real before and after (no addresses or plates) or a message from a client with permission."}, {"d": "Sunday", "p": "Estimate invitation", "q": "A short case and then the direct invitation: “Comment ESTIMATE and Nain will come take a look”."}], "reglasHistorias": ["Never two stories in a row of the same type. If 1 is a job-site video, 2 is a photo with text, a poll or a created image.", "The first story of the day decides whether they see the second one. Start with a question or something that sparks curiosity.", "The estimate is only asked for 2 or 3 times a week (Friday and Sunday). The other days we accompany and educate.", "Made with a phone, without much editing. Natural works better than produced.", "Houses and client messages: always cover addresses, house numbers, car plates and faces, and ask permission first.", "On December 24, 25 and 31 and January 1 the stories are about closeness and good wishes, with a short useful tip. Nothing to sell. On January 18 (Martin Luther King Jr. Day), a sober story of remembrance, with no sales."], "glosario": [{"t": "Hook", "d": "The first thing you see. It lasts 2 or 3 seconds and decides whether the person stays or moves on to the next video."}, {"t": "On-screen text", "d": "The written phrase that appears in the video. Maximum 2 lines. It doesn't cover the important part of the job."}, {"t": "CTA", "d": "What we ask the person to do at the end: comment ESTIMATE, save, share, send a DM."}, {"t": "Keyword", "d": "ESTIMATE, in capital letters. The person comments it and we send them the free estimate link by DM. That way we know who is interested."}, {"t": "Job-site video", "d": "The 14 short videos of Picasso's jobs (pressure washing, painters on ladders, scaffolding, houses before and after). They are in the Fotos/11-2026 folder."}, {"t": "Cover", "d": "The still image you see on the profile before pressing play on the reel. It has the hook written in big letters."}, {"t": "Slide", "d": "Each one of the images in a carousel."}, {"t": "Sticker", "d": "The Instagram elements in stories: poll, question, quiz, link, countdown."}, {"t": "Before and after", "d": "Two photos of the same house from the same angle: how it was and how it turned out. Only with real Picasso photos."}, {"t": "AI label", "d": "The Instagram option “AI info” that is turned on when posting if an AI-generated image was used."}, {"t": "Validator", "d": "The person who reviews and approves what is marked in yellow before publishing. For now it is Nain; later Roxsi, Fer or Fran."}], "recetas": [{"t": "Recipe A · Job-site video + text", "pasos": ["The day's card says which video to use (exact file name) and which seconds to cut. The videos are in the Picasso Painting/Fotos/11-2026 folder.", "Open CapCut, vertical 9:16 format. Import the video and cut exactly the seconds the card says. If the card uses several videos, put them in the order it says.", "Remove the video's original sound (the job-site noise) unless the card says to keep the pressure washing sound.", "Place each on-screen text at the second the card says, copied exactly as is in English. White letters with a navy blue #142f42 outline, maximum 2 lines, in the center or at the top, without covering the house or the person working.", "Music: the one the card says, from the Instagram or CapCut library, kept low.", "If an address, the house number, a car plate or a client's face is visible, cover it with a blurred rectangle.", "Cover: the first frame with the hook written in big letters. Export at 1080×1920."]}, {"t": "Recipe B · Job-site photos + text", "pasos": ["The card has the list of photos (exact file name) and how many seconds each one lasts. They are in the Picasso Painting/Fotos/11-2026 folder.", "In CapCut, 9:16 format. Put the photos in the card's order with a slow zoom in (gentle zoom from 100% to 110%).", "Place the on-screen texts at the second the card says, in English, exactly as is. White letters with a navy blue #142f42 outline.", "For a before and after, use the transition the card says (straight cut or slide).", "Music: the one the card says. Cover addresses, house numbers and plates. Export at 1080×1920."]}, {"t": "Recipe C · Carousel or image in Canva", "pasos": ["Size 1080×1350 (vertical). Use the colors and the font from part 7.", "Photos: first the real job-site photos the card says. If the card asks for a created image (for example, an interior), create it in Canva with the exact description on the card.", "Copy the text of each slide exactly as it appears on the card (in English). Maximum 25 words per slide.", "Last slide: the final ask (Comment ESTIMATE) and the small horizontal logo at the bottom.", "Download as PNG and upload in the card's order."]}], "cuentas": {"PP": {"nombre": "Picasso Painting & Scaffolding", "titulo": "Picasso Painting content calendar: painting and scaffolding in the Bay Area", "intro": "Picasso Painting paints homes and businesses in the San Francisco Bay Area, inside and out, and sets up scaffolding for tall jobs. We don't talk about paint at the start: we talk about the house that peels in the rain, the patch that shows and the fact that the owner checks the job before leaving.", "promesa": "Your home, prepped right, protected while we work, and checked by the owner before we leave.", "ejemplos": [{"mal": "Professional exterior painting with premium primer and caulk.", "bien": "This paint peeled in two winters. Here's what was missing underneath."}, {"mal": "We offer interior painting services.", "bien": "Guests coming in two weeks and that wall still shows the patch?"}], "metas": [{"t": "December: interiors before the holidays", "p": "For people to think of a room that is ready before guests arrive, and to see how Picasso protects the house while painting."}, {"t": "January: small projects and planning the exterior", "p": "For them to see that a single wall or room is worth the call, and to start asking for an estimate for the spring exterior."}], "campanas": [{"f": "Dec 7–17", "n": "Winter Interior Refresh", "p": "Interiors before the holidays. Proposed offer: a short color consultation included with an eligible interior project [TO VALIDATE]. No discounts."}, {"f": "Dec 25 and Jan 1", "n": "Holidays", "p": "Greetings with something useful. No selling."}, {"f": "Jan 25–Feb 5", "n": "One-Room Refresh", "p": "One room with its wall repaired. Proposed offer: a fixed credit on a small interior project with patching [TO VALIDATE]. No discounts."}], "semanas": [{"n": 1, "f": "Dec 1–6", "t": "What the rain does to a house", "s": "“That peeling paint is not just ugly: it lets water in.”"}, {"n": 2, "f": "Dec 7–13", "t": "A room ready before guests arrive", "s": "“I still have time to fix that room.”"}, {"n": 3, "f": "Dec 14–20", "t": "Color in winter light and the protected house", "s": "“I didn't know the same color could look so different.”"}, {"n": 4, "f": "Dec 21–27", "t": "Holidays: the house, the team, thank you", "s": "“Behind every house there are people who took care of it.”"}, {"n": 5, "f": "Dec 28–Jan 3", "t": "The year in jobs and what to fix first in 2027", "s": "“This year I will fix that.”"}, {"n": 6, "f": "Jan 4–10", "t": "The patched wall that shows", "s": "“Why is that patch still showing?”"}, {"n": 7, "f": "Jan 11–17", "t": "How to choose a painter and read an estimate", "s": "“Now I know what to ask before hiring.”"}, {"n": 8, "f": "Jan 18–24", "t": "Small projects that are worth it", "s": "“It is worth calling for just one wall.”"}, {"n": 9, "f": "Jan 25–31", "t": "One-Room Refresh and planning the spring exterior", "s": "“I'll start with one room and get the exterior ready.”"}], "objeciones": [{"n": "Week 1", "d": "Painting costs too much", "c": "Compare what it costs to paint well once with what it costs to repaint when the paint peels early."}, {"n": "Week 2", "d": "I'll do it after the holidays or the rains", "c": "Interiors can be done in winter; waiting just leaves the problem as it is when the guests arrive."}, {"n": "Week 3", "d": "It's just one wall, not worth calling", "c": "Show that a small project also gets a free quote and the same care."}, {"n": "Week 4", "d": "Painters leave everything dirty or don't come back", "c": "Show the floor and plant protection, the daily cleanup and the owner's final check."}, {"n": "Week 5", "d": "I'll do it myself", "c": "Explain, without scaring anyone, what it costs in time and materials, and what happens if the prep is missing."}, {"n": "Week 6", "d": "Winter is not the time to paint", "c": "Interiors are; the exterior is planned now and painted in the dry season."}, {"n": "Week 7", "d": "My house is very tall or complicated", "c": "Show scaffolding on real jobs and that Picasso is licensed for scaffolding."}, {"n": "Week 8", "d": "How do I know the price is fair?", "c": "Explain what a written estimate should say: prep, repairs, coats of paint and what the warranty does not cover."}, {"n": "Week 9", "d": "The cheapest bid is the best", "c": "Compare what each quote includes, not just the final number."}], "palabras": [{"k": "ESTIMATE", "que": "The link to the free estimate form and the phone numbers. Nain will see the house in person.", "estado": "Ready. The final form link still needs to be confirmed [link to confirm]; in the meantime, send the phone numbers.", "pasos": ["Reply to the comment publicly: “Sent you a DM!”", "Send the DM with the message below.", "If they haven't replied after 2 days, write to them: “Hi! Just checking if you got the link. Happy to answer any question.”", "If they reply with questions, answer them with what the day's card says and leave the phone numbers again."], "dm": "Hi! Thanks for reaching out. Here's the link to request your free estimate: [link to confirm]. If you'd rather talk, call or text (650) 207-1772 or (415) 238-0797. Nain does every estimate himself."}], "marca": {"colores": [{"h": "#142f42", "u": "Navy blue: titles, text on light backgrounds and outlines for video text."}, {"h": "#1b628d", "u": "Blue: buttons, the word ESTIMATE and details."}, {"h": "#ae9168", "u": "Gold: thin lines and small accents."}, {"h": "#f8f7f2", "u": "Cream: slide background."}, {"h": "#eaf0ec", "u": "Light green: boxes and soft backgrounds."}], "estilo": ["Titles in Georgia or Playfair Display; text in Montserrat.", "Horizontal logo (img/logo-horizontal.png from the website) small, bottom center on the last slide.", "Only real photos of Picasso's jobs. For interiors, an image created in Canva until real photos are available. Never stock photos that look like they belong to another company.", "Lots of white space. Maximum 25 words per slide."]}}}, "posts": [{"fecha": "2026-12-01", "semana": 1, "formato": "Carrusel", "objetivo": "Saves", "tema": "Paint that peels with the rain", "tipo_gancho": "Diagnosis (What's wrong with this wall? series)", "gancho_texto": "Why your paint peels after the first big rain", "gancho_hablado": "What's wrong with this wall? Rain season edition", "visual": "Slide 1: photo “PHOTO HOUSE EXT 2026-11-16 5.JPG” (yellow house BEFORE) full bleed at 1080×1350. Navy band #142f42 on the bottom third with the title in Playfair Display in cream #f8f7f2, on two lines. Horizontal logo centered at the bottom, 180 px wide.", "desarrollo": ["Slide 1 (photo PHOTO HOUSE EXT 2026-11-16 5.JPG): Why your paint peels after the first big rain", "Slide 2 (photo PHOTO 2026-11-06.JPG): Water gets in behind the paint. Usually through a crack you can't see from the sidewalk.", "Slide 3 (photo PHOTO 2026-11-06 5.JPG): The wood under it soaks up that water and swells. The paint lets go.", "Slide 4 (photo PHOTO-2026-09-23-14-30-05.jpg): Painting right over it looks fine for a while. Then the new coat peels off with the old one.", "Slide 5 (photo PHOTO 2026-11-06 1.JPG): So the work starts before any paint. Loose paint comes off, small wood damage gets fixed, gaps get sealed.", "Slide 6 (photo PHOTO HOUSE PROGRESS EXT 2026-11-17 2.jpg): Then one base coat and two coats of paint. That's our standard on every house.", "Slide 7 (photo PHOTO HOUSE PROGRESS EXT 2026-11-17 10.jpg): Same house from slide 1, halfway through.", "Slide 8 (Canva, cream background): Save this. Next time it rains, walk around your house and look low, near windows and doors."], "cta": "Save this post and check your house after the next rain.", "caption": "Peeling paint after a rainy week means water found a way in somewhere.\nPainting over it looks fine for a while. Then it lifts again, usually in the same spot.\nSwipe to see what we fix before a single coat goes on.\nSave it for the next storm.", "calculadora": null, "produccion": null, "clip": null, "notas": "Week 1: educational only, no offer. Recurring series What's wrong with this wall? [TO VALIDATE: confirm that worn paint is visible in “PHOTO 2026-11-06.JPG” and “PHOTO 2026-11-06 5.JPG”; if it isn't visible, use “PHOTO-2026-09-23-14-30-04.jpg” on those slides]. Do not show the house number or street name in any photo.", "instrucciones": ["Open Canva, create a 1080×1350 design with 8 pages and upload the 7 photos from the Fotos/11-2026 folder using the exact name each slide gives.", "On slides 1 to 7, put the photo full bleed and a navy band #142f42, 380 px tall, at the bottom. The text of each slide goes in that band, in Montserrat 44 pt cream #f8f7f2; slide 1's text in Playfair Display 64 pt.", "Slide 8: cream background #f8f7f2, text in Montserrat 48 pt color #142f42, centered, and the horizontal logo at the bottom, 260 px wide.", "Check each photo: if a house number or a license plate shows, cover it with a rectangle the color of the wall using the crop tool or a solid box.", "Export as PNG and post on Tuesday, December 1 at 6:00 p.m. Pacific time with the caption as is.", "If someone comments that they have peeling paint, reply: 'Thanks for sharing. If you want, send us a photo by DM and we'll tell you what we see.' If they ask for an estimate in DM, send the form [link to the estimate form] and the phone numbers (650) 207-1772 and (415) 238-0797."], "historias": [{"proposito": "Common problem: people realizing whether their house has peeling paint", "formato": "Stock photo with poll", "contenido": "Photo: PHOTO HOUSE EXT 2026-11-16 5.JPG. Text: Is any paint peeling on your house right now?", "interaccion": "Poll sticker: 'Yes, a few spots' / 'Not that I know of'", "pasos": ["Open Ins  Bay Area' in Montserrat 28 pt gold #ae9168. Horizontal logo at the top left.", "desarrollo": ["Image text: Your home, prepped right, protected while we work, and checked by the owner before we leave.", "Small line: Picasso Painting & Scaffolding · Bay Area", "Caption: licensed (CSLB #1130045), insured, four-year labor warranty, free estimate"], "cta": "Comment ESTIMATE and we'll send you the free estimate form.", "caption": "That's the whole promise, and it's the same for a hallway or a three-story house.\nLicensed (CSLB #1130045), insured, BBB accredited, with a four-year warranty on our labor.\nPlanning a room before the holidays or the outside for spring? Comment ESTIMATE and we'll send the form.", "calculadora": null, "produccion": null, "clip": null, "notas": "Week 2, close of the Winter Interior Refresh week, without mentioning the offer in the image. Do not promise completion dates. Do not show the house number.", "instrucciones": ["In Canva, create a 1080×1350 design with “PHOTO COMPLETE HOUSE 2026-11-16.JPG” full bleed.", "At the bottom put a cream band #f8f7f2, 360 px, with the phrase in Playfair Display 54 pt #142f42, on three lines, and the small line in Montserrat 28 pt #ae9168.", "Put the horizontal logo at the top left at 220 px with a 40 px margin.", "Post on Sunday, December 13 at 5:00 p.m. Pacific time with the caption as is.", "To each ESTIMATE reply 'Sent! Check your DMs.' and send: 'Hi! Here's our free estimate form: [link to the estimate form]. Or call Nain at (650) 207-1772 or (415) 238-0797.'", "Log each request in the estimates spreadsheet with username, date and whether it's interior or exterior."], "historias": [{"proposito": "Invite people to ask for the free estimate", "formato": "Stock clip with link sticker", "contenido": "Clip: v14 VIDEO COMPLETE HOUSE 2026-11-16.mov (14 s). Text: Free estimate. Nain comes out himself.", "interaccion": "Link sticker: 'Book your estimate' → [enlace al formulario de estimado]", "pasos": ["Upload the fu  segundos 2-8", "20-27 s: “Floors, furniture and plants get covered too.” · Clip: VIDEO 2026-11-06 5.MP4 (v6), segundos 6-13", "27-33 s: “We clean up every day. You still get to live in your house.” · Clip: VIDEO 2026-11-16 1.mov (v13), segundos 0-6", "33-40 s: “And when the plastic comes off:” · Clip: VIDEO COMPLETE HOUSE 2026-11-16.mov (v14), segundos 0-7", "40-46 s: “Send this to someone getting their house painted.” · Clip: VIDEO COMPLETE HOUSE 2026-11-16.mov (v14), segundos 7-13, logo horizontal abajo"], "cta": "Send this to someone who's about to get their house painted.", "caption": "Most of a paint job happens before anyone opens a can.\nPlastic over the windows, tape on every edge, plants covered, and we clean up at the end of each day.\nIt's the slow part. It's also the part you'll be glad nobody rushed.\nKnow someone getting their place painted soon? Send this their way.", "calculadora": 16, "produccion": "Job-site video + text", "clip": null, "notas": "Week 3: protect the house while it's being painted. Shareable piece, no sales pitch. If a house number or a car license plate shows in any clip, blur it. Plan B if v13 doesn't load: use the photo PHOTO 2026-11-16 1.JPG for 6 s with a slow zoom.", "instrucciones": ["Download these files from “Picasso Painting/Fotos/11-2026/”: VIDEO 2026-11-06 5.MP4, VIDEO 2026-11-06 7.MP4, VIDEO 2026-11-06 4.MP4, VIDEO 2026-11-16 1.mov, VIDEO COMPLETE HOUSE 2026-11-16.mov, PHOTO 2026-11-06 1.JPG and PHOTO 2026-11-06 2.JPG. Also download img/logo-horizontal.png from the website.", "Open CapCut, create a vertical 9:16 project (1080×1920) and place the clips and photos in the order and with the exact seconds from the development field. Give the two photos a slow zoom from 100% to 110%.", "Add each text from the development at its second: Montserrat Bold, color #f8f7f2, background box #142f42 at 85% opacity, centered in the top third, maximum 2 lines. Hard cut between clips, no transitions.", "Music: calm acoustic instrumental, no lyrics, from the Instagram library, volume 40%. Remove the original audio from all clips.", "In the last 6 seconds, place the horizontal logo centered at the bottom, 40% of the screen width.", "Cover: frame from second 1 with the hook in Playfair Display Bold #f8f7f2 on a #142f42 band. Export in 1080p.", "Post on Monday, December 14 at 11:30 a.m. Pacific time with the exact caption. Reply to every comment within 4 hours; if someone asks about price or dates, answer: “Every house is different, so Nain gives a free estimate in person. Want the form? Comment ESTIMATE.”"], "historias": [{"proposito": "Connection: show how a house is protected before painting", "formato": "Short clip from the stock (≤15 s) with text", "contenido": "Text: “Monday on the job: wrapping everything before the paint comes out.”", "interaccion": "Emoji slider sticker 😌 with the question: “How satisfying is this part?”", "pasos": ["Trim VIDEO 2026-11-06 5.MP4 (v6) from second 0 to 12 and upload it as a story at 8:30 a.m. Pacific time.", "Write the exact text with Instagram's “Classic” font, white color, text background #142f42, at the top.", "Add the slider sticker with the 😌 emoji and the exact question, centered in the lower half.", "At the end of the day, note how many people used the slider in the week's metrics sheet."]}, {"proposito": "Connection: drive traffic to the day's Reel", "formato": "Repost of the day's Reel", "contenido": "Text: “The slow part nobody shows you. Watch till the plastic comes off.”", "interaccion": "Tap on the reel to watch it.", "pasos": ["At 12:30 p.m. Pacific time open the published Reel, tap the paper airplane and choose “Add to your story”.", "Enlarge the Reel to fill 70% of the screen and set the background color to #eaf0ec.", "Write the exact text at the top with the “Modern” font, color #142f42.", "Post, and at 6:00 p.m. check whether anyone replied to the story; answer each reply by DM."]}], "cuenta": "PP", "dia": "Monday"}, {"fecha": "2026-12-15", "semana": 3, "formato": "Carrusel", "objetivo": "Saves", "tema": "Color in winter light", "tipo_gancho": "A problem you can see at home", "gancho_texto": "The color looked great in July. Now it's gray.", "gancho_hablado": "Why your walls look different in December", "visual": "Slide 1 created in Canva 1080×1350: photo from the Canva library of a living room with a light beige wall, gray sofa and a window with cloudy afternoon light, no people. Bottom band color #f8f7f2 with the title in Playfair Display Bold #142f42 and the horizontal logo at the bottom. [TO VALIDATE: ask for a real interior photo]", "desarrollo": ["Slide 1: “The color looked great in July. Now it's gray.” · Imagen: sala de Canva descrita en visual [VALIDAR: pedir foto real de interior]", "Slide 2: “Winter light comes in lower and softer. Paint colors change with it.” · Imagen: la misma sala de Canva recortada a la ventana, filtro frío al 20 %", "Slide 3: “Tip 1: Put your sample on the darkest wall in the room. That's where it'll look worst.” · Diseño: fondo #eaf0ec, texto #142f42, ícono de brocha en #ae9168", "Slide 4: “Tip 2: Check it in the morning, late afternoon and at night with your lamps on.” · Diseño: fondo #f8f7f2, tres íconos de reloj en #1b628d", "Slide 5: “Tip 3: Go bigger than the chip. A sample the size of a poster tells you a lot more.” · Diseño: fondo #eaf0ec, rectángulo de 60 % del ancho en color #ae9168 como ejemplo de muestra", "Slide 6: “The 2027 colors of the year are both greens: Webster Green (Benjamin Moore) and Celery (Sherwin-Williams). Test them the same way.” · Diseño: dos rectángulos verdes con su nombre debajo en Montserrat [VALIDAR: tono exacto de cada color en las webs oficiales]", "Slide 7: “Painting a room this month or in January? Ask us about a short color consult with your interior project.” · Diseño: fondo #142f42, texto #f8f7f2 [VALIDAR: oferta propuesta Winter Interior Refresh, consulta de color incluida en proyecto interior elegible, aún no aprobada]", "Slide 8: “Save this for your next paint sample. Questions? Send us a DM.” · Diseño: fondo #f8f7f2, logo horizontal centrado, teléfonos (650) 207-1772 y (415) 238-0797"], "cta": "Save this before you buy your next paint sample.", "caption": "If a color you loved in summer now looks flat or gray, the paint didn't change. The light did.\nThree quick ways to test a sample before you commit are in the slides.\nSave it for the next time you're standing in the paint aisle.", "calculadora": null, "produccion": null, "clip": null, "notas": "Week 3: color in winter light. Winter Interior Refresh campaign (Dec 7-17): slide 7 mentions the proposed offer only if it is approved; if it is not approved, replace slide 7 with: “Painting a room this winter? We're happy to talk colors at your free estimate.” [TO VALIDATE: Winter Interior Refresh offer]. There are no interior photos: all living room images are from Canva until we have a real one. [TO VALIDATE: ask for a real interior photo]", "instrucciones": ["In Canva create a 1080×1350 design with 8 pages. Use background #f8f7f2 or #eaf0ec as the development says, titles in Playfair Display Bold #142f42 and text in Montserrat Regular #142f42.", "Slides 1 and 2: search the Canva photo library for “living room cloudy window beige wall” and pick a living room with no people or visible brands. Use the same photo on both slides.", "Copy the exact text of each slide from the development, without changing any words. Minimum text size: 44 pt for titles, 32 pt for the rest.", "On slide 6 draw two 400×400 px rectangles. Before coloring them, ask the validator for the official color codes of Webster Green and Celery; do not make up the shade.", "Place the horizontal logo (img/logo-horizontal.png) at the bottom center on slides 1 and 8, width 300 px.", "Export as PNG and post on Tuesday, December 15 at 9:00 a.m. Pacific time with the exact caption.", "If someone asks which color you recommend, answer: “Hard to say without seeing the room in person. Nain can look at it during a free estimate. Comment ESTIMATE if you'd like the form.”"], "historias": [{"proposito": "Common problem: noticing whether your paint looks different in winter", "formato": "Poll on a created design", "contenido": "Text: “Does any room in your house look grayer in winter?”", "interaccion": "Poll sticker: “Yes, one room” / “Not that I've noticed”", "pasos": ["In Canva create a 1080×1920 image with background #eaf0ec and the exact question in Playfair Display Bold #142f42, centered in the top half.", "Upload it as a story at 8:30 a.m. Pacific time.", "Add the poll sticker with the two exact options below the text.", "At 7:00 p.m. send a DM to those who voted “Yes, one room”: “Thanks for voting! Tip: check your paint sample on the darkest wall of that room first.”"]}, {"proposito": "Common problem: drive people to the carousel with the tips", "formato": "Repost of the day's carousel", "contenido": "Text: “3 ways to test a paint color in winter light”", "interaccion": "Tap on the post to see the tips.", "pasos": ["At 12:00 p.m. Pacific time share the published carousel to your story with the paper airplane.", "Set the background color to #142f42 and put the exact text at the top in the “Classic” font, color #f8f7f2.", "Place the carousel in the center, taking up 65% of the screen.", "Post, and answer any color question by DM with the answer from step 7 of the instructions."]}], "cuenta": "PP", "dia": "Tuesday"}, {"fecha": "2026-12-16", "semana": 3, "formato": "Reel", "objetivo": "Sales", "tema": "Doubt of the week: “it's just one wall”", "tipo_gancho": "The line the client says", "gancho_texto": "“It's just one wall.” That's how it starts.", "gancho_hablado": "One side of the house always takes the worst of the weather.", "visual": "Seconds 0-2: clip v10 “VIDEO POWER WASH EXT 2026-11-16.MP4” (seconds 0-2), power washing one side of the house. Hook in Montserrat Bold #f8f7f2 on a #142f42 box in the top third.", "desarrollo": ["0-3 s: ““It's just o anywhere the paint is peeling. Future you will thank you.”", "interaccion": "Emoji slider sticker 🥂: “Ready for 2027?”", "pasos": ["In Canva create a 1080×1920 design, background #142f42, exact text in Playfair Display Bold #f8f7f2 in the center, “to-do” in #ae9168.", "Place the horizontal logo at the bottom, width 300 px.", "Upload it at 9:00 a.m. Pacific time and add the slider with 🥂 and the exact question.", "Do not add links or the word ESTIMATE."]}, {"proposito": "Light end-of-year question box", "formato": "Question box on a stock photo", "contenido": "Text: “What do you want to fix around the house in 2027?”", "interaccion": "Question sticker: “My 2027 house goal is...”", "pasos": ["Upload PHOTO COMPLETE HOUSE 2026-11-16.JPG at 2:00 p.m. Pacific time.", "Write the exact text at the top in the “Classic” font, white on text background #142f42.", "Add the question sticker with the exact text in the center.", "Save the answers; on January 4 share 3 of them (without usernames) in stories with a short tip for each one."]}], "cuenta": "PP", "dia": "Thursday"}, {"fecha": "2027-01-01", "semana": 5, "formato": "Imagen", "objetivo": "Authority", "tema": "New Year: 2027 colors of the year", "tipo_gancho": "Seasonal news", "gancho_texto": "Happy 2027. Here are this year's colors.", "gancho_hablado": "Happy New Year from Picasso Painting & Scaffolding", "visual": "Image created in Canva 1080×1350: background #f8f7f2, two large rectangles side by side with the official shades of Webster Green and Celery, each with its name and brand below in Montserrat SemiBold #142f42. Headline at the top in Playfair Display Bold #142f42. Horizontal logo at the bottom.", "desarrollo": ["Titular: “Happy 2027. Here are this year's colors.”", "Muestra izquierda: “Webster Green · Benjamin Moore”", "Muestra derecha: “Celery · Sherwin-Williams”", "Línea inferior (Montserrat Regular #1b628d): “Two greens to start the year.”", "Pie: logo horizontal"], "cta": "Which one would you put on your front door?", "caption": "Happy New Year from Nain and the crew.\nThe 2027 colors of the year are both greens: Webster Green from Benjamin Moore and Celery from Sherwin-Williams.\nWhich one would you try on a front door?", "calculadora": null, "produccion": null, "clip": null, "notas": "Jan 1: greeting and one short useful tip, no sales pitch, no keyword. [TO VALIDATE: exact shade of each color taken from the official Benjamin Moore and Sherwin-Williams websites; do not make up the code]", "instrucciones": ["Ask the validator for the official color codes of Webster Green and Celery before designing. Do not use a green by eye.", "In Canva create a 1080×1350 design, background #f8f7f2. Exact headline at the top in Playfair Display Bold 54 pt #142f42.", "Draw two 460×620 px rectangles with 16 px corners, 40 px apart, centered. Fill them with the official codes.", "Below each rectangle write its exact name and brand in Montserrat SemiBold 28 pt #142f42; the bottom line in Montserrat Regular 26 pt #1b628d.", "Place the horizontal logo at the bottom, centered, width 300 px. Export as PNG.", "Post on Friday, January 1 at 10:00 a.m. Pacific time with the exact caption.", "Reply to each comment with the color the person chose and a “Happy New Year!”. Do not mention estimates today."], "historias": [{"proposito": "New Year good wishes", "formato": "Repost of the day's post", "contenido": "Text: “Happy New Year! 🎉”", "interaccion": "Poll sticker: “Webster Green” / “Celery”", "pasos": ["At 11:00 a.m. Pacific time share the day's post to your story.", "Background #142f42, post centered at 65%, exact text at the top in the “Classic” font #f8f7f2.", "Add the poll with the two exact options below the post.", "Do not add links or the word ESTIMATE."]}, {"proposito": "Connection with one short useful tip", "formato": "Stock photo with text", "contenido": "Text: “New Year tip: before you fall for a color, look at it next to your roof and your front door. Those don't change.”", "interaccion
