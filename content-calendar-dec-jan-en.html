ith paint letting go in a few spots. It got a full wash first, then the new blue gray started going on.\nIf you want your outside done when the dry months come around, winter is a good time to get the estimate.\nComment ESTIMATE and we'll send you the form.", "calculadora": 14, "produccion": "Job-site video + text", "clip": null, "notas": "Proof Saturday with real work in progress. January: start talking about the spring exterior without false urgency. “Day one” is only used if the washing was on the first day. [TO VALIDATE: confirm that the washing was on the first day of the job; if not, change “Day one:” to “First:”]. [TO VALIDATE: final photo of the yellow house if it is already finished, to close the Reel with the after]", "instrucciones": ["Download from “Picasso Painting/Fotos/11-2026/”: VIDEO HOUSE EXT 2026-11-16 .MP4 (the name has a space before .MP4), POWER WASHING HOUSE EXT 2026-11-16.MP4, VIDEO POWER WASHING 2026-11-16.MP4, PHOTO HOUSE PROGRESS EXT 2026-11-17 2.jpg, PHOTO HOUSE PROGRESS EXT 2026-11-17 10.jpg and PHOTO HOUSE EXT 2026-11-16 5.JPG. From the website: img/nain.jpg and img/logo-horizontal.png.", "In CapCut create a 9:16 project (1080×1920) and build the sequence with the exact seconds from the development. Slow zoom from 100% to 110% on the photos.", "Texts: Montserrat Bold #f8f7f2 on a #142f42 box at 85%, top third. Add the label “BEFORE” at the top left from 0 to 9 s and “IN PROGRESS” from 20 to 32 s, in Montserrat SemiBold 28 pt #ae9168.", "Music: upbeat acoustic instrumental, no lyrics, from the Instagram library, volume 40%. No original audio.", "Cover: frame from second 1 with the hook in Playfair Display Bold. Export in 1080p. Blur the house number if it appears.", "Post on Saturday, January 2 at 11:30 a.m. Pacific time with the exact caption.", "To each ESTIMATE reply “Sent you a DM!” and by DM: “Hi! Here's the free estimate form: [link to be confirmed]. You can also call (650) 207-1772 or (415) 238-0797. Nain does every estimate in person.”"], "historias": [{"proposito": "Proof: before and during of a real job", "formato": "Stock photo with text", "contenido": "Text: “Before” on the first photo, “In progress” on the second.", "interaccion": "Poll sticker: “Team yellow” / “Team blue gray”", "pasos": ["Upload PHOTO HOUSE EXT 2026-11-16 5.JPG at 8:30 a.m. Pacific time with “Before” at the top in the “Classic” font, white on text background #142f42.", "Right after, upload PHOTO HOUSE PROGRESS EXT 2026-11-17 10.jpg with “In progress” in the same style.", "On the second one add the poll with the exact options.", "Check that no house number or license plate shows."]}, {"proposito": "Proof: drive people to the Reel and to ask for an estimate", "formato": "Repost of the day's Reel", "contenido": "Text: “Planning your outside for spring? Comment ESTIMATE on the reel.”", "interaccion": "Tap on the reel to watch it.", "pasos": ["At 1:00 p.m. Pacific time share the Reel to your story.", "Background #eaf0ec, Reel centered at 70%, exact text at the top in the “Classic” font #142f42; ESTIMATE in #ae9168.", "Add a hand-drawn arrow in #1b628d pointing to the Reel.", "Check the Reel's comments at 6:00 p.m. and send the pending DMs."]}], "cuenta": "PP", "dia": "Saturday"}, {"fecha": "2027-01-03", "semana": 5, "formato": "Carrusel", "objetivo": "Sales", "tema": "Plan the spring exterior", "tipo_gancho": "Plan for the year", "gancho_texto": "Want the outside painted this year? Start here.", "gancho_hablado": "How to plan an exterior paint job for 2027", "visual": "Slide 1: PHOTO COMPLETE HOUSE 2026-11-16.JPG (finished gray house with flowers) full screen with the hook in Playfair Display Bold #f8f7f2 on a #142f42 top band.", "desarrollo": ["Slide 1: “Want the outside painted this year? Start here.” · Foto: PHOTO COMPLETE HOUSE 2026-11-16.JPG", "Slide 2: “In the Bay Area, outside painting goes best in the dry months, May to October.” · Foto: VIDEO 2026-11-06 1.MP4 (cuadro del segundo 4 exportado como imagen)", "Slide 3: “Step 1: Get a free estimate now. Nain comes out in person and walks the house with you.” · Foto: img/nain.jpg", "Slide 4: “Step 2: Read what's included. Prep, a base coat and two coats of paint, and protection for your plants.” · Foto: PHOTO 2026-11-06 1.JPG", "Slide 5: “Tall house? Scaffolding is quoted separately and includes delivery, setup, takedown and up to 30 days of use.” · Foto: PHOTO-2026-09-23-14-29-39.jpg", "Slide 6: “Step 3: Check the paperwork. Licensed (CSLB #1130045), insured, 4-year labor warranty.” · Diseño: fondo #142f42, texto #f8f7f2, checks en #ae9168", "Slide 7: “Comment ESTIMATE and we'll send you the free estimate form.” · Diseño: fondo #f8f7f2, teléfonos (650) 207-1772 y (415) 238-0797, logo horizontal abajo"], "cta": "Comment ESTIMATE and we'll DM you the free estimate form and our phone numbers.", "caption": "If the outside of your house is on your 2027 list, the dry months here run from May to October.\nThe easy part is now: get the estimate, read what's included, and check that whoever you hire is licensed and insured.\nComment ESTIMATE and we'll send you the form.", "calculadora": null, "produccion": null, "clip": null, "notas": "Sunday: invitation to ask for an estimate. January: start talking about the spring exterior, without false urgency (do not say dates are running out). Do not give job timelines or prices.", "instrucciones": ["Download from “Picasso Painting/Fotos/11-2026/”: PHOTO COMPLETE HOUSE 2026-11-16.JPG, VIDEO 2026-11-06 1.MP4, PHOTO 2026-11-06 1.JPG and PHOTO-2026-09-23-14-29-39.jpg. From the website: img/nain.jpg and img/logo-horizontal.png.", "Open VIDEO 2026-11-06 1.MP4, pause at second 4 and export that frame as a JPG image for slide 2. Plan B if the frame comes out blurry: use PHOTO-2026-09-23-14-29-50(1).jpg.", "In Canva create a 7-page 1080×1350 carousel. Slide 1: full-screen photo with a #142f42 top band 260 px tall and the hook in Playfair Display Bold 54 pt #f8f7f2.", "Slides 2 to 5: photo on top (900 px) and exact text below on #f8f7f2 in Montserrat Bold 32 pt #142f42; “Step 1”, “Step 2” in #1b628d.", "Slide 6: background #142f42, exact text in Montserrat Bold 36 pt #f8f7f2 with a #ae9168 check for each fact. Slide 7: background #f8f7f2, exact text in Playfair Display Bold 50 pt #142f42, phone numbers in Montserrat Regular 30 pt #1b628d and the horizontal logo at the bottom.", "Post on Sunday, January 3 at 9:00 a.m. Pacific time with the exact caption.", "To each ESTIMATE reply “Sent you a DM!” and by DM: “Hi! Here's the free estimate form: [link to be confirmed]. You can also call (650) 207-1772 or (415) 238-0797. Nain does every estimate in person.” If they ask about the scaffolding price, answer that it is quoted in the estimate."], "historias": [{"proposito": "Invitation to ask for an estimate for the exterior", "formato": "Image created with text", "contenido": "Text: “Outside paint on your 2027 list? The estimate is free. Nain comes out in person.”", "interaccion": "Link sticker: “Free estimate” [enlace del formulario a confirmar]", "pasos": ["In Canva create a 1080×1920 design, background #142f42, exact text in Playfair Display Bold #f8f7f2 in the center, “free” in #ae9168.", "Below write (650) 207-1772 and (415) 238-0797 in Montserrat Regular #f8f7f2.", "Upload it at 9:30 a.m. Pacific time with the link sticker with the exact text.", "If the link isn't ready, use the text “Reply ESTIMATE” and reply by DM."]}, {"proposito": "Invitation: drive people to the carousel with the plan", "formato": "Repost of the day's carousel", "contenido": "Text: “3 steps to plan your outside paint job”", "interaccion": "Poll sticker: “Planning it this year?” “Yes” / “Maybe”", "pasos": ["At 2:00 p.m. Pacific time share the carousel to your story.", "Background #eaf0ec, carousel centered at 65%, exact text at the top in the “Classic” font #142f42.", "Add the poll with the exact options below the carousel.", "On Monday the 4th send a DM to those who voted “Yes”: “Thanks! Reply ESTIMATE whenever you'd like the free estimate form.”"]}], "cuenta": "PP", "dia": "Sunday"}, {"fecha": "2027-01-04", "semana": 6, "formato": "Reel", "objetivo": "Viral", "tema": "Why the wall patch shows", "tipo_gancho": "Diagnostic question (What's wrong with this wall? series)", "gancho_texto": "You fixed the hole. Why can everyone still see it?", "gancho_hablado": "What's wrong with this wall?", "visual": "Seconds 0–2: image made in Canva of a white living room wall with window light from the side and a brighter square at light switch height. At the top, in a navy box #142f42, the text “You fixed the hole. Why can everyone still see it?”. [TO VALIDATE: ask for a real interior photo]", "desarrollo": ["0–4 s: \"What's wrong with this wall?\" (debajo: imagen de Canva 1 del paso 1, zoom lento de 100% a 110%)", "4–9 s: \"Someone patched the hole. You still see a square every time the sun comes in.\" (debajo: imagen de Canva 1, zoom hacia el cuadrado)", "9–15 s: \"The filler soaks up paint in a different way than the old wall. So that spot dries shinier or duller.\" (debajo: imagen de Canva 2 del paso 2)", "15–21 s: \"Paint only the patch and it gets worse. Now it's a box you can see from the couch.\" (debajo: imagen de Canva 2)", "21–28 s: \"Here's how we handle it. Sand the patch flat with the wall. Seal it so it takes paint like the rest.\" (debajo: v6 \"VIDEO 2026-11-06 5.MP4\", segundos 2–9)", "28–35 s: \"Then we paint the whole wall, corner to corner. One sealing coat, two coats of paint.\" (debajo: v2 \"VIDEO 2026-11-06 1.MP4\", segundos 5–12)", "35–41 s: \"Before the crew leaves, the owner checks the work himself.\" (debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 0–6)", "41–47 s: \"Know someone who patched a wall last weekend? Send them this.\" (debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 6–12, con el logo horizontal abajo)"], "cta": "Send this to someone who patched a wall last weekend.", "caption": "That square on the wall you notice every afternoon? It's not your imagination.\nFresh filler takes paint differently than the old wall, so painting just the patch leaves a box you can see.\nWe sand it flat, seal it, and paint the whole wall corner to corner.\nSend this to whoever did the patching at your place.", "calculadora": 16, "produccion": "Job-site photos + text", "clip": null, "notas": "Week 6, repaired wall. The two interior images are from Canva because there are no real interior photos. [TO VALIDATE: ask for a real interior photo]. If a real photo arrives of a patch that shows at a client's home, replace the Canva images with that photo (without showing anything that identifies the home).", "instrucciones": ["Canva image 1 (1080×1920): in Canva, Elements > Photos, search “white living room wall window light” and pick a smooth white wall with light coming in from the side. On top, place a 260×260 px rectangle, color #ffffff at 85% transparency, at light switch height, so it looks like a brighter patch. Download as PNG. [TO VALIDATE: ask for a real interior photo]", "Canva image 2 (1080×1920): duplicate image 1 and zoom in to 160% on the rectangle, so the edge of the patch is visible up close. Download as PNG.", "Open a new CapCut project in 9:16 (1080×1920) and place in this order: image 1 (0–9 s), image 2 (9–21 s), v6 “VIDEO 2026-11-06 5.MP4” seconds 2–9, v2 “VIDEO 2026-11-06 1.MP4” seconds 5–12, v14 “VIDEO COMPLETE HOUSE 2026-11-16.mov” seconds 0–12. Give the images a slow zoom animation from 100% to 110%.", "On-screen text: copy each text from the script at the exact second it indicates. Montserrat Bold font, 56 pt, white #ffffff, inside a navy box #142f42 at 85% opacity, centered in the top third. Hard cut between texts, no entrance animation.", "In seconds 41–47 place the horizontal logo (website file img/logo-horizontal.png) at the bottom center, 600 px wide.", "Music: calm acoustic instrumental, no lyrics, from the Instagram library, at 30% volume. No voice.", "Cover: the first frame (image 1) with the text “You fixed the hole. Why can everyone still see it?” in Georgia Bold, white, #142f42 box.", "Post on Monday, January 4 at 6:00 p.m. Pacific time with the caption from this sheet.", "Comments: if someone says they have a patch like that, reply “That happens a lot. If you want, send us a photo by DM and we'll tell you what it needs.” If they write ESTIMATE, DM the form [link to the estimate form, to be confirmed] and the phone numbers (650) 207-1772 and (415) 238-0797."], "historias": [{"proposito": "Closeness: show how a job day starts", "formato": "Stock clip with text", "contenido": "Clip v6 con el texto: \"Monday on the job. Plastic goes down before any paint can opens.\"", "interaccion": "Sticker de reacción con emoji 👍 y la pregunta \"Did you know we cover everything first?\"", "pasos": ["Open Instagram > Story and upload v6 “VIDEO 2026-11-06 5.MP4”, trimmed to seconds 0 to 12.", "Write the text “Monday on the job. Plastic goes down before any paint can opens.” in the Classic font, white, with a navy #142f42 background, top center.", "Add the emoji slider sticker with 👍 and write on it “Did you know we cover everything first?”.", "Post at 9:00 a.m. Pacific time."]}, {"proposito": "Closeness: let them meet Nain, the owner", "formato": "Stock photo with a real quote", "contenido": "Foto de Nain con las furgonetas y su frase: \"I still do the estimates myself.\" Debajo, en pequeño: \"Nain, owner of Picasso Painting & Scaffolding\".", "interaccion": "Sticker de pregunta: \"Ask Nain anything about your walls\"", "pasos": ["Upload the website photo img/nain.jpg to a new story.", "Write the quote “I still do the estimates myself.” in the Classic font, 40 pt, white, with a #142f42 background, in the bottom third.", "Below it, in the Modern font at 24 pt, write “Nain, owner of Picasso Painting & Scaffolding”.", "Add the questions sticker with the text “Ask Nain anything about your walls” at the top right.", "Post at 4:00 p.m. Pacific time and save the questions that come in for Thursday the 7th's story."]}], "cuenta": "PP", "dia": "Monday"}, {"fecha": "2027-01-05", "semana": 6, "formato": "Carrusel", "objetivo": "Saves", "tema": "Three reasons a patch shows", "tipo_gancho": "Problem you see every day", "gancho_texto": "Why that repaired spot on your wall still shows", "gancho_hablado": "Why that repaired spot on your wall still shows", "visual": "Slide 1: Canva image of a white hallway wall with a brighter rectangle near the baseboard and the title in Georgia Bold navy #142f42 on a cream #f8f7f2 strip. [TO VALIDATE: ask for a real interior photo]", "desarrollo": ["Slide 1: \"Why that repaired spot on your wall still shows\" (imagen de Canva: pared blanca de pasillo con parche más brillante)", "Slide 2: \"Reason 1: the patch is smoother or rougher than the wall around it. Light from a window catches the edge.\" (misma imagen de Canva con zoom al 160% sobre el borde del parche)", "Slide 3: \"Reason 2: the filler drinks paint differently. Same color on top, different shine.\" (fondo crema #f8f7f2 con un círculo dibujado en dorado #ae9168 alrededor del parche de la imagen recortada)", "Slide 4: \"Reason 3: only the patch got painted. Old paint fades a little, so fresh paint next to it won't match.\" (fondo verde claro #eaf0ec, texto solo)", "Slide 5: \"The fix: sand it level, seal the patch, then paint the full wall from corner to corner.\" (foto \"PHOTO 2026-11-06 1.JPG\" de preparación con plásticos, texto en caja #142f42)", "Slide 6: \"How we do it on every job: one sealing coat and two coats of paint. Your labeled touch-up paint stays with you.\" (foto \"PHOTO 2026-11-06 2.JPG\")", "Slide 7: \"Save this for the next time someone moves the TV.\" (fondo azul marino #142f42, texto crema, logo horizontal abajo)"], "cta": "Save this for the next time you patch a wall.", "caption": "Patching the hole is the easy part. Making it disappear is where most fixes fall short.\nThree reasons the spot still shows, and how we deal with it, are in the slides.\nSave it for the next time a shelf or a TV comes off the wall.", "calculadora": null, "produccion": null, "clip": null, "notas": "Week 6, repaired wall. Slides 1 to 3 use an image made in Canva because there are no interior photos. [TO VALIDATE: ask for a real interior photo]. Slides 5 and 6 are real exterior photos; the text talks about the method, which is the same.", "instrucciones": ["In Canva create a 1080×1350 design with 7 pages. Cream #f8f7f2 background except where the sheet says another color.", "Image for slides 1 and 2: in Canva, Elements > Photos, search “white hallway wall” and pick a smooth white wall with side light. On top, place a 220×160 px rectangle, color #ffffff at 85% transparency, near the baseboard, to simulate the bright patch. [TO VALIDATE: ask for a real interior photo]", "Titles in Georgia Bold 64 pt color #142f42; text for slides 2 to 6 in Montserrat Medium 40 pt color #142f42, left-aligned, with an 80 px margin.", "Slide 3: crop the image to the patch and draw a gold #ae9168 line circle, 8 px, around it. Slide 4: #eaf0ec background, text only.", "Slides 5 and 6: place the photos “PHOTO 2026-11-06 1.JPG” and “PHOTO 2026-11-06 2.JPG” full page and the text in a #142f42 box at 85% with cream #f8f7f2 lettering at the bottom.", "Slide 7: #142f42 background, cream #f8f7f2 text in Georgia Bold 64 pt centered and the horizontal logo (img/logo-horizontal.png) at the bottom, 500 px wide.", "Export as PNG and post on Tuesday, January 5 at 1:00 p.m. Pacific time with the caption from this sheet.", "Comments: if someone asks whether you can fix their wall, reply “We can take a look. Send us a photo by DM or comment ESTIMATE and we'll send you the free estimate form.”"], "historias": [{"proposito": "Common problem: people recognizing the patch in their own home", "formato": "Image made with poll", "contenido": "Texto: \"Is there a spot on your wall you notice every single day?\"", "interaccion": "Encuesta con dos opciones: \"Yes, every day\" / \"Not that I know of\"", "pasos": ["In Canva create a 1080×1920 image with a cream #f8f7f2 background and the text “Is there a spot on your wall you notice every single day?” in Georgia Bold 64 pt, color #142f42, in the top third.", "Upload it to an Instagram story.", "Add the poll sticker in the center with the options “Yes, every day” and “Not that I know of”.", "Post at 9:00 a.m. Pacific time.", "To anyone who votes “Yes, every day,” DM: “Thanks for voting! Today's post explains why that spot still shows.”"]}, {"proposito": "Drive people to the day's carousel", "formato": "Repost of the day's carousel", "contenido": "Repost del carrusel con el texto: \"Slide 5 is the fix.\"", "interaccion": "Sticker de enlace al post (toque en el post compartido)", "pasos": ["Open the published carousel, tap the paper airplane and choose “Add to your story”.", "At the top write “Slide 5 is the fix.” in the Modern font, white, with a #1b628d background.", "Enlarge the post until it takes up 70% of the screen.", "Post at 4:00 p.m. Pacific time."]}], "cuenta": "PP", "dia": "Tuesday"}, {"fecha": "2027-01-06", "semana": 6, "formato": "Reel", "objetivo": "Sales", "tema": "Doubt: winter is no good for painting", "tipo_gancho": "Wrong belief as a question", "gancho_texto": "Think you have to wait for summer to paint?", "gancho_hablado": "Think you have to wait for summer to paint?", "visual": "Seconds 0–2: v8, the blue house before painting, with plants and pumpkins in front. Text at the top in a #142f42 box: “Think you have to wait for summer to paint?”.", "desarrollo": ["0–3 s: \"Think you have to wait for summer to paint?\" (debajo: v8 \"VIDEO 2026-11-06 7.MP4\", segundos 0–3)", "3–9 s: \"The rooms inside your house don't care about the rain. Winter works for them.\" (debajo: imagen de Canva del paso 1)", "9–16 s: \"Outside is different. In the Bay Area, the dry season runs from May to October.\" (debajo: v1 \"POWER WASHING HOUSE EXT 2026-11-16.MP4\", segundos 2–9)", "16–23 s: \"So winter is a good time to plan the outside. The owner walks your house and writes the estimate.\" (debajo: v8 \"VIDEO 2026-11-06 7.MP4\", segundos 10–17)", "23–30 s: \"You pick colors without rushing. Wood that needs repair gets spotted and written down.\" (debajo: v8 \"VIDEO 2026-11-06 7.MP4\", segundos 20–27)", "30–37 s: \"When the dry months come, the plan is already done.\" (debajo: v2 \"VIDEO 2026-11-06 1.MP4\", segundos 0–7)", "37–43 s: \"Inside now and outside later. Or just the estimate for now. Your call.\" (debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 0–6)", "43–48 s: \"Comment ESTIMATE and we'll send you the free estimate form.\" (debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 6–11, con el logo horizontal abajo)"], "cta": "Comment ESTIMATE and we'll send you the free estimate form.", "caption": "A lot of people put painting off until summer. For the rooms inside, there's no reason to wait.\nFor the outside, winter is when you get the estimate and pick colors, so it's ready for the dry months.\nComment ESTIMATE and we'll send you the free estimate form.", "calculadora": 15, "produccion": "Job-site video + text", "clip": null, "notas": "Week 6 doubt. First soft nudge to request the exterior estimate for spring, with no deadlines or urgency. [TO VALIDATE: confirm that you paint interiors in any month of winter with no special conditions]. [TO VALIDATE: ask for a real interior photo] for seconds 3–9.", "instrucciones": ["Canva image (1080×1920): in Elements > Photos search “cozy living room winter window rain” and pick a living room with a rain-wet window and light walls. No text on top, the text is added in CapCut. Download as PNG. [TO VALIDATE: ask for a real interior photo]", "Open a new CapCut project in 9:16 and place in this order: v8 “VIDEO 2026-11-06 7.MP4” seconds 0–3, Canva image (6 s, slow zoom from 100% to 110%), v1 “POWER WASHING HOUSE EXT 2026-11-16.MP4” seconds 2–9, v8 seconds 10–17, v8 seconds 20–27, v2 “VIDEO 2026-11-06 1.MP4” seconds 0–7, v14 “VIDEO COMPLETE HOUSE 2026-11-16.mov” seconds 0–11.", "On-screen text: copy each text from the script at its second. Montserrat Bold 56 pt, white, #142f42 box at 85%, top third. The word ESTIMATE in the last text in gold #ae9168.", "Horizontal logo (img/logo-horizontal.png) at the bottom center in seconds 43–48.", "Music: calm acoustic instrumental, no lyrics, from the Instagram library, at 30%. No voice.", "Cover: frame at second 1 of v8 with the text “Think you have to wait for summer to paint?” in Georgia Bold white on a #142f42 box.", "Post on Wednesday, January 6 at 6:00 p.m. Pacific time with the caption from this sheet.", "To each person who comments ESTIMATE, reply in the comment “Sent! Check your DMs.” and by DM: “Thanks for reaching out! Here's our free estimate form: [link to the estimate form, to be confirmed]. You can also call (650) 207-1772 or (415) 238-0797. Nain, the owner, does the estimates himself.”"], "historias": [{"proposito": "Break the winter doubt with a real fact", "formato": "Image made with quiz", "contenido": "Texto: \"Quick one: when is the dry season for outside painting in the Bay Area?\"", "interaccion": "Quiz con tres opciones: \"December to February\" / \"May to October\" (correcta) / \"Only in March\"", "pasos": ["In Canva create a 1080×1920 image, light green #eaf0ec background, with the text “Quick one: when is the dry season for outside painting in the Bay Area?” in Georgia Bold 60 pt color #142f42, at the top.", "Upload it to a story and add the quiz sticker with “December to February”, “May to October” and “Only in March”. Mark “May to October” as correct.", "Post at 9:00 a.m. Pacific time.", "At 2:00 p.m. check who answered and DM anyone who got it wrong: “No worries! That's why winter is a good time to plan the outside.”"]}, {"proposito": "Lead to requesting the estimate with no pressure", "formato": "Stock photo with text and link sticker", "contenido": "Foto de la casa gris terminada con el texto: \"Winter: paint the inside, plan the outside.\"", "interaccion": "Sticker de enlace \"Free estimate\" [enlace al formulario de estimado a confirmar]", "pasos": ["Upload the photo “PHOTO COMPLETE HOUSE 2026-11-16.JPG” to a new story.", "Write “Winter: paint the inside, plan the outside.” in the Classic font, 40 pt, white, with a #142f42 background, in the top third.", "Add the link sticker with the text “Free estimate” and the link [link to the estimate form, to be confirmed]. If the link doesn't exist yet, use the @mention sticker for the account with the text “Link in bio”.", "Post at 4:00 p.m. Pacific time."]}], "cuenta": "PP", "dia": "Wednesday"}, {"fecha": "2027-01-07", "semana": 6, "formato": "Imagen", "objetivo": "Authority", "tema": "Repair before painting", "tipo_gancho": "Method statement", "gancho_texto": "New paint over bad wood still looks bad", "gancho_hablado": "We fix it before we paint it.", "visual": "Real photo “PHOTO-2026-09-23-14-30-05.jpg” (red house with ladder on the job) full page. At the bottom, a navy #142f42 strip with the phrase “We fix it before we paint it.” in Georgia Bold cream #f8f7f2 and the horizontal logo below.", "desarrollo": ["Image text: \"We fix it before we paint it.\"", "Small line under it: \"Licensed painters. Small wood repairs are part of the prep.\"", "Bottom: Picasso Painting & Scaffolding logo"], "cta": "Comment ESTIMATE if you have a spot like this at home.", "caption": "Paint can hide a soft board for a while. It doesn't fix it.\nWhen we prep a house, small wood damage gets repaired or replaced before any paint goes on. If the damage is bigger, we'll tell you and recommend a carpenter.\nGot a spot you've been painting over for years? Comment ESTIMATE.", "calculadora": null, "produccion": null, "clip": null, "notas": "Week 6, repair before painting. Exterior piece with a real photo.", "instrucciones": ["In Canva create a 1080×1350 design and place the photo “PHOTO-2026-09-23-14-30-05.jpg” full page.", "At the bottom add a 1080×380 px rectangle color #142f42 at 90% opacity.", "Inside write “We fix it before we paint it.” in Georgia Bold 64 pt color #f8f7f2, centered.", "Below write “Licensed painters. Small wood repairs are part of the prep.” in Montserrat Medium 30 pt color #ae9168.", "Place the horizontal logo (img/logo-horizontal.png) at the bottom of the strip, 420 px wide, centered.", "Export as PNG and post on Thursday, January 7 at 12:00 p.m. Pacific time with the caption from this sheet.", "To anyone who comments ESTIMATE reply “Sent! Check your DMs.” and DM the form [link to the estimate form, to be confirmed] and the phone numbers (650) 207-1772 and (415) 238-0797."], "historias": [{"proposito": "Collect real questions about walls and repairs", "formato": "Question box over a created image", "contenido": "Texto: \"Crack, hole, stain or soft wood? Ask us what it needs.\"", "interaccion": "Caja de preguntas: \"Ask about your walls\"", "pasos": ["In Canva create a 1080×1920 image with a #1b628d background and the text “Crack, hole, stain or soft wood? Ask us what it needs.” in Georgia Bold 60 pt, white, at the top.", "Upload it to a story and add the questions sticker with the text “Ask about your walls” in the center.", "Post at 9:00 a.m. Pacific time.", "At 3:30 p.m. pick the most repeated question (or one of those that came in on Monday the 4th) for story 2."]}, {"proposito": "Answer a question and show they know what they're talking about", "formato": "Question box answer with a created image", "contenido": "Respuesta a la pregunta elegida. Plan B si no llega ninguna: pregunta \"Will the patch show after you paint?\" y respuesta \"Not if the patch is sanded, sealed and the whole wall gets painted after. That's how we do it.\"", "interaccion": "Sticker de reacción con emoji 🙌", "pasos": ["Tap the chosen answer in the question box's response viewer and choose “Share answer”.", "Set the background color to #f8f7f2 and write the answer in the Modern font, 32 pt, color #142f42, below the question.", "If no question came in, create in Canva a 1080×1920 image with a #f8f7f2 background with the question “Will the patch show after you paint?” at the top in Georgia Bold and the answer “Not if the patch is sanded, sealed and the whole wall gets painted after. That's how we do it.” in Montserrat 36 pt.", "Add the emoji slider sticker with 🙌.", "Post at 4:00 p.m. Pacific time. If the answer needs a technical fact that isn't in this sheet, mark it as [TO VALIDATE] and do not publish it until it is reviewed."]}], "cuenta": "PP", "dia": "Thursday"}, {"fecha": "2027-01-08", "semana": 6, "formato": "Reel", "objetivo": "Sales", "tema": "The prep before the first coat", "tipo_gancho": "What you don't see (Before the first coat series)", "gancho_texto": "What happens before any paint touches your house", "gancho_hablado": "Before the first coat", "visual": "Seconds 0–2: v11, a worker power washing the garage door. Text at the top in a #142f42 box: “What happens before any paint touches your house”.", "desarrollo": ["0–3 s: \"What happens before any paint touches your house\" (debajo: v11 \"VIDEO POWER WASHING 2026-11-16.MP4\", segundos 0–3)", "3–9 s: \"Before the first coat, the walls get washed so the paint goes on a clean surface.\" (debajo: v10 \"VIDEO POWER WASH EXT 2026-11-16.MP4\", segundos 3–9)", "9–16 s: \"Plastic goes over plants, floors and anything that isn't getting paint.\" (debajo: v6 \"VIDEO 2026-11-06 5.MP4\", segundos 0–7)", "16–22 s: \"Windows get taped and covered.\" (debajo: v5 \"VIDEO 2026-11-06 4.MP4\", segundos 0–6)", "22–29 s: \"Small wood damage gets repaired or replaced. If it's bigger, we tell you to call a carpenter.\" (debajo: foto \"PHOTO-2026-09-23-14-30-05.jpg\", 7 s con zoom lento)", "29–35 s: \"Then one sealing coat and two coats of paint.\" (debajo: v7 \"VIDEO 2026-11-06 6.MP4\", segundos 4–10)", "35–41 s: \"We clean up every day. Labeled touch-up paint stays with you.\" (debajo: v12 \"VIDEO-2026-09-23-14-29-30.mp4\", segundos 0–6)", "41–46 s: \"And the owner checks it all before we leave.\" (debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 0–5)", "46–51 s: \"Comment ESTIMATE for the free estimate form.\" (debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 5–10, con el logo horizontal abajo)"], "cta": "Comment ESTIMATE for the free estimate form.", "caption": "Most of a good paint job happens before the paint can opens.\nWashing, covering, taping, fixing small wood damage. Then one sealing coat and two of paint, and Nain checks it before the crew leaves.\nComment ESTIMATE and we'll send you the free estimate form.", "calculadora": 15, "produccion": "Job-site video + text", "clip": null, "notas": "Week 6. Before the first coat series. Everything the reel says is in the client's confirmed facts.", "instrucciones": ["Open a new CapCut project in 9:16 and place in this order: v11 “VIDEO POWER WASHING 2026-11-16.MP4” seconds 0–3, v10 “VIDEO POWER WASH EXT 2026-11-16.MP4” seconds 3–9, v6 “VIDEO 2026-11-06 5.MP4” seconds 0–7, v5 “VIDEO 2026-11-06 4.MP4” seconds 0–6, photo “PHOTO-2026-09-23-14-30-05.jpg” 7 s with slow zoom from 100% to 110%, v7 “VIDEO 2026-11-06 6.MP4” seconds 4–10, v12 “VIDEO-2026-09-23-14-29-30.mp4” seconds 0–6, v14 “VIDEO COMPLETE HOUSE 2026-11-16.mov” seconds 0–10.", "Remove the original sound from all clips.", "On-screen text: copy each text from the script at its second. Montserrat Bold 56 pt, white, #142f42 box at 85%, top third. At second 3 add a small label at the top left that says “Before the first coat” in Georgia Italic 32 pt gold #ae9168, visible until second 41.", "Horizontal logo (img/logo-horizontal.png) at the bottom center in seconds 46–51.", "Music: medium-tempo acoustic instrumental, no lyrics, from the Instagram library, at 30%. No voice.", "Cover: frame at second 1 of v11 with the text “What happens before any paint touches your house” in Georgia Bold white on a #142f42 box.", "Post on Friday, January 8 at 6:00 p.m. Pacific time with the caption from this sheet.", "For each ESTIMATE in comments: reply “Sent! Check your DMs.” and DM “Thanks for reaching out! Here's our free estimate form: [link to the estimate form, to be confirmed]. You can also call (650) 207-1772 or (415) 238-0797.”"], "historias": [{"proposito": "Explain what happens when someone writes ESTIMATE", "formato": "Image made with text", "contenido": "Texto: \"Send us the word ESTIMATE. You'll get the free estimate form and our phone numbers by DM. Nain comes out and does the estimate himself.\"", "interaccion": "Sticker de mensaje directo con el texto \"Send ESTIMATE\"", "pasos": ["In Canva create a 1080×1920 image with a #142f42 background. At the top, “Send us the word ESTIMATE.” in Georgia Bold 64 pt color #f8f7f2, with ESTIMATE in gold #ae9168.", "Below write “You'll get the free estimate form and our phone numbers by DM. Nain comes out and does the estimate himself.” in Montserrat 36 pt color #f8f7f2.", "Upload it to a story and add the “Send message” sticker with the text “Send ESTIMATE”.", "Post at 9:00 a.m. Pacific time.", "Reply to every DM with ESTIMATE using the message from step 8 of the reel instructions."]}, {"proposito": "Show the result of good prep", "formato": "Stock clip with text", "contenido": "Clip v14 con el texto: \"Prepped right. Checked by the owner before we left.\"", "interaccion": "Sticker de enlace \"Free estimate\" [enlace al formulario de estimado a confirmar]", "pasos": ["Upload v14 “VIDEO COMPLETE HOUSE 2026-11-16.mov” in full (14 s) to a story.", "Write “Prepped right. Checked by the owner before we left.” in the Classic font, white, #142f42 background, at the top.", "Add the “Free estimate” link sticker with [link to the estimate form, to be confirmed]. If it doesn't exist yet, write “Comment ESTIMATE on today's reel” instead.", "Post at 4:00 p.m. Pacific time."]}], "cuenta": "PP", "dia": "Friday"}, {"fecha": "2027-01-09", "semana": 6, "formato": "Carrusel", "objetivo": "Sales", "tema": "Real case: blue house to gray", "tipo_gancho": "Before and after", "gancho_texto": "Same house. Before we touched it.", "gancho_hablado": "Same house. Before we touched it.", "visual": "Slide 1: real photo “PHOTO 2026-11-06.JPG” of the blue house before, full page, with the text in a #142f42 box at the top.", "desarrollo": ["Slide 1: \"Same house. Before we touched it.\" (foto \"PHOTO 2026-11-06.JPG\")", "Slide 2: \"Another angle of the before.\" (foto \"PHOTO 2026-11-06 5.JPG\")", "Slide 3: \"First, plastic goes over everything that isn't getting paint.\" (foto \"PHOTO 2026-11-06 1.JPG\")", "Slide 4: \"Windows and edges covered before the first coat.\" (foto \"PHOTO 2026-11-06 2.JPG\")", "Slide 5: \"After.\" (foto \"PHOTO COMPLETE HOUSE 2026-11-16.JPG\")", "Slide 6: \"Checked by the owner before the crew left.\" (foto \"PHOTO HOUSE EXT 2026-11-16.JPG\")", "Slide 7: \"Thinking about your outside for spring? Comment ESTIMATE. Planning now doesn't mean painting now.\" (fondo #142f42, foto \"PHOTO HOUSE EXT 2026-11-16 2.JPG\" pequeña arriba, logo abajo)"], "cta": "Comment ESTIMATE for the free estimate form.", "caption": "Blue before, gray after. Same house.\nSwipe through the middle slides: that's the part nobody posts, the covering and taping before the first coat.\nThinking about your outside for spring? Comment ESTIMATE and we'll send the free estimate form.", "calculadora": null, "produccion": null, "clip": null, "notas": "Real proof with our own photos. Do not show house number, car license plates or street name: if they appear, blur them. If the client gives permission for a quote of theirs, add it on slide 6 [real case to be confirmed]. Second soft nudge for the exterior estimate for spring.", "instrucciones": ["In Canva create a 1080×1350 design with 7 pages. Place each photo from the sheet full page on its slide.", "Check each photo: if the house number, a car license plate or the street name shows, cover it with Canva's Blur tool at 80%.", "On slides 1 to 6 put the text in a #142f42 box at 85% at the top, with Georgia Bold 56 pt color #f8f7f2. On slide 5 the text “After.” is in Georgia Bold 90 pt.", "Slide 7: #142f42 background, the photo “PHOTO HOUSE EXT 2026-11-16 2.JPG” in a 900×500 px frame at the top, the text in Montserrat Bold 44 pt color #f8f7f2 with ESTIMATE in gold #ae9168, and the horizontal logo at the bottom at 500 px wide.", "Export as PNG and post on Saturday, January 9 at 1:00 p.m. Pacific time with the caption from this sheet.", "To anyone who comments ESTIMATE reply “Sent! Check your DMs.” and DM the form [link to the estimate form, to be confirmed] and the phone numbers (650) 207-1772 and (415) 238-0797.", "If someone asks how much it cost or how long it took, reply “Every house is different, so Nain gives you the number after seeing yours. The estimate is free.” Do not give figures."], "historias": [{"proposito": "Proof: the before and after on a single screen", "formato": "Split before/after image with slider", "contenido": "Arriba la casa azul antes con la etiqueta \"Before\", abajo la casa gris terminada con la etiqueta \"After\".", "interaccion": "Deslizador con emoji 😍 y el texto \"How much do you like the after?\"", "pasos": ["In Canva create a 1080×1920 image split into two halves: at the top “PHOTO 2026-11-06.JPG”, at the bottom “PHOTO COMPLETE HOUSE 2026-11-16.JPG”.", "Place the label “Before” in the top left corner of the top photo and “After” on the bottom one, Montserrat Bold 40 pt white with a #142f42 background.", "Upload it to a story and add the emoji slider with 😍 and the text “How much do you like the after?” right on the line that divides the photos.", "Post at 9:00 a.m. Pacific time."]}, {"proposito": "Proof in motion: the finished house", "formato": "Stock clip with text", "contenido": "Clip v14 con el texto: \"Finished. And the flowers made it.\"", "interaccion": "Encuesta: \"Would you go gray too?\" / \"Yes\" / \"I'd keep the blue\"", "pasos": ["Upload v14 “VIDEO COMPLETE HOUSE 2026-11-16.mov” in full (14 s) to a story.", "Write “Finished. And the flowers made it.” in the Classic font, white, #142f42 background, at the top.", "Add the poll sticker with the question “Would you go gray too?” and the options “Yes” and “I'd keep the blue”.", "Post at 4:00 p.m. Pacific time."]}], "cuenta": "PP", "dia": "Saturday"}, {"fecha": "2027-01-10", "semana": 6, "formato": "Imagen", "objetivo": "Authority", "tema": "The owner does the estimate", "tipo_gancho": "Real quote from the owner", "gancho_texto": "The owner comes to your house for the estimate", "gancho_hablado": "\"I still do the estimates myself.\"", "visual": "Real photo of Nain with the vans (img/nain.jpg) full page. At the bottom, a #142f42 strip with the quote “I still do the estimates myself.” in Georgia Italic cream and “Nain Carvallo, owner” below.", "desarrollo": ["Image text: \"I still do the estimates myself.\"", "Line under it: \"Nain Carvallo, owner, Picasso Painting & Scaffolding\"", "Bottom: \"Free estimates. Link in bio.\" and the logo"], "cta": "Comment ESTIMATE or call (650) 207-1772 for a free estimate.", "caption": "When you ask us for an estimate, Nain comes out. He's been painting for about twenty years and still walks every house himself.\nInside work this winter, or the outside for spring, the estimate is free.\nComment ESTIMATE, or call (650) 207-1772 or (415) 238-0797.", "calculadora": null, "produccion": null, "clip": null, "notas": "Real quote from Nain from the meeting, translated. Use “link in bio” because the new website isn't published [link to be confirmed].", "instrucciones": ["In Canva create a 1080×1350 design with the photo img/nain.jpg full page.", "At the bottom add a 1080×420 px rectangle color #142f42 at 90%.", "Inside write “I still do the estimates myself.” in Georgia Italic 60 pt color #f8f7f2, centered, with quotation marks.", "Below “Nain Carvallo, owner, Picasso Painting & Scaffolding” in Montserrat Medium 28 pt color #ae9168.", "At the very bottom “Free estimates. Link in bio.” in Montserrat Bold 26 pt color #f8f7f2 and on the right the horizontal logo at 300 px wide.", "Export as PNG and post on Sunday, January 10 at 12:00 p.m. Pacific time with the caption from this sheet.", "To anyone who comments ESTIMATE reply “Sent! Check your DMs.” and DM the form [link to the estimate form, to be confirmed] and the phone numbers (650) 207-1772 and (415) 238-0797."], "historias": [{"proposito": "Invite them to request the estimate with contact details at hand", "formato": "Image made with phone numbers and link sticker", "contenido": "Texto: \"Free estimate, done by the owner. Call (650) 207-1772 or (415) 238-0797.\"", "interaccion": "Sticker de enlace \"Get a free estimate\" [enlace al formulario de estimado a confirmar]", "pasos": ["In Canva create a 1080×1920 image with a #f8f7f2 background, the horizontal logo at the top at 700 px and the text “Free estimate, done by the owner.” in Georgia Bold 64 pt color #142f42.", "Below write “Call (650) 207-1772 or (415) 238-0797.” in Montserrat Bold 40 pt color #1b628d.", "Upload it to a story and add the “Get a free estimate” link sticker with [link to the estimate form, to be confirmed]. If it doesn't exist yet, write “Link in bio” below the phone numbers.", "Post at 9:00 a.m. Pacific time."]}, {"proposito": "Open the conversation about the exterior for spring, with no pressure", "formato": "Stock photo with poll", "contenido": "Foto de la casa blanca con escalera y el texto: \"This year, what comes first at your place?\"", "interaccion": "Encuesta: \"Inside\" / \"Outside\"", "pasos": ["Upload the photo “PHOTO 2026-11-16 1.JPG” to a story.", "Write “This year, what comes first at your place?” in the Classic font, white, #142f42 background, at the top.", "Add the poll sticker with “Inside” and “Outside”.", "Post at 4:00 p.m. Pacific time.", "The next day, DM anyone who voted “Outside”: “Thanks for voting! If you'd like, we can do the estimate this winter so the plan is ready for the dry months. Just reply ESTIMATE.”"]}], "cuenta": "PP", "dia": "Sunday"}, {"fecha": "2027-01-11", "semana": 7, "formato": "Reel", "objetivo": "Followers", "tema": "What to check before hiring a painter", "tipo_gancho": "Warning before a decision", "gancho_texto": "Before a painter steps inside your house, check this", "gancho_hablado": "Before a painter steps inside your house, check this", "visual": "Seconds 0–2: v13, white two-story house with a ladder and the van in front. Text at the top in a #142f42 box: “Before a painter steps inside your house, check this”.", "desarrollo": ["0–3 s: \"Before a painter steps inside your house, check this\" (debajo: v13 \"VIDEO 2026-11-16 1.mov\", segundos 0–3)", "3–10 s: \"One: the license. In California you can look up any contractor's license number on the state board's website.\" (debajo: v13 \"VIDEO 2026-11-16 1.mov\", segundos 4–11)", "10–16 s: \"Ours is CSLB #1130045, for painting and for scaffolding.\" (debajo: foto img/nain.jpg, 6 s con zoom lento)", "16–23 s: \"Two: insurance. Ask before anyone climbs a ladder at your house.\" (debajo: v3 \"VIDEO 2026-11-06 2.MP4\", segundos 0–7)", "23–30 s: \"Three: the guarantee, in writing. What it covers and what it doesn't.\" (debajo: v2 \"VIDEO 2026-11-06 1.MP4\", segundos 10–17)", "30–37 s: \"Ours covers our work for 4 years if paint peels or bubbles because of how we did it.\" (debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 0–7)", "37–44 s: \"This week we're going through what a clear painting estimate should say, line by line.\" (debajo: v4 \"VIDEO 2026-11-06 3.MP4\", segundos 0–7)", "44–49 s: \"Follow along so you have it when the quotes start coming in.\" (debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 7–12, con el logo horizontal abajo)"], "cta": "Follow along: this week we go through what a painting estimate should say, line by line.", "caption": "Three things to check before you hire anyone to paint your house: license, insurance and a written guarantee.\nOurs: CSLB #1130045, insured, and 4 years on our work.\nAll week we're breaking down what a clear estimate should say. Follow along if quotes are on your list this year.", "calculadora": 14, "produccion": "Job-site video + text", "clip": null, "notas": "Week 7. The reason to keep watching is concrete: the week's series on how to read an estimate. The guarantee is described as confirmed; what it does not cover goes in the estimate.", "instrucciones": ["Open a new CapCut project in 9:16 and place in this order: v13 “VIDEO 2026-11-16 1.mov” seconds 0–3 and 4–11, photo img/nain.jpg 6 s with slow zoom from 100% to 110%, v3 “VIDEO 2026-11-06 2.MP4” seconds 0–7, v2 “VIDEO 2026-11-06 1.MP4” seconds 10–17, v14 “VIDEO COMPLETE HOUSE 2026-11-16.mov” seconds 0–7, v4 “VIDEO 2026-11-06 3.MP4” seconds 0–7, v14 seconds 7–12.", "Remove the original sound from all clips.", "On-screen text: copy each text from the script at its second. Montserrat Bold 56 pt, white, #142f42 box at 85%, top third. The words “One”, “Two” and “Three” are in gold #ae9168.", "Horizontal logo (img/logo-horizontal.png) at the bottom center in seconds 44–49.", "Music: calm acoustic instrumental, no lyrics, from the Instagram library, at 30%. No voice.", "Cover: frame at second 1 of v13 with the text “Before a painter steps inside your house, check this” in Georgia Bold white on a #142f42 box.", "Post on Monday, January 11 at 6:00 p.m. Pacific time with the caption from this sheet.", "Comments: if they ask where to look up the license, reply “On the Contractors State License Board website (cslb.ca.gov). Type in the license number and it shows if it's active.” If they write ESTIMATE, DM the form [link to the estimate form, to be confirmed] and the phone numbers."], "historias": [{"proposito": "Closeness: a glimpse of the day's work", "formato": "Stock clip with text", "contenido": "Clip v4 con el texto: \"Monday. Tall ladder, steady hands.\"", "interaccion": "Sticker de reacción con emoji 🪜", "pasos": ["Upload v4 “VIDEO 2026-11-06 3.MP4” in full (7 s) to a story.", "Write “Monday. Tall ladder, steady hands.” in the Classic font, white, #142f42 background, at the top.", "Add the emoji slider sticker with 🪜.", "Post at 9:00 a.m. Pacific time."]}, {"proposito": "Closeness with a useful fact: where to look up our license", "formato": "Image made with poll", "contenido": "Texto: \"Our license: CSLB #1130045. Look it up anytime.\" Pregunta: \"Have you ever checked a contractor's license before hiring?\"", "interaccion": "Encuesta: \"Yes\" / \"Not yet\"", "pasos": ["In Canva create a 1080×1920 image with a #eaf0ec background and the text “Our license: CSLB #1130045. Look it up anytime.” in Georgia Bold 60 pt color #142f42, at the top. Horizontal logo at the bottom at 600 px.", "Upload it to a story and add the poll “Have you ever checked a contractor's license before hiring?” with “Yes” and “Not yet”.", "Post at 4:00 p.m. Pacific time.", "To anyone who votes “Not yet,” DM: “It takes a minute: go to cslb.ca.gov and type in the license number. Happy to help if you have questions.”"]}], "cuenta": "PP", "dia": "Monday"}, {"fecha": "2027-01-12", "semana": 7, "formato": "Carrusel", "objetivo": "Saves", "tema": "How to read a painting estimate", "tipo_gancho": "A comparison that worries people", "gancho_texto": "Two painting quotes can look alike and cover different work", "gancho_hablado": "Two quotes can look alike and cover different work", "visual": "Slide 1: cream #f8f7f2 background with two drawn sheets side by side (white rectangles with gray lines) and the title in Georgia Bold #142f42 at the top.", "desarrollo": ["Slide 1: \"Two quotes can look alike and cover different work\" (diseño: dos hojas dibujadas lado a lado sobre fondo crema)", "Slide 2: \"Is the license number on it? Look it up on the state board's website.\" (foto \"PHOTO 2026-11-16 1.JPG\")", "Slide 3: \"Does it say what prep is included? Washing, repairs, covering floors and plants.\" (foto \"PHOTO 2026-11-06 1.JPG\")", "Slide 4: \"Does it say how many coats? Ours: one sealing coat and two coats of paint.\" (foto \"PHOTO HOUSE PROGRESS EXT 2026-11-17 2.jpg\")", "Slide 5: \"Is the guarantee in writing, and does it say what isn't covered?\" (fondo #142f42, texto crema)", "Slide 6: \"If you need scaffolding, is it its own line? Then you know what you're paying for.\" (foto \"PHOTO-2026-09-23-14-29-39.jpg\")", "Slide 7: \"Who cleans up, and when? We clean every day.\" (foto \"PHOTO COMPLETE HOUSE 2026-11-16.JPG\")", "Slide 8: \"Save this and keep it next to the quotes you get.\" (fondo #142f42, logo abajo)"], "cta": "Save this and keep it next to the quotes you get.", "caption": "The cheapest-looking quote might be missing half the prep. Or the guarantee. Or the scaffolding.\nHere's what to look for, line by line, before you sign anything.\nSave it for when the quotes come in.", "calculadora": null, "produccion": null, "clip": null, "notas": "Week 7, reading an estimate. No named company is compared. No prices are given.", "instrucciones": ["In Canva create a 1080×1350 design with 8 pages.", "Slide 1: #f8f7f2 background. Draw two 380×500 px white rectangles side by side, with a 3 px #dbe2de border and six horizontal gray lines inside each. Title at the top in Georgia Bold 64 pt color #142f42.", "Slides 2, 3, 4, 6 and 7: photo from the sheet full page and the text in a #142f42 box at 85% at the bottom, Montserrat Bold 44 pt color #f8f7f2. Each slide's question is in white and the answer (“Ours: …”, “We clean every day.”) in gold #ae9168.", "Slide 5: #142f42 background, text in Georgia Bold 60 pt color #f8f7f2, centered.", "Slide 8: #142f42 background, text in Georgia Bold 64 pt color #f8f7f2 and horizontal logo at the bottom at 500 px.", "Check that no photo shows the house number or license plates; if they show, blur them at 80%.", "Export as PNG and post on Tuesday, January 12 at 1:00 p.m. Pacific time with the caption from this sheet.", "Comments: if someone asks you to review another company's estimate, reply “We can't review other companies' quotes, but we're happy to give you ours to compare. Comment ESTIMATE.”"], "historias": [{"proposito": "Common problem: estimates that don't say what's included", "formato": "Image made with poll", "contenido": "Texto: \"Ever gotten a quote that didn't say what was included?\"", "interaccion": "Encuesta: \"Yes, more than once\" / \"No\"", "pasos": ["In Canva create a 1080×1920 image with a #f8f7f2 background and the text “Ever gotten a quote that didn't say what was included?” in Georgia Bold 64 pt color #142f42, at the top.", "Upload it to a story and add the poll with “Yes, more than once” and “No”.", "Post at 9:00 a.m. Pacific time.", "To anyone who votes “Yes, more than once,” DM: “That's frustrating. Today's post has what to look for in a quote.”"]}, {"proposito": "Lead them to save the day's carousel", "formato": "Repost of the day's carousel", "contenido": "Repost del carrusel con el texto: \"Keep this next to your quotes.\"", "interaccion": "Toque en el post compartido para abrirlo", "pasos": ["Open the published carousel, tap the paper airplane and choose “Add to your story”.", "At the top write “Keep this next to your quotes.” in the Modern font, white, with a #1b628d background.", "Enlarge the post until it takes up 70% of the screen.", "Post at 4:00 p.m. Pacific time."]}], "cuenta": "PP", "dia": "Tuesday"}, {"fecha": "2027-01-13", "semana": 7, "formato": "Reel", "objetivo": "Viral", "tema": "Doubt: my house is too tall or complicated", "tipo_gancho": "Wrong belief as a question", "gancho_texto": "Think your house is too tall to paint?", "gancho_hablado": "Think your house is too tall to paint?", "visual": "Seconds 0–2: photo “PHOTO-2026-09-23-14-29-39.jpg” of the 3-story house with ladders and scaffolding, with a bottom-to-top movement. Text at the top in a #142f42 box: “Think your house is too tall to paint?”.", "desarrollo": ["0–3 s: \"Think your house is too tall to paint?\" (debajo: foto \"PHOTO-2026-09-23-14-29-39.jpg\", 3 s, movimiento de abajo hacia arriba)", "3–9 s: \"Three stories up, a ladder only gets you so far.\" (debajo: v4 \"VIDEO 2026-11-06 3.MP4\", segundos 0–6)", "9–16 s: \"So we bring our own scaffolding. We're licensed to put it up, too.\" (debajo: foto \"PHOTO-2026-09-23-14-29-50(1).jpg\", 7 s con zoom lento)", "16–23 s: \"Narrow side yard? It fits there.\" (debajo: v12 \"VIDEO-2026-09-23-14-29-30.mp4\", segundos 0–7)", "23–30 s: \"It's quoted apart from the paint, so you see both numbers.\" (debajo: foto \"PHOTO-2026-09-23-14-29-29.jpg\", 7 s con zoom lento)", "30–37 s: \"That price covers delivery, setup, takedown and up to 30 days of use.\" (debajo: foto \"PHOTO-2026-09-23-14-29-30(1).jpg\", 7 s con zoom lento)", "37–43 s: \"Tall house, tight side yard. A normal week for us.\" (debajo: v2 \"VIDEO 2026-11-06 1.MP4\", segundos 0–6)", "43–48 s: \"Tag the friend with the tallest house on the street.\" (debajo: v3 \"VIDEO 2026-11-06 2.MP4\", segundos 5–10, con el logo horizontal abajo)"], "cta": "Tag the friend with the tallest house on the street.", "caption": "Three stories and a tight side yard. People assume that's a job nobody wants.\nWe own our scaffolding, we're licensed to set it up, and it's quoted apart from the paint so nothing is hidden.\nTag the friend with the tallest house on your street.", "calculadora": 16, "produccion": "Job-site video + text", "clip": null, "notas": "Week 7 doubt. The scaffolding conditions (transport, setup, takedown and up to 30 days at the same price) are confirmed. Do not mention scaffolding rental unless asked: it is only done on request.", "instrucciones": ["Open a new CapCut project in 9:16 and place in this order: photo “PHOTO-2026-09-23-14-29-39.jpg” 3 s with a bottom-to-top movement animation, v4 “VIDEO 2026-11-06 3.MP4” seconds 0–6, photo “PHOTO-2026-09-23-14-29-50(1).jpg” 7 s, v12 “VIDEO-2026-09-23-14-29-30.mp4” seconds 0–7, photo “PHOTO-2026-09-23-14-29-29.jpg” 7 s, photo “PHOTO-2026-09-23-14-29-30(1).jpg” 7 s, v2 “VIDEO 2026-11-06 1.MP4” seconds 0–6, v3 “VIDEO 2026-11-06 2.MP4” seconds 5–10.", "Give the photos a slow zoom from 100% to 110%. Remove the original sound from the videos.", "On-screen text: copy each text from the script at its second. Montserrat Bold 56 pt, white, #142f42 box at 85%, top third.", "Horizontal logo (img/logo-horizontal.png) at the bottom center in seconds 43–48.", "Music: instrumental with light percussion and medium tempo, no lyrics, from the Instagram library, at 30%. No voice.", "Cover: the photo “PHOTO-2026-09-23-14-29-39.jpg” with the text “Think your house is too tall to paint?” in Georgia Bold white on a #142f42 box.", "Post on Wednesday, January 13 at 6:00 p.m. Pacific time with the caption from this sheet.", "Comments: if they ask how much the scaffolding costs, reply “It depends on the house, so it's quoted after Nain sees it. The estimate is free: comment ESTIMATE.” If they ask whether you rent out scaffolding, reply “Only on request. Send us a DM with what you need.”"], "historias": [{"proposito": "Break the tall-house doubt with a quiz", "formato": "Stock photo with quiz", "contenido": "Foto del andamio en el pasillo con la pregunta: \"On our jobs, who sets up the scaffolding?\"", "interaccion": "Quiz: \"A rental company\" / \"Our own crew\" (correcta)", "pasos": ["Upload the photo “PHOTO-2026-09-23-14-29-29.jpg” to a story.", "Write “On our jobs, who sets up the scaffolding?” in the Classic font, white, #142f42 background, at the top.", "Add the quiz sticker with “A rental company” and “Our own crew”. Mark “Our own crew” as correct.", "Post at 9:00 a.m. Pacific time."]}, {"proposito": "Collect questions about difficult houses", "formato": "Stock clip with question box", "contenido": "Clip v12 con el texto: \"What makes your house tricky to paint?\"", "interaccion": "Caja de preguntas: \"Tell us about your house\"", "pasos": ["Upload v12 “VIDEO-2026-09-23-14-29-30.mp4” in full (9 s) to a story.", "Write “What makes your house tricky to paint?” in the Classic font, white, #142f42 background, at the top.", "Add the question box with the text “Tell us about your house”.", "Post at 4:00 p.m. Pacific time.", "Save the answers for Thursday the 14th's story 2."]}], "cuenta": "PP", "dia": "Wednesday"}, {"fecha": "2027-01-14", "semana": 7, "formato": "Imagen", "objetivo": "Authority", "tema": "Written guarantee", "tipo_gancho": "Question the client should ask", "gancho_texto": "Ask any painter: what happens if it peels?", "gancho_hablado": "4 years on our work. In writing.", "visual": "Real photo “PHOTO HOUSE EXT 2026-11-16 2.JPG” (finished gray house) full page. At the top, a #142f42 box with “Ask any painter: what happens if it peels?”. At the bottom, a #142f42 strip with “4 years on our work. In writing.” in Georgia Bold cream.", "desarrollo": ["Top text: \"Ask any painter: what happens if it peels?\"", "Main text: \"4 years on our work. In writing.\"", "Small line: \"If paint peels or bubbles because of our work, we come back.\"", "Bottom: logo"], "cta": "Comment ESTIMATE and we'll send the free estimate form.", "caption": "If paint peels or bubbles because of how we did the job, we come back and fix it. That's our 4-year workmanship guarantee.\nWhat it doesn't cover is written in your estimate, so there are no surprises later.\nComment ESTIMATE and we'll send you the free estimate form.", "calculadora": null, "produccion": null, "clip": null, "notas": "Week 7, reading an estimate. “We come back and fix it” describes the confirmed guarantee (paint that lifts or bubbles because of our work). [TO VALIDATE: confirm that the guarantee is given in writing with every estimate or contract].", "instrucciones": ["In Canva create a 1080×1350 design with the photo “PHOTO HOUSE EXT 2026-11-16 2.JPG” full page. If the house number shows, blur it at 80%.", "At the top place a #142f42 box at 85%, 1080×200 px, with “Ask any painter: what happens if it peels?” in Montserrat Bold 40 pt color #f8f7f2.", "At the bottom place a #142f42 strip at 90%, 1080×400 px, with “4 years on our work. In writing.” in Georgia Bold 64 pt color #f8f7f2.", "Below, “If paint peels or bubbles because of our work, we come back.” in Montserrat Medium 28 pt color #ae9168.", "Horizontal logo at the bottom of the strip, 400 px wide, centered.", "Export as PNG and post on Thursday, January 14 at 12:00 p.m. Pacific time with the caption from this sheet.", "Comments: if they ask what the guarantee doesn't cover, reply “It depends on the job, and Nain writes it down in your estimate so you know before we start.” If they write ESTIMATE, DM the form [link to the estimate form, to be confirmed] and the phone numbers (650) 207-1772 and (415) 238-0797."], "historias": [{"proposito": "Collect questions about estimates and guarantees", "formato": "Question box over a created image", "contenido": "Texto: \"Questions about estimates, guarantees or what's included? Ask here.\"", "interaccion": "Caja de preguntas: \"Ask about estimates\"", "pasos": ["In Canva create a 1080×1920 image with a #1b628d background and the text “Questions about estimates, guarantees or what's included? Ask here.” in Georgia Bold 60 pt white, at the top.", "Upload it to a story and add the question box with “Ask about estimates” in the center.", "Post at 9:00 a.m. Pacific time.", "At 3:30 p.m. pick the most repeated question from this box or from Wednesday the 13th's box for story 2."]}, {"proposito": "Answer a real question about the estimate", "formato": "Question box answer with a created image", "contenido": "Respuesta a la pregunta elegida. Plan B si no llega ninguna: pregunta \"Is the scaffolding included in the paint price?\" y respuesta \"It's quoted separately so you can see it. It covers delivery, setup, takedown and up to 30 days of use.\"", "interaccion": "Sticker de reacción con emoji 👍", "pasos": ["Tap the chosen answer in the response viewer and choose “Share answer”.", "Set the background to #f8f7f2 and write the answer in the Modern font, 32 pt, color #142f42.", "If no question came in, create in Canva a 1080×1920 image with a #f8f7f2 background with the question “Is the scaffolding included in the paint price?” at the top in Georgia Bold and the answer “It's quoted separately so you can see it. It covers delivery, setup, takedown and up to 30 days of use.” in Montserrat 36 pt.", "Add the emoji slider sticker with 👍.", "Post at 4:00 p.m. Pacific time. If the answer needs a fact that isn't in this sheet, mark it [TO VALIDATE] and wait for review before publishing."]}], "cuenta": "PP", "dia": "Thursday"}, {"fecha": "2027-01-15", "semana": 7, "formato": "Reel", "objetivo": "Sales", "tema": "What our estimate includes", "tipo_gancho": "Promise of clarity", "gancho_texto": "Know what you're paying for before anyone starts", "gancho_hablado": "Know what you're paying for before anyone starts", "visual": "Seconds 0–2: v9, the yellow house before, front view. Text at the top in a #142f42 box: “Know what you're paying for before anyone starts”.", "desarrollo": ["0–3 s: \"Know what you're paying for before anyone starts\" (debajo: v9 \"VIDEO HOUSE EXT 2026-11-16 .MP4\", segundos 0–3)", "3–9 s: \"Nain, the owner, comes out and does the estimate himself.\" (debajo: foto img/nain.jpg, 6 s con zoom lento)", "9–16 s: \"He walks the house with you. Wood that needs repair gets written down.\" (debajo: v8 \"VIDEO 2026-11-06 7.MP4\", segundos 5–12)", "16–22 s: \"The estimate says what prep is included and how many coats go on.\" (debajo: v6 \"VIDEO 2026-11-06 5.MP4\", segundos 8–14)", "22–29 s: \"Need scaffolding? It's its own line, so nothing hides inside the paint price.\" (debajo: v12 \"VIDEO-2026-09-23-14-29-30.mp4\", segundos 1–8)", "29–35 s: \"What the 4-year guarantee doesn't cover is written right there too.\" (debajo: v13 \"VIDEO 2026-11-16 1.mov\", segundos 5–11)", "35–42 s: \"Thinking about the outside this spring? A winter estimate just means the plan is ready early.\" (debajo: v9 \"VIDEO HOUSE EXT 2026-11-16 .MP4\", segundos 10–17)", "42–47 s: \"The estimate is free. Comment ESTIMATE and we'll send the form.\" (debajo: v14 \"VIDEO COMPLETE HOUSE 2026-11-16.mov\", segundos 0–5, con el logo horizontal abajo)"], "cta": "Comment ESTIMATE and we'll send the free estimate form.", "caption": "Our estimates spell it out: the prep, the coats, the scaffolding as its own line, and what the guarantee doesn't cover.\nNain still does every one himself.\nIf the outside is on your list for spring, getting the estimate in winter just gives you time. Comment ESTIMATE for the form.", "calculadora": 15, "produccion": "Job-site video + text", "clip": null, "notas": "Week 7, close of the estimate series. Soft nudge for the exterior estimate for spring, with no deadline. [TO VALIDATE: confirm that the written estimate states the prep included and the number of coats].", "instrucciones": ["Open a new CapCut project in 9:16 and place in this order: v9 “VIDEO HOUSE EXT 2026-11-16 .MP4” seconds 0–3 (note: the file name has a space before .MP4), photo img/nain.jpg 6 s with slow zoom, v8 “VIDEO 2026-11-06 7.MP4” seconds 5–12, v6 “VIDEO 2026-11-06 5.MP4” seconds 8–14, v12 “VIDEO-2026-09-23-14-29-30.mp4” seconds 1–8, v13 “VIDEO 2026-11-16 1.mov” seconds 5–11, v9 seconds 10–17, v14 “VIDEO COMPLETE HOUSE 2026-11-16.mov” seconds 0–5.", "Remove the original sound from all clips.", "On-screen text: copy each text from the script at its second. Montserrat Bold 56 pt, white, #142f42 box at 85%, top third. ESTIMATE in the last text in gold #ae9168.", "Horizontal logo (img/logo-horizontal.png) at the bottom center in seconds 42–47.", "Music: calm acoustic instrumental, no lyrics, from the Instagram library, at 30%. No voice.", "Cover: frame at second 1 of v9 with the text “Know what you're paying for before anyone starts” in Georgia Bold white on a #142f42 box.", "Post on Friday, Januar riday"}, {"fecha": "2027-01-16", "semana": 7, "formato": "Carrusel", "objetivo": "Sales", "tema": "Real case: red house to green", "tipo_gancho": "Before and after", "gancho_texto": "This house looked tired. Swipe to see it now.", "gancho_hablado": "This house looked tired. Swipe to see it now.", "visual": "Slide 1: real photo “PHOTO-2026-09-23-14-30-04.jpg” of the red/green house before, full page, with the text in a #142f42 box at the top.", "desarrollo": ["Slide 1: \"This house looked tired. Swipe to see it now.\" (foto \"PHOTO-2026-09-23-14-30-04.jpg\")", "Slide 2: \"During: ladders up, every board checked before paint.\" (foto \"PHOTO-2026-09-23-14-30-05.jpg\")", "Slide 3: \"After.\" (foto \"PHOTO-2026-09-23-14-30-04(2).jpg\")", "Slide 4: \"Another angle.\" (foto \"PHOTO-2026-09-23-14-30-05(2).jpg\")", "Slide 5: \"The details up close.\" (foto \"PHOTO-2026-09-23-14-30-06.jpg\")", "Slide 6: \"Licensed, insured, 4 years on our work. Checked by the owner before we left.\" (fondo #142f42, texto crema)", "Slide 7: \"Want yours to look like slide 3? Comment ESTIMATE for the free estimate form.\" (fondo #142f42, logo abajo)"], "cta": "Comment ESTIMATE for the free estimate form.", "caption": "Slide 1 is how we found it. Slide 3 is how we left it.\nIn between: ladders, prep, and Nain walking the job before the crew packed up.\nComment ESTIMATE and we'll send you the free estimate form.", "calculadora": null, "produccion": null, "clip": null, "notas": "Real proof with our own photos. No address or details that identify the house. “Every board checked” summarizes the confirmed prep (they repair or replace wood with minor damage). If the client gives permission for a quote of theirs, add it on slide 6 [real case to be confirmed].", "instrucciones": ["In Canva create a 1080×1350 design with 7 pages. Place each photo from the sheet full page on its slide.", "Check each photo: if the house number, a license plate or the street name shows, cover it with Blur at 80%.", "On sli hite, with a #1b628d background.", "Enlarge the post until it takes up 70% of the screen.", "Post at 4:00 p.m. Pacific time."]}], "cuenta": "PP", "dia": "Saturday"}, {"fecha": "2027-01-17", "semana": 7, "formato": "Imagen", "objetivo": "Authority", "tema": "License and insurance in plain sight", "tipo_gancho": "Invitation to verify", "gancho_texto": "Look us up before you let us in", "gancho_hablado": "Look us up before you let us in.", "visual": "Real photo “PHOTO 2026-11-16 4.JPG” (worker at the garage door) full page. At the bottom, a #142f42 strip with “Look us up before you let us in.” in Georgia Bold cream and “CSLB #1130045 · Insured · BBB accredited” in gold.", "desarrollo": ["Image text: \"Look us up before you let us in.\"", "Line under it: \"CSLB #1130045 · Insured · BBB accredited\"", "Bottom: \"Free estimates: (650) 207-1772\" and the logo"], "cta": "Call (650) 207-1772 or comment ESTIMATE for a free estimate.", "caption": "Before you let anyone work on your house, look them up. Our license is CSLB #1130045, we're insured, BBB accredited, and you can read our Yelp reviews.\nWhen you're ready, the estimate is free and Nain does it himself.\nCall (650) 207-1772 or (415) 238-0797, or comment ESTIMATE.", "calculadora": null, "produccion": null, "clip": null, "notas": "Close of week 7. All the facts are confirmed. Do not mention Yelp ratings or number of reviews without [TO VALIDATE].", "instrucciones": ["In Canva create a 1080×1350 design with the photo “PHOTO 2026-11-16 4.JPG” full page. If the house number shows, blur it at 80%.", "At the bottom place a #142f42 strip at 90%, 1080×420 px.", "Inside write “Look us up before you let us in.” in Georgia Bold 62 pt color #f8f7f2, centered.", "Below “CSLB #1130045 · Insured · BBB accredited” in Montserrat Bold 30 pt color #ae9168.", "At the very bottom “Free estimates: (650) 207-1772” in Montserrat Medium 26 pt color #f8f7f2 on the left and the horizontal logo at 300 px on the right.", "Export as PNG and post on Sunday, January 17 at 12:00 p.m. Pacific time with the caption from this sheet.", "To anyone who comments ESTIMATE reply “Sent! Check your DMs.” and DM the form [link to the estimate form, to be confirmed] and the phone numbers (650) 207-1772 and (415) 238-0797."], "historias": [{"proposito": "Invite them to request the estimate with an easy step", "formato": "Image made with phone numbers and link sticker", "contenido": "Texto: \"Free estimate. The owner comes out himself. (650) 207-1772 · (415) 238-0797\"", "interaccion": "Sticker de enlace \"Get a free estimate\" [enlace al formulario de estimado a confirmar]", "pasos": ["In Canva create a 1080×1920 image with a #142f42 background, the horizontal logo in the light version at the top at 700 px (if there is no light version, place it on a cream #f8f7f2 rectangle).", "Write “Free estimate. The owner comes out himself.” in Georgia Bold 64 pt color #f8f7f2.", "Below “(650) 207-1772 · (415) 238-0797” in Montserrat Bold 40 pt color #ae9168.", "Upload it to a story and add the “Get a free estimate” link sticker with [link to the estimate form, to be confirmed]. If it doesn't exist yet, write “Link in bio” below the phone numbers.", "Post at 9:00 a.m. Pacific time."]}, {"proposito": "Find out who is thinking about the exterior for spring", "formato": "Stock clip with poll", "contenido": "Clip v14 con el texto: \"Outside on your list this spring?\"", "interaccion": "Encuesta: \"Yes, thinking about it\" / \"Not this year\"", "pasos": ["Upload v14 “VIDEO COMPLETE HOUSE 2026-11-16.mov” in full (14 s) to a story.", "Write “Outside on your list this spring?” in the Classic font, white, #142f42 background, at the top.", "Add the poll with “Yes, thinking about it” and “Not this year”.", "Post at 4:00 p.m. Pacific time.", "The next day, DM anyone who voted “Yes, thinking about it”: “Thanks for voting! Whenever you're ready, we can do the estimate this winter so the plan is ready for the dry months. Just reply ESTIMATE.”"]}], "cuenta": "PP", "dia": "Sunday"}, {"fecha": "2027-01-18", "semana": 8, "formato": "Reel", "objetivo": "Followers", "tema": "Small jobs that are worth it", "tipo_gancho": "Unexpected before and after", "gancho_texto": "This trailer looked like it was hiding in the yard", "gancho_hablado": "Not every job is a whole house.", "visual": "First 2 s: photo of the camouflaged Airstream BEFORE (\"PHOTO 2026-11-09 3.jpeg\") full screen, with a slow zoom toward the side of the trailer. Hook text at the top.", "desarrollo": ["0–3 s: \"This trailer looked like it was hiding in the yard\" | Debajo: \"PHOTO 2026-11-09 3.jpeg\" (ANTES), acercamiento lento.", "3–8 s: \"Faded camo. Patchy spots. Hard to look at every morning.\" | Debajo: \"PHOTO 2026-11-09 3.jpeg\", paneo lento de izquierda a derecha.", "8–13 s: \"Small job. Same rules as a full house.\" | Debajo: \"PHOTO 2026-11-06 2.JPG\" (plásticos de protección en la casa azul).", "13–19 s: \"Protect what doesn't get paint. Fix the rough spots first. Then the color.\" | Debajo: \"PHOTO 2026-11-06 1.JPG\" (preparación con plásticos).", "19–26 s: \"After: one solid green\" | Debajo: \"PHOTO 2026-11-09 2.jpeg\" (Airstream VERDE terminado), acercamiento lento.", "26–32 s: \"Small jobs show you how a crew treats the edges\" | Debajo: \"PHOTO 2026-11-09 2.jpeg\", acercamiento al borde de la ventana del tráiler.", "32–38 s: \"Nain: 'I still do the estimates myself.'\" | Debajo: img/nain.jpg (Nain con las furgonetas).", "38–43 s: \"Follow to see the small jobs too, not only big houses\" | Debajo: logo horizontal sobre fondo #f8f7f2."], "cta": "Follow to see the small jobs too, not only big houses.", "caption": "Not every job is a whole house. This one was a camo trailer that blended into the yard a little too well.\nNow it's one clean green, and the prep was the same we do on a house.\nWe'll keep posting the small ones here too. Follow along.\n#BayAreaPainter #PicassoPainting", "calculadora": 15, "produccion": "Job-site photos + text", "clip": null, "notas": "Week 8: One-Room Refresh warm-up, no offer. Jan 18 is MLK Day: the reel does not mention the date and the day's stories do not sell. [TO VALIDATE: confirm that on the Airstream it was protected and repaired before painting, as the 8–19 s text says].", "instrucciones": ["Open CapCut and start a new 9:16 project (1080×1920). Import the exact files named in the script from the Picasso Painting/Fotos/11-2026/ folder.", "Trim each clip or photo to the seconds the script gives and place them in that order. Photos: slow zoom-in effect (zoom from 100% to 110%).", "On-screen text: Montserrat bold font, white, with a #142f42 box at 80% opacity, centered in the top third. Each text appears at the second indicated and disappears when the next one starts.", "Music: calm acoustic instrumental, no lyrics, from the Instagram library, volume at 30%. No voice.", "Last second: horizontal logo (img/logo-horizontal.png) on a #f8f7f2 background for 2 s.", "Reel cover: the first frame with the hook text. Post at 12:00 p.m. Pacific time (after the MLK Day story) and paste the caption as is.", "Comments: if someone asks whether you paint trailers or small things, reply: \"Yes, small jobs too. Send us a DM and we'll set up a free estimate.\" That message goes only in comments, never in today's stories."], "historias": [{"proposito": "Acknowledge Martin Luther King Jr. Day with a sober message, no selling", "formato": "Image created in Canva with text", "contenido": "Today we honor Dr. Martin Luther King Jr. and the work he gave his life to. Thank you to everyone in our Bay Area community who keeps that work going.", "interaccion": "No sticker. Message only.", "pasos": ["Canva 1080×1920, plain #142f42 background, no job-site photos.", "Text of the content in Georgia color #f8f7f2 size 54, centered in the middle of the screen.", "Small horizontal logo (width 300 px) at the bottom, centered, 120 px from the edge.", "No links, without the word ESTIMATE, no phone numbers or sti  </div><div id="lista"></div></section>

 <section id="glosario"><h2>11. Words we use in this guide</h2><div class="card"><table>${DATA.glosario.map(g=>`<tr><td><b>${esc(g.t)}</b></td><td>${esc(g.d)}</td></tr>`).join('')}</table></div></section>`;
 ['fMes','fSem','fFor'].forEach(id=>{const el=$('#'+id);el.value={fMes,fSem,fFor}[id];el.onchange=()=>{({fMes:v=>fMes=v,fSem:v=>fSem=v,fFor:v=>fFor=v})[id](el.value);lista()}});
 lista();
}
function calendar(m,posts){
 const ps=posts.filter(p=>p.fecha.startsWith(m)); const [y,mo]=m.split('-').map(Number);
 const pad=(new Date(y,mo-1,1).getDay()+6)%7;
 return `<div class="card"><h3>${MES[mo-1]} ${y}</h3><div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="h">${d}</div>`).join('')}${'<a class="e"></a>'.repeat(pad)}${ps.map(p=>`<a href="#d-${p.fecha}" class="${store.get('hecho-'+cuenta+p.fecha)?'done':''}"><b>${+p.fecha.slice(8)}</b><span class="tag f-${p.formato}">${FN[p.formato]}</span></a>`).join('')}</div><p class="legend"><span class="tag f-Reel" style="font-size:0;width:12px;height:12px;padding:0"></span> Reel · <span class="tag f-Carrusel" style="font-size:0;width:12px;height:12px;padding:0"></span> Carousel · <span class="tag f-Imagen" style="font-size:0;width:12px;height:12px;padding:0"></span> Image</p></div>`;
}
function lista(){
 const posts=DATA.posts.filter(p=>p.cuenta===cuenta&&(!fMes||p.fecha.startsWith(fMes))&&(!fSem||p.semana==fSem)&&(!fFor||p.formato===fFor));
 $('#lista').innerHTML=posts.map(day).join('')||'<p>No days match that filter.</p>';
 document.querySelectorAll('button.copy').forEach(b=>b.onclick=()=>{const t=b.previousElementSibling.innerText.replace(/^Slide \d+: /gm,'');const o=b.textContent;navigator.clipboard.writeText(t).then(()=>{b.textContent='Copied!';setTimeout(()=>b.textContent=o,1500)})});
 document.querySelectorAll('label.done input').forEach(i=>i.onchange=()=>{store.set(i.dataset.k,i.checked?'1':'');const a=document.querySelector(`.cal a[href="#d-${i.dataset.f}"]`);if(a)a.classList.toggle('done',i.checked)});
}
function clipBox(c){
 return `<div class="good"><b>Class clip</b><br><b>Video:</b> ${esc(c.video)}<br><b>Starts at:</b> “${esc(c.empieza)}”<br><b>Ends at:</b> “${esc(c.termina)}”<br><b>Where it is:</b> ${esc(c.ubicacion||'search for the line in the transcript')}${c.duracion?`<br><b>Length:</b> ${esc(c.duracion)}`:''}</div>`;
}
function day(p){
 const k='hecho-'+cuenta+p.fecha, isReel=p.formato==='Reel', isCar=p.formato==='Carrusel', F=FN[p.formato];
 const label=isReel?`What ${esc(CFG.voz)} says, line by line`:isCar?'What goes on each slide':'What the image says';
 return `<article class="day" id="d-${p.fecha}"><header><div><span class="tag">Week ${p.semana}</span><span class="tag f-${p.formato}">${F}</span><span class="tag">Goal: ${esc(p.objetivo)}</span>${p.produccion?`<span class="tag f-Imagen">${esc(p.produccion)}</span>`:''}<h3>${esc(p.dia)}, ${fdate(p.fecha)} · ${esc(p.tema)}</h3></div>
 <label class="done"><input type="checkbox" data-k="${k}" data-f="${p.fecha}" ${store.get(k)?'checked':''}> Posted</label></header>
 <div class="body">
 ${pend(p).length?`<p class="pending"><b>Before posting, sort out what's highlighted in yellow:</b> ${pend(p).join(', ')}.</p>`:''}
 <p class="hook">${esc(p.gancho_texto)}</p>
 <div class="sum"><p><b>Today's post:</b> ${F.toLowerCase()}${p.produccion?` made with <b>${esc(p.produccion.toLowerCase())}</b>`:''}.</p><p><b>At the end we ask:</b> ${esc(p.cta)}</p>${p.clip&&p.clip.video?`<p><b>Ask the editor for:</b> the class “${esc(p.clip.video)}”.</p>`:''}<p class="muted">Open the 4 parts below in order.</p></div>
 <details><summary>1. ${label}</summary>
 <p><b>${isReel?'First line':isCar?'Cover title':'Headline'}:</b> ${esc(p.gancho_hablado)}</p>
 <p><b>What shows at the start:</b> ${esc(p.visual)}</p>
 ${p.clip&&p.clip.video?clipBox(p.clip):''}
 <div class="say" data-copy>${list(p.desarrollo).map((x,i)=>`<p>${isCar?`<b>Slide ${i+1}:</b> `:''}${esc(x)}</p>`).join('')}</div>${isReel?'<button class="copy">Copy script</button>':''}</details>
 <details><summary>2. How to make it, step by step</summary>${ol(p.instrucciones)}${p.notas?`<p class="note"><b>Heads up:</b> ${esc(p.notas)}</p>`:''}</details>
 <details><summary>3. Post caption</summary><div class="say" data-copy><p>${esc(p.caption).replace(/\n/g,'<br>')}</p></div><button class="copy">Copy text</button></details>
 <details><summary>4. Today's 2 stories</summary><div class="cols">${list(p.historias).map((h,i)=>`<div class="story"><span class="tag">Story ${i+1}</span><span class="tag">${esc(h.formato)}</span><p><b>Purpose:</b> ${esc(h.proposito)}</p><p><b>What's shown or said:</b> ${esc(h.contenido)}</p><p><b>Sticker or interaction:</b> ${esc(h.interaccion)}</p>${h.pasos?`<b>How to make it:</b><ol class="plain">${list(h.pasos).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}</div>`).join('')}</div></details>
 </div></article>`;
}
$('#hoy').onclick=()=>{const t=new Date().toISOString().slice(0,10),f=t<CFG.inicio?CFG.inicio:t>CFG.fin?CFG.fin:t;fMes=fSem=fFor='';lista();const fs=[...document.querySelectorAll('.day')].map(e=>e.id.slice(2));if(!fs.length)return;const el=document.getElementById('d-'+(fs.filter(x=>x<=f).pop()||fs[0]));el.querySelector('details').open=true;el.scrollIntoView()};
$('.tabs').insertAdjacentHTML('afterbegin',CFG.cuentas.map(a=>`<button data-set="${a.id}" aria-pressed="false">${esc(a.nombre)}</button>`).join(''));
document.querySelectorAll('.tabs button[data-set]').forEach(b=>b.onclick=()=>{cuenta=b.dataset.set;store.set('cuenta',cuenta);fSem='';render();scrollTo(0,0)});
render();
</script>
</body>
</html>
